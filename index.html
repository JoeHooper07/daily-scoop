<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-16", "edition": "Monday 16 November 2026", "lede": ["Iran fired drones at a US base in Bahrain for the first time in two months and says tankers hit mines near Hormuz, days before Trump, Xi and Putin meet in Shenzhen.", "Labor's gas reservation bill faces a make or break Senate week, with unions and big industry jointly urging the Coalition and Greens to pass it.", "Coles is investigating a cyber security incident, while markets brace for a huge AI week with Nvidia's first results since Jensen Huang quit and Anthropic's Nasdaq float."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "As at 16 Nov, after the 3 Nov hike, the fifth this year; next decision 8 Dec"}, {"label": "ASX 200", "value": "9,082.2", "note": "Close on Fri 13 Nov, down 0.71%; futures pointed to a flat Monday open"}, {"label": "AUD/USD", "value": "67.71 US cents", "note": "As at Fri 13 Nov close, down 0.5% on the day"}, {"label": "Brent crude", "value": "US$95.84", "note": "Settle on Fri 13 Nov a barrel, a second straight weekly loss of about 2.5%"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Iran targets US base in Bahrain and claims tankers hit mines", "s": {"t": "The National", "u": "https://www.thenationalnews.com/news/gulf/2026/11/15/bahrain-issues-first-nationwide-alert-in-months-as-iran-claims-attack-on-base-hosting-us-helicopters/"}, "b": "Bahrain sounded its first nationwide alert since September on Sunday after Iran's Revolutionary Guards said they sent six drones at US radar at a helicopter base there. Bahrain and US Central Command say the drones were shot down. The Guards also claimed tankers struck mines south of the Strait of Hormuz on an unapproved route, which is not yet independently confirmed.", "w": "The nine month war had settled into a tense standoff, so a fresh strike raises the risk of new US action and another oil price spike, which would flow straight into Australian petrol prices."}, {"h": "Shenzhen three way summit locked in for Thursday, with Iran on the menu", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/14/trump-xi-and-putin-to-hold-first-three-way-summit-in-china"}, "b": "The White House and Kremlin have confirmed Trump, Xi and Putin will meet on 19 November on the sidelines of APEC in Shenzhen. The White House says nuclear arms control is the focus and Trump will raise the Iran war, while reports suggest Ukraine is off the agenda. A senior US official told Reuters not to expect any agreement.", "w": "Any arms control talk between the three biggest nuclear powers matters for global stability, and China is Australia's biggest trading partner."}, {"h": "ASEAN summit opens in Manila as leaders hunt trade deals", "s": {"t": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-15/world-leaders-at-manila-summit-seek-trade-to-offset-us-risks"}, "b": "The 49th ASEAN summit runs in Manila until Tuesday, with Albanese, Canada's Mark Carney, Brazil's Lula and China's Premier Li Qiang among the leaders attending. Much of the talk is about new trade deals to hedge against US tariffs. Diplomats do not expect a South China Sea code of conduct to be signed.", "w": "Southeast Asia is a fast growing market for Australian exports, and the South China Sea is where most of our trade sails."}, {"h": "Eisenkot and Netanyahu's Likud sit down for unity talks", "s": {"t": "Times of Israel", "u": "https://www.timesofisrael.com/yashar-likud-meet-for-unity-talks-as-eisenkot-bloc-moves-to-assert-control-over-knesset/"}, "b": "Negotiators from Gadi Eisenkot's Yashar party and Likud met on Sunday about a possible unity government. Eisenkot, who has 28 days from 8 November to form a government, wants to be prime minister himself. He is also courting the ultra Orthodox United Torah Judaism party, which denies reports of major progress.", "w": "Who governs Israel will shape the Gaza ceasefire and Israel's push for more strikes on Iran."}], "quick": [{"x": "COP31 negotiators in Antalya expect a first draft deal as early as Monday, with fossil fuels and adaptation finance the big fights before talks end Friday.", "t": "Hurriyet Daily News", "u": "https://www.hurriyetdailynews.com/turkiye-eyes-ambitious-climate-outcome-as-cop31-enters-final-week-229417"}, {"x": "Traders now fully price a US Federal Reserve rate hike on 8 to 9 December after October inflation came in hot at about 4%.", "t": "Motley Fool", "u": "https://www.fool.com/investing/2026/11/14/a-larger-than-normal-fed-rate-hike-in-december-now-looks-more-likely-here-s-why/"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "US grounds every flight after air traffic communications fail", "s": {"t": "PBS", "u": "https://www.pbs.org/newshour/nation/faa-grounds-all-flights-at-u-s-airports-due-to-air-traffic-control-communications-problems"}, "b": "The FAA halted all departures nationwide on Friday US time after a telecommunications outage hit every regional air traffic control centre. The stop lasted a bit over four hours, with about 11,000 flights and 1.5 million passengers scheduled. Officials say there is no sign yet of foul play.", "w": "Coming the same day as Microsoft's global outage, it is another reminder of how fragile critical systems are, a live issue for Canberra's own tech dependence."}, {"h": "OpenAI launches a wallet so its AI agents can shop for you", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/13/openai-chatgpt-wallet-dot-purchases.html"}, "b": "ChatGPT Wallet lets OpenAI's dots agents buy things on a user's behalf using tokenised card details, so the agent never sees the card number. It is limited to US Pro subscribers for now and every purchase needs the user's approval. OpenAI takes no cut of sales at launch, though some retailers, notably Amazon, block outside AI agents.", "w": "Agentic shopping could reshape online retail and payments, a space where Australian banks and retailers will need rules on liability and fraud."}, {"h": "White House task force wants a liability holiday for AI cyber reports", "s": {"t": "Bloomberg", "u": "https://bloomberg.com/news/articles/2026-11-14/white-house-urges-easing-liability-to-encourage-ai-disclosure"}, "b": "The White House AI task force recommends agencies give companies at least 12 months of relief from regulatory penalties if they report cyber vulnerabilities and incidents in good faith. It is a softer tone than last month, when the same group warned AI developers of consequences for not reporting. It also backed renewing a key 2015 cyber information sharing law that expires on 11 December.", "w": "Australia is building its own AI safety regulator, so the US approach of carrots over sticks is a useful comparison."}, {"h": "Big AI week: Nvidia reports without Huang as Anthropic floats", "s": {"t": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/article/nvidias-first-post-jensen-earnings-and-anthropics-ipo-what-to-watch-this-week-110000732.html"}, "b": "Nvidia reports quarterly results on Tuesday US time, with Wall Street expecting about US$109 billion in revenue and interim CEO Colette Kress leading the call. Anthropic is expected to price its IPO on Wednesday US time at US$70 to US$78 a share, raising up to about US$64 billion. Orders are reportedly about six times the shares on offer.", "w": "Nvidia is the bellwether for the AI boom that has driven global markets and Australian data centre stocks like NextDC."}], "quick": [{"x": "TechCrunch reports Huang's exit followed questions about his links to an executive at a Singapore data centre firm suspected of funnelling chips to China.", "t": "TechCrunch", "u": "https://techcrunch.com/2026/11/14/where-was-nvidias-security-team/"}, {"x": "A critical flaw nicknamed Node2Shell in the Brotli decoder bundled with Node.js is drawing urgent attention from security teams.", "t": "Cloud Security Alliance", "u": "https://labs.cloudsecurityalliance.org/research/alt-ciso-briefing-2026-11-14/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Unions and industry unite to push the gas reservation bill through the Senate", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-16/federal-politics-live-blog-senate-gas-nov-16/107388656"}, "b": "Union bosses including the AWU and business groups like the Ai Group have signed an open letter urging the Senate to pass Labor's gas reservation scheme this week. It would make exporters set aside up to 20% of their gas for the local market to push down prices. The Coalition objects to how Western Australia is treated, while the Greens want a gas export tax instead.", "w": "Labor needs either the Coalition or the Greens, so how this lands will show how the government can get contested laws through the Senate."}, {"h": "Australia and the Philippines sign a new defence pact", "s": {"t": "Euronews", "u": "https://www.euronews.com/2026/11/15/australia-and-philippines-sign-new-defence-pact-amid-south-china-sea-tensions"}, "b": "With Albanese watching in Manila on Sunday, the two countries signed an updated defence cooperation arrangement replacing a decades old memorandum. It is meant to speed up joint patrols, exercises, disaster relief and military infrastructure, and improve information sharing. Albanese said it is not aimed at any one country.", "w": "It deepens Australia's security ties in the South China Sea, where China and the Philippines regularly clash."}, {"h": "Victorian Labor and Liberals launch campaigns with polls pointing to a change", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-15/labor-liberal-coalition-campaign-launches-health-youth-crime/107387220"}, "b": "Premier Ben Carroll launched Labor's campaign in Moonee Ponds with a health pledge to cut elective surgery waits, while Opposition Leader Jess Wilson called 28 November the most consequential election in decades. New polling has the Coalition on track to win government for the first time since 2014. One Nation is also surging in Victoria.", "w": "A Labor loss in its strongest state would add pressure on Albanese's federal government, which is trailing One Nation in some polls."}], "quick": [{"x": "The Albanese government faces backlash over about $3 billion in Microsoft contracts after Friday's outage hit the AFP and ASIO.", "t": "Canberra Times", "u": "https://www.canberratimes.com.au/story/9391342/albanese-government-faces-backlash-over-3b-microsoft-deals/"}, {"x": "The latest Newspoll has One Nation on 28% of the primary vote, Labor 27% and the Coalition 21%, with the next one due in about a week.", "t": "Poll Bludger", "u": "https://www.pollbludger.net/2026/11/01/newspoll-labor-27-one-nation-28-coalition-21-open-thread/"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Coles investigates a cyber security incident", "s": {"t": "iTnews", "u": "https://www.itnews.com.au/news/coles-group-investigating-a-cyber-incident-630361"}, "b": "Coles told the ASX it is investigating a cyber incident and has found no evidence so far that customer, staff or supplier data was taken. Stores and online shopping are running normally. It is working with the Australian Cyber Security Centre and outside experts.", "w": "After Optus, Medibank and Qantas, any breach at a supermarket giant with millions of loyalty members would be a big test of new cyber reporting rules."}, {"h": "Wages and jobs data headline a busy local week", "s": {"t": "Capital Brief", "u": "https://www.capitalbrief.com/article/jobs-market-to-hold-steady-as-economists-eye-early-signs-of-lay-offs-1bc79bfc-3f54-494f-82e9-4b6b97149f7b/"}, "b": "Wednesday's Wage Price Index is expected to show wages up about 1% in the quarter and 3.3% to 3.4% over the year. Thursday's October jobs figures are tipped to show 20,000 to 30,000 new jobs with unemployment steady at 4.7%. ASX futures point to a flat open after Wall Street slipped on Friday.", "w": "With the cash rate at an 18 year high, strong wages could keep the RBA worried about inflation into 2027."}, {"h": "Nine denies it is being shopped to private equity", "s": {"t": "Mediaweek", "u": "https://mediaweek.com.au/nine-shuts-down-claims-shopped-private-equity"}, "b": "Nine Entertainment has rejected reports it is being pitched to private equity buyers, with talk centred on selling the AFR. Its shares slid from above $1 at the start of the year to 63 cents in October. CEO Matt Stanton argues investors are overlooking the AFR, which made more than half of Nine's publishing earnings in FY26.", "w": "A sale would reshape Australia's already concentrated media market."}, {"h": "Service Stream buys Programmed for $975 million", "s": {"t": "Small Caps", "u": "https://smallcaps.com.au/article/weekly-wrap-2026-11-13-5a448530-7f72-4575-8407-9efae2f1f140"}, "b": "Infrastructure services firm Service Stream agreed to buy staffing and maintenance group Programmed for $975 million and is raising $475 million in new shares to help pay for it. The deal is expected to complete around 1 March 2027. Separately, Goodman Group and Digital Realty took a joint 9.9% stake in data centre operator NextDC but say they have no plans to bid.", "w": "Both deals show how hot demand is for businesses tied to infrastructure and the AI data centre build out."}], "quick": [{"x": "Westpac thinks 4.85% is likely the peak RBA cash rate and expects a pause in December.", "t": "Westpac IQ", "u": "https://www.westpaciq.com.au/economics/2026/11/rba-decision-3-november-2026"}]}], "explainer": {"term": "Domestic gas reservation", "body": "A gas reservation scheme forces companies that export gas to keep a share of it for local buyers. Australia is one of the world's biggest gas exporters, yet east coast households and factories often pay prices set by overseas demand. Labor's bill would require exporters to set aside up to 20% of their output for the domestic market, aiming to boost local supply and push down prices. Western Australia has run its own version since 2006, which is partly why the Coalition is fighting over how WA is treated. Critics say reservation can deter new gas investment, while supporters say it protects manufacturing jobs and power bills."}, "ahead": [{"d": "Tue 17 Nov", "e": "ASEAN summit wraps up in Manila; Senate debate on the gas reservation bill expected this week."}, {"d": "Wed 18 Nov", "e": "ABS Wage Price Index; Nvidia results early morning AEDT (Tuesday US time); APEC leaders' week begins in Shenzhen."}, {"d": "Thu 19 Nov", "e": "ABS October jobs figures; Trump, Xi and Putin meet in Shenzhen; Anthropic expected to price its IPO overnight."}, {"d": "Fri 20 Nov", "e": "Anthropic due to start trading on Nasdaq overnight; COP31 climate talks scheduled to end in Antalya."}, {"d": "Wed 25 Nov", "e": "US PCE inflation data out overnight, a key input for the Fed's December decision."}, {"d": "Sat 28 Nov", "e": "Victorian state election."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
