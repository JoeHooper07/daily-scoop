<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">
{"date": "2026-10-29", "edition": "Thursday 29 October 2026", "lede": ["Australian inflation hit 4.3% in September, which makes an RBA rate rise on Melbourne Cup Day (3 November) close to a sure thing.", "Israel's election count has left Netanyahu's bloc short of a majority again, with Arab parties on a record number of seats and holding the balance.", "Oil is back around US$115 a barrel as Iran talks drag on, and the US Federal Reserve held rates with two members wanting a hike."], "numbers": [{"label": "Australian CPI", "value": "4.3%", "note": "Annual, year to September 2026, up from 4.0% in August (ABS, released 28 Oct)"}, {"label": "RBA cash rate", "value": "4.60%", "note": "As at 28 Oct, after a September rise; next decision 3 Nov"}, {"label": "ASX 200", "value": "8,847", "note": "Last close, 28 Oct 2026, down 0.03%"}, {"label": "Brent crude", "value": "US$115", "note": "Approx. settle on 28 Oct 2026, near six month highs"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Israel's election count leaves no bloc with a majority, and Arab parties surge", "s": {"t": "Times of Israel", "u": "https://www.timesofisrael.com/with-85-of-votes-counted-netanyahu-bloc-has-53-seats-eisenkot-48-arab-parties-surge-to-19/"}, "b": "With about 90% of votes counted, Netanyahu's bloc was on roughly 53 seats and Gadi Eisenkot's opposition bloc on 48. A majority in the 120 seat Knesset needs 61. Arab parties were projected at up to 19 seats, a record. Eisenkot has all but ruled out governing with them, and counts have shifted a little since election night.", "w": "Neither side can govern easily, so weeks of coalition haggling, or another election, are now likely. Official results are due on 4 November. The war with Iran and Gaza dominated the campaign, so the outcome also affects how Israel handles both."}, {"h": "Oil climbs back to about US$115 as Iran diplomacy and threats run side by side", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/10/28/oil-price-today-wti-brent-hormuz.html"}, "b": "Brent rose to roughly US$115 a barrel on Wednesday, after jumping above US$117 last week following attacks on tankers near the Strait of Hormuz. Officials from Saudi Arabia, Turkey and Pakistan met Iranian leaders in Tehran on Monday and agreed to keep talking. Reports say the US may renew strikes on Iran after its midterm elections.", "w": "Hormuz carries a big share of the world's oil, so this feeds straight into Australian petrol prices and the inflation numbers the RBA is watching."}, {"h": "US Fed holds rates at 3.75% to 4%, but two officials wanted a hike", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/10/28/fed-interest-rate-decision-october-2026.html"}, "b": "The Fed left its benchmark range unchanged days before the 3 November midterms. Governor Lisa Cook and Cleveland Fed president Beth Hammack dissented, preferring a quarter point rise. The statement said activity is expanding at a strong pace and inflation remains elevated. Chair Kevin Warsh also said the Fed will hold fewer rate setting meetings from 2027.", "w": "US rates shape the Australian dollar and global borrowing costs. Two hawkish dissents suggest the next move in America is more likely up than down."}], "quick": [{"x": "Ukraine's Zelenskyy says Kyiv is close to running out of US made air defence interceptors, while the Kremlin calls expected Putin talks with Trump's envoys very important.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-21/ukraine-interceptor-missiles-zelenskyy-us-trump-tensions/107290418"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Meta lifts its AI spending plans and the market flinches", "s": {"t": "24/7 Wall St", "u": "https://247wallst.com/investing/2026/10/22/meta-falls-3-as-higher-ai-spending-outlook-overshadows-earnings-beat-alphabet-dips-microsoft-holds-steady/"}, "b": "Meta reported third quarter revenue of US$64.6 billion, up 26%, then raised its AI capital spending range to US$135 billion to US$145 billion. Its shares fell about 3%. Estimates put the big US tech firms' combined AI spending near US$700 billion this year, with some forecasting more than US$1 trillion in 2027.", "w": "Investors are asking when this spending pays off, and Meta's share price drop shows patience is wearing thin. A sharp pullback in AI stocks would hit the superannuation funds and ASX tech names exposed to the trade."}, {"h": "eSafety chief backs a right for people to sue tech platforms", "s": {"t": "MLex", "u": "https://www.mlex.com/mlex/data-privacy-security/articles/2543269"}, "b": "At Senate estimates this week, eSafety Commissioner Julie Inman Grant said Australia needs a private right of action, meaning individuals could take platforms to court for breaching online safety duties. She also said the regulator is using expanded investigative powers to check compliance with the under 16 social media ban.", "w": "Today only the regulator can chase platforms. Letting people sue would raise the legal risk for global tech firms operating here."}, {"h": "House passes Digital Duty of Care bill, targeting chatbots and algorithms", "s": {"t": "Mezha", "u": "https://mezha.net/eng/news/mezha-2b746a3602e56a1c3f92946d_australia-s_digital_duty"}, "b": "The Online Safety Amendment (Digital Duty of Care) Bill cleared the House of Representatives on 28 October. It would make social media, games, apps and chatbots take reasonable steps to prevent harm, ban chatbots that seek emotional intimacy with children, and require an easy opt out of algorithm driven feeds. Penalties reach $108.2 million, and a Senate inquiry comes first.", "w": "It is one of the first laws anywhere to put a general safety duty on AI chatbots, and what Australia does will be watched overseas."}], "quick": [{"x": "Nvidia boss Jensen Huang said earlier this month that AI cyber incidents so far could have been avoided with better containment and monitoring of AI agents.", "t": "Fortune", "u": "https://fortune.com/2026/10/14/nvidia-ceo-huang-says-society-shouldnt-tolerate-ai-cyber-incidents-says-ai-doomers-ought-to-stop-working-on-the-technology/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Parliament returns with tributes to Helen Haines after the car attack", "s": {"t": "CNN", "u": "https://www.cnn.com/2026/10/21/australia/australia-lawmaker-helen-haines-legs-amputated-intl-hnk"}, "b": "Parliament resumed in Canberra on Wednesday with Albanese leading tributes to the independent MP for Indi. Haines was struck by a car in Wangaratta on 19 October in what police called a targeted attack, and doctors had to amputate both her legs. A man has been charged, including with harming a Commonwealth public official.", "w": "The attack is driving a rethink of how MPs are protected, with the government promising a swift response on security measures. Panic buttons for MPs and electorate offices are among the ideas on the table, and the debate cuts across both major parties."}, {"h": "Latest polls: Labor ahead, One Nation easing, Coalition stuck", "s": {"t": "The Conversation", "u": "https://theconversation.com/labor-and-the-greens-improve-in-newspoll-and-resolve-and-one-nation-drops-293931"}, "b": "In early October Newspoll had Labor on 29% of the primary vote, One Nation 28%, the Coalition 20% and the Greens 14%. Resolve had Labor 29%, One Nation 25% and the Coalition 23%. One Nation fell two points in each poll, and neither published a two party preferred figure.", "w": "A three way contest on the right and centre makes seat outcomes hard to predict, because preferences matter more than ever. It also shapes how hard the Coalition pushes against Labor bills, as it fights One Nation for the same voters."}, {"h": "Digital Duty of Care bill now heads to a Senate fight", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-28/crossbench-push-for-labor-to-challenge-big-tech/107316400"}, "b": "The Coalition will oppose the bill, while the Greens back it. Crossbenchers want to add a free avenue for people to challenge big tech, and Communications Minister Anika Wells has said Labor is open to an individual legal path. A Senate inquiry will hear evidence on 9 November.", "w": "Labor needs the Greens or the Coalition in the Senate, so amendments like this are the price of passage."}], "quick": [{"x": "A Nationals MP was suspended from Question Time after swearing at the Prime Minister.", "t": "ABC News", "u": "https://abc.net.au/news/2026-10-28/federal-politics-live-blog-oct-28/107315976"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Inflation jumps to 4.3% and an RBA rate rise next week looks all but locked in", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-28/inflation-september-cpi-ahead-of-november-interest-rate-call/107317382"}, "b": "Annual consumer price inflation rose to 4.3% in the year to September, from 4.0% in August, with fuel a major driver. The trimmed mean, the RBA's preferred underlying gauge, rose 1.0% in the quarter against the bank's 0.8% forecast. Markets now price a quarter point rise to 4.85% on 3 November at roughly 80% to 90%, and all four big banks expect it.", "w": "A rate rise means higher variable mortgage repayments within weeks. It would be the second rise in two months, after the September increase, and the cash rate would reach its highest level since 2011."}, {"h": "ASX 200 gives up early gains after the inflation shock", "s": {"t": "Market Index", "u": "https://www.marketindex.com.au/news/evening-wrap-asx-200-slides-on-inflation-shocker-as-cup-day-rba-rate-hike"}, "b": "The ASX 200 was up about 0.9% before the data, then finished at 8,847.3, down 2.8 points. The Australian dollar sat near 70.3 US cents. Energy stocks were supported by high oil, and critical minerals names rallied on the AI trade, while rate sensitive stocks such as the banks were under pressure.", "w": "A higher cash rate usually hits property and growth stocks first, and helps the dollar by attracting foreign money."}, {"h": "Ingenia bidding war: Warburg Pincus lifts offer to $5.50 a security", "s": {"t": "Motley Fool Australia", "u": "https://www.fool.com.au/2026/10/28/ingenia-communities-receives-improved-5-50-takeover-proposal/"}, "b": "Ingenia Communities, which owns seniors and holiday housing communities, received an improved proposal from Warburg Pincus of up to $5.50 per stapled security. It tops a rival cash bid from AVID Property Group worth about $2.18 billion. AVID has until 1 November to match or beat it.", "w": "Private equity keeps buying listed Australian assets, which shrinks the ASX and rewards shareholders in the short term. A bidding war like this usually lifts the final price, and regulators such as FIRB and the ACCC may still have a say."}], "quick": [{"x": "Swedish private equity firm EQT agreed to buy waste company Cleanaway for $3.095 a share in a deal valuing it at roughly $9.3 billion, with a shareholder vote due by February 2027.", "t": "Rask Media", "u": "https://www.raskmedia.com.au/2026/10/19/cleanaway-asxcwy-share-price-soars-20-on-agreed-takeover/"}, {"x": "Japan's Daiichi Life has made a formal $7.8 billion bid for annuities seller Challenger, part of a $22.4 billion wave of takeovers.", "t": "Wilson Asset Management", "u": "https://wilsonassetmanagement.com.au/34781-2/"}]}], "explainer": {"term": "Capex (capital expenditure)", "body": "Capex is money a company spends on long lived assets, like data centres, chips, factories and equipment, rather than day to day running costs. It matters because it is spent upfront while the profits arrive years later, if they arrive at all. That is why Meta lifting its AI capex to as much as US$145 billion rattled investors even though its sales grew 26%. Higher capex lowers free cash flow now and raises the bar for future earnings. For Australians, it also drives demand for power, copper and other minerals, and swings the value of the global tech shares inside many super funds."}, "ahead": [{"d": "Sun 1 Nov", "e": "AVID Property Group's deadline to match or beat Warburg Pincus's $5.50 offer for Ingenia"}, {"d": "Tue 3 Nov", "e": "RBA rate decision on Melbourne Cup Day, with a quarter point rise widely expected"}, {"d": "Wed 4 Nov", "e": "US midterm election results start arriving in Australian time; Israel's official election results due"}, {"d": "Thu 5 Nov", "e": "Atlantic Lithium's first court hearing on its takeover by Huayou; European Lithium scheme implementation"}, {"d": "Fri 6 Nov", "e": "European Lithium delists from the ASX"}, {"d": "Mon 9 Nov", "e": "Senate inquiry hearing on the Digital Duty of Care bill"}]}
</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
