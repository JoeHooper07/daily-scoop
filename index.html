<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-26", "edition": "Thursday 26 November 2026", "lede": ["Inflation jumped to 4.9% in the year to October, well above forecasts, but the big four banks still expect the RBA to sit tight in December.", "Anthony Albanese and Matthew Wale signed a treaty in Canberra making Australia the Solomon Islands' main security partner and ruling out foreign military bases there.", "Washington proposed new tariffs of up to 35% on 14 economies, with Australia not on the list, while oil jumped 3.5% as Iran hardened its stance on Hormuz."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "Banks tip a hold at the December meeting despite hot October CPI (as at 26 Nov)"}, {"label": "Annual CPI", "value": "4.9%", "note": "Year to October, up from 4.3%; trimmed mean 3.8% (released 25 Nov)"}, {"label": "ASX 200", "value": "8,692.4", "note": "Down 0.39% on Wed 25 Nov; AUD eased to about 65.90 US cents"}, {"label": "Brent crude", "value": "US$94.61", "note": "Up 3.5% at Wed 25 Nov settle on Hormuz tensions"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "US proposes new tariffs of up to 35% on 14 economies", "s": {"t": "USTR", "u": "https://ustr.gov/about/policy-offices/press-office/press-releases/2026/november/ustr-makes-determinations-and-proposes-actions-14-section-301-investigations-relating-structural"}, "b": "The US Trade Representative released findings from its probe into factory overcapacity and proposed tariffs on 14 economies including China, the EU, Japan, India and Vietnam. Reported rates run up to 35%, with an extra 20% on China and a 15% cap for the EU and Japan under existing deals. This is a proposal only: hearings are set for late January, and probes into Norway and Mexico are still open.", "w": "These tariffs would replace the ones the Supreme Court struck down in February. Australia is not targeted, but slower trade among its biggest customers would still hit demand for our exports."}, {"h": "Iran rules out talks with the US until seven conditions are met", "s": {"t": "Gulf News", "u": "https://gulfnews.com/world/mena/middle-east-conflict-us-investigates-iran-over-cyberattacks-on-50-ships-as-fresh-sanctions-target-irans-shadow-banking-network-1.500758688"}, "b": "Iran's chief negotiator, parliament speaker Mohammad Bagher Ghalibaf, says there will be no talks with Washington until seven Iranian conditions are met. Tehran also warned ships against using unauthorised routes through the Strait of Hormuz after reports of three vessels hitting mines and catching fire. Qatar insists both sides are still engaging through its mediation.", "w": "With Hormuz squeezed, oil prices keep swinging, and that feeds straight into Australian petrol prices and the inflation figures the RBA watches."}, {"h": "Spain votes on Sunday with the right tipped to win", "s": {"t": "Chatham House", "u": "https://www.chathamhouse.org/2026/11/spains-election-could-see-europes-far-right-firewall-begin-fall-apart"}, "b": "Spaniards head to a snap national election on 29 November, called by Socialist prime minister Pedro Sánchez. Most independent polls have the conservative People's Party well ahead but needing the hard right Vox party to govern, with the two together projected at roughly 183 to 194 of 350 seats. Only the state run CIS pollster has Sánchez in front.", "w": "A People's Party and Vox government would weaken the so called firewall that has kept the far right out of power in big EU countries."}, {"h": "Ukraine defends deadly strikes on Russian ships in Libya", "s": {"t": "ABC", "u": "https://abc.net.au/news/2026-11-25/ukraine-defends-attack-on-russian-ships-in-libya/107427720"}, "b": "Ukraine says a Russian cargo ship it hit at a naval base in Benghazi was carrying weapons, after the strikes killed two Libyans. Kyiv says it is acting in self defence. Back home, both sides traded overnight drone strikes on energy sites, with Russian attacks causing blackouts in five Ukrainian regions.", "w": "Ukraine taking the fight to Russian supply lines in Africa shows how far the war has spread, even as stalled peace talks continue."}], "quick": [{"x": "Gaza's health ministry declared a meningitis epidemic alert after October cases hit 272, more than five times the usual rate, as Israeli strikes killed seven people.", "t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/24/israeli-air-strikes-in-gaza-kill-7-as-doctors-warn-of-meningitis-outbreak"}, {"x": "Brent crude rose 3.5% to settle at US$94.61 a barrel on Wednesday, having swung between US$72 and US$114 since the US and Israel struck Iran in February.", "t": "BNN Bloomberg", "u": "https://bnnbloomberg.ca/markets/2026/11/25/ai-rout-continues-as-market-exuberance-fades-over-improbable-return-of-nvidias-huang"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Schumer accuses Nvidia's Huang of breaking US export law", "s": {"t": "HuffPost", "u": "https://www.huffpost.com/entry/schumer-accuses-nvidia-ceo-violating-us-export-control-law_n_6b05f9ade4b03d22835f516f"}, "b": "Senate Democratic leader Chuck Schumer says Jensen Huang shipped advanced chips to China in breach of export controls, a day after Nvidia's board reinstated him as CEO. No charges have been laid. Huang faces a closed door briefing with three House committees on 1 December and a public Senate Banking hearing on 3 December, US time.", "w": "If Congress tightens chip export rules, Nvidia's China sales shrink, and that hits the AI trade that drives a big chunk of global share markets."}, {"h": "Nvidia slides another 3.9% as hot US inflation weighs on tech", "s": {"t": "Motley Fool", "u": "https://www.fool.com/coverage/stock-market-today/2026/11/25/stock-market-today-nov-25-nvidia-slides-3-9-as-the-market-considers-hot-pce-inflation-data-and-new-tariff-proposals/"}, "b": "Nvidia fell 3.9% to US$149.30 on Wednesday, giving back much of Monday's surge on Huang's return. The Nasdaq lost 0.6% and the S&P 500 0.25%, though the Dow recovered to close up 0.3%. Investors were rattled by hotter US inflation data and the new tariff plans.", "w": "Tech led the ASX lower on Wednesday too, so expect Wall Street's AI mood to keep setting the tone here."}, {"h": "TSMC halts some advanced chip orders from Chinese clients", "s": {"t": "TrendForce", "u": "https://www.trendforce.com/news/2026/11/20/news-tsmc-samsung-reportedly-pause-china-consumer-chip-shipments-under-new-u-s-rules-16nm-orders-affected/"}, "b": "A new US rule that took effect on 19 November stops chipmakers relying on their own checks of whether Chinese designs fall under export controls. TSMC has reportedly told affected Chinese designers to stop orders at 16 nanometres and below unless they hold US licences, pushing them back to older technology. Samsung has reportedly done the same, and phone chips for brands like Xiaomi and Oppo may be caught up.", "w": "It shows Washington squeezing China's access to cutting edge chips through manufacturers, not just through chip sellers like Nvidia."}, {"h": "ASIO chief warns data centres and AI open new doors to foreign interference", "s": {"t": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-22/australia-spy-chief-warns-of-data-center-ai-risks-age-reports"}, "b": "ASIO boss Mike Burgess has warned that the boom in data centres and AI could expose Australia to foreign interference, including through covert ownership of data centres. Deputy Prime Minister Richard Marles called the build out a new route for foreign actors. The government is moving to make AI a bigger national security priority.", "w": "Australia is chasing billions in data centre investment, so how tightly security agencies vet owners will shape who gets to build them."}], "quick": [{"x": "The Australian Computer Society wants a review of sovereign risk in Australian IT and tighter accountability for critical AI systems.", "t": "Aus Cyber Security Magazine", "u": "https://australiancybersecuritymagazine.com.au/acs-urges-sovereign-risk-review-ahead-of-wong-ai-security-speech/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Australia and Solomon Islands sign their new security treaty", "s": {"t": "PM's office", "u": "https://www.pm.gov.au/media/signing-australia-solomon-islands-treaty"}, "b": "Anthony Albanese and Solomon Islands PM Matthew Wale signed the treaty at Parliament House on Wednesday. It names Australia as the main security partner, rules out any foreign military base in Solomon Islands and requires consultation on critical infrastructure and security ties with countries outside the Pacific Islands Forum. Solomon Islanders also get easier visas and more work opportunities in Australia.", "w": "It follows similar deals with PNG, Vanuatu and Fiji and is the clearest sign yet of China's security push in the Pacific being rolled back."}, {"h": "Digital duty of care law passes Parliament", "s": {"t": "News24", "u": "https://www.news24.com.au/politics/australian-politics/gross-overreach-digital-duty-of-care-passes-despite-final-ditch-effort-from-coalition/news-story/2a4068aa38981f9fa651aa3daefee0c2?nk=110b5e7b9ee2f4f574ef0e4bcb8a0765-1795642494"}, "b": "With Greens support, Labor's bill cleared the Senate with amendments on Wednesday and went back to the lower house to be finalised. It forces big platforms to take reasonable steps to prevent foreseeable harm to users. The Coalition called it gross overreach and made a last ditch attempt to stop it.", "w": "Australia now has some of the world's toughest online safety rules, which will test how far global tech firms change products for one market."}, {"h": "Greens back Labor's trust tax in exchange for a hit on private jets", "s": {"t": "SBS", "u": "https://www.sbs.com.au/news/article/higher-taxes-on-trusts-to-pass-with-support-of-greens/pk26bubm7"}, "b": "The deal locks in a 30% minimum tax on discretionary trust income from 2029 to 2030, raising an estimated $4.5 billion in its first year. Some private jet owners will pay more, while the Greens dropped a demand to tax trust payments to private schools, sports clubs and churches in return for more funding for the ATO and charities regulator. Opposition leader Angus Taylor called it a dirty deal, and business groups said it hurts small business.", "w": "Trusts are widely used by family businesses and wealthy households to split income, so this is one of Labor's biggest tax changes."}, {"h": "Final Victorian poll has Labor third on 20% two days out", "s": {"t": "Poll Bludger", "u": "https://www.pollbludger.net/2026/11/25/resolve-strategic-labor-20-coalition-31-one-nation-25-in-victoria/"}, "b": "The last Resolve poll for The Age has the Coalition on 31%, One Nation 25%, Labor 20% and the Greens 13%. Labor fell two points in a fortnight while One Nation rose two. Liberal leader Jess Wilson is well ahead of Premier Ben Carroll as preferred premier.", "w": "A Labor wipeout in its strongest state would be a warning sign for the Albanese government heading into 2027."}], "quick": [{"x": "The gas reservation bill, which would make LNG exporters hold back up to 20% of exports for local use from 2028, still needs Coalition or Greens votes on Parliament's last sitting day of the year.", "t": "PS News", "u": "https://psnews.com.au/all-eyes-on-senate-this-week-over-gas-reservation-scheme/188729/"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Inflation jumps to 4.9%, its highest since 2023", "s": {"t": "ABS", "u": "https://www.abs.gov.au/media-centre/media-releases/cpi-rose-49-year-october-2026"}, "b": "Prices rose 4.9% in the year to October, up from 4.3% and above the 4.7% economists expected. Electricity is up 25.2% over the year because last year's federal rebates have ended, while fuel rose 6.3% in October alone on higher world oil prices. The trimmed mean, the RBA's preferred underlying measure, climbed to 3.8% from 3.6%.", "w": "Underlying inflation is still heading the wrong way, which keeps pressure on mortgage holders and on the RBA."}, {"h": "Big banks still tip an RBA hold in December", "s": {"t": "Aussie", "u": "https://www.aussie.com.au/insights/news/expert-predictions-rba-rates/"}, "b": "ANZ, Westpac and CBA all expect the cash rate to stay at 4.85% next month after back to back hikes. Westpac thinks the hiking phase is over, while ANZ and CBA see more risk of another rise. CBA's Belinda Allen says February is the meeting to watch.", "w": "A rising jobless rate gives the RBA a reason to pause, but another hot inflation print could put a February hike back on the table."}, {"h": "ASX slips 0.4% as hot inflation kills rate cut hopes", "s": {"t": "IBTimes", "u": "https://www.ibtimes.com.au/asx-200-falls-australia-inflation-three-year-high-1879318"}, "b": "The ASX 200 fell 34 points to 8,692.4 on Wednesday, its ninth loss in ten sessions. Tech stocks led the decline, followed by miners, while healthcare and energy gained. The Aussie dollar eased to about 65.90 US cents.", "w": "Higher for longer interest rates weigh on share valuations, especially growth stocks like tech."}, {"h": "Develop Global to mothball its Pioneer Dome lithium mine", "s": {"t": "Grafa", "u": "https://grafa.com/en/news/australia/develop-global-to-pause-pioneer-dome-in-december"}, "b": "Develop Global will put its Pioneer Dome lithium mine in Western Australia into care and maintenance in December after a sharp fall in lithium prices. A floor price deal with commodity trader Trafigura, running to 31 December, should let it recover the project's capital costs before it stops. Shares reportedly fell about 11% to $2.43.", "w": "It is another sign of the lithium slump hitting WA miners and regional jobs."}], "quick": [{"x": "The ACCC cleared Calvary Health Care to buy 14 hospitals nationally, finding no competition concerns and no other interested buyers.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-26/newcastle-hunter-local-news-briefing/107428092"}, {"x": "US core PCE inflation, the Fed's preferred gauge, rose to 3.3% in October from 3.1%, above the 3.2% expected.", "t": "Advisor Perspectives", "u": "https://www.advisorperspectives.com/dshort/updates/2026/11/25/inflation-pce-price-index-october-2026"}]}], "explainer": {"term": "Base effect", "body": "A base effect happens when an annual inflation number jumps or drops because of what happened a year earlier, not because of anything new this month. Annual inflation compares prices with the same month last year, so if prices were unusually low back then, today's figure looks big. That is why electricity shows a 25.2% annual rise: government rebates cut bills sharply in late 2025, and that cheap month has now dropped out of the comparison. In fact, power prices actually dipped slightly in October itself. Economists look through base effects by checking monthly changes and underlying measures like the trimmed mean."}, "ahead": [{"d": "Thu 26 Nov", "e": "Last sitting day of federal Parliament for 2026, with the gas reservation bill still in play."}, {"d": "Fri 27 Nov", "e": "Steadfast shareholders vote on the $6 a share takeover; US markets closed overnight for Thanksgiving."}, {"d": "Sat 28 Nov", "e": "Victorian state election day."}, {"d": "Sun 29 Nov", "e": "Spain holds its snap national election."}, {"d": "Wed 2 Dec", "e": "ABS releases September quarter GDP; Reliance Worldwide votes on the Brookfield takeover; Jensen Huang briefs House committees behind closed doors (Tue 1 Dec US time)."}, {"d": "Fri 4 Dec", "e": "Jensen Huang testifies at a public Senate Banking hearing on export controls (Thu 3 Dec US time)."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
