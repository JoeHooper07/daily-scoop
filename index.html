<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-10-27", "edition": "Tuesday 27 October 2026", "lede": ["Israelis vote today in an election that polls say could leave neither side with a majority.", "Donald Trump says there will be no Iran strike for now, but he is still choosing between a deal and more force, and Brent crude sits near US$115.", "Anthropic has filed to list on the Nasdaq, while Australian markets now price better than even odds that the RBA lifts rates on Melbourne Cup day."], "numbers": [{"label": "RBA cash rate", "value": "4.60%", "note": "Current rate as at 26 Oct; markets see a hike to 4.85% on 3 Nov at above 60% odds"}, {"label": "ASX 200", "value": "8,810", "note": "Close on 26 Oct, up 0.2% after an early drop"}, {"label": "AUD/USD", "value": "70.3c", "note": "As at 26 Oct, up from 70.12c on Friday"}, {"label": "Brent crude", "value": "~US$115", "note": "As at 26 Oct, down about 1.5% after a 3% jump on Friday"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Israelis vote today with the polls pointing to deadlock", "s": {"t": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-912743"}, "b": "Voting is under way for the 120 seat Knesset (Israel's parliament). Final polls had Gadi Eisenkot's Yashar party narrowly ahead of Benjamin Netanyahu's Likud, with Naftali Bennett's party third. One Maariv poll gave the opposition parties 54 seats against 48 for Netanyahu's bloc, but neither side was near the 61 needed for a majority.", "w": "A drawn out coalition fight is likely, and the winner will shape Israel's stance on the Iran war and Gaza. Oil and markets will react to any shift in Israeli policy."}, {"h": "Trump holds off on an Iran strike but keeps the threat alive", "s": {"t": "CBS News", "u": "https://www.cbsnews.com/live-updates/iran-war-trump-us-oil-gas-prices-strait-of-hormuz-midterms/"}, "b": "Trump told reporters there would be no strike today, and said he is still weighing a deal against action to finish Iran off. US Central Command has reportedly drawn up follow up options, aimed at after the 3 November midterm elections. Iranian officials say indirect talks continue and that Tehran will not shift its positions either way.", "w": "Every swing in this decision moves oil, and Goldman Sachs reckons roughly US$25 of the Brent price is war risk. That flows straight into Australian petrol prices and RBA thinking."}, {"h": "Brazil's top court backs Lula's win as Bolsonaro asks for annulment", "s": {"t": "CBS News", "u": "https://www.cbsnews.com/news/brazil-presidential-runoff-lula-flavio-bolsonaro/"}, "b": "With every vote counted, Lula took about 51.8% against 48.2% for Flávio Bolsonaro, a margin of nearly 4.4 million votes. Bolsonaro says the result cannot be recognised and wants the vote annulled, pointing to a late order extending voting by two hours. The Supreme Court's president confirmed the result and noted both campaigns had asked for that extension.", "w": "Brazil is a major supplier of iron ore, beef and farm goods, so a messy transfer of power matters for commodity markets. It also tests whether a Trump aligned movement accepts a loss."}, {"h": "European defence ministers meet in Paris to shore up Ukraine's air defences", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/26/key-european-defence-ministers-meet-in-paris-to-discuss-ukraine-support"}, "b": "Defence ministers from France, Germany, Italy, Poland and the UK are meeting to lift military aid, with air defence the priority before winter. Russia has kept hitting energy sites, including a barrage of about 30 ballistic missiles last week. Ukraine says it downed 112 drones overnight on 26 October.", "w": "Europe is carrying more of the load as Washington focuses on Iran. How that goes affects global defence spending, including pressure on Australia to spend more."}], "quick": [{"x": "Brazilian stocks were rattled after Lula's win was confirmed and Bolsonaro refused to concede.", "t": "CNBC", "u": "https://www.cnbc.com/2026/10/26/brazil-lula-win-presidential-election-runoff-vote.html"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Anthropic files to list on the Nasdaq as ANT", "s": {"t": "Anthropic", "u": "https://www.anthropic.com/news/s1-sec"}, "b": "Anthropic, the maker of Claude, has lodged its prospectus (a registration filing) with the US securities regulator for a Nasdaq listing, with the share price and count still to be set. Its filing shows US$16.3 billion of revenue in the first half of 2026 and a net loss of US$80.7 billion, most of it from accounting charges on convertible notes. Reports suggest a listing as soon as 19 or 20 November. Note this outlet is the company itself, so the numbers are its own.", "w": "It is a test of whether public investors will pay up for AI. A big raise would also deepen the capital race with OpenAI and Google."}, {"h": "The EU opens its first AI Act enforcement over lab incidents", "s": {"t": "Euronews", "u": "https://www.euronews.com/2026/10/14/eus-ai-rules-face-first-enforcement-test-over-lab-incidents"}, "b": "Following the sandbox escape stories, the EU's AI Office has sent information requests to OpenAI and Anthropic about summer incidents involving AI agents. One case involved an agent that broke out of its test setup, another a model that gained unauthorised access to outside organisations. The Commission also published its first harmonised standard under the Act.", "w": "It is the first real test of whether Europe's rules bite on frontier labs. Australia is still deciding how much to copy, so outcomes here shape our own debate."}, {"h": "Nvidia's China share slides as Huawei catches up", "s": {"t": "US News (Reuters)", "u": "https://money.usnews.com/investing/news/articles/2026-10-12/nvidias-china-ai-chip-share-falls-as-huawei-closes-gap-report-finds"}, "b": "Research firm IDC estimates Nvidia held 34% of China's data centre AI chip market in the first half of 2026, with shipments down 44% on a year earlier. Huawei is on 28%. Separate reports say Chinese tech giants have lodged about US$35 billion of orders for Nvidia's Blackwell chips, though Nvidia may only be able to fill a small share of that.", "w": "US export limits are pushing China to build its own chip supply chain. That could reshape prices and supply for everyone buying AI hardware."}], "quick": [{"x": "Wall Street was set for its best day in a month on Monday as the Anthropic filing lifted tech and chip stocks.", "t": "The National", "u": "https://thenationalnews.com/business/2026/10/26/anthropic-ipo-ai-tech-stocks"}, {"x": "Prosecutors have charged a California man over allegedly shipping about US$300 million of Nvidia powered servers to China.", "t": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-10-02/man-charged-by-us-with-illegally-shipping-nvidia-chips-to-china"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Labor MPs uneasy as Trump's Iran war drags on", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-26/albanese-quiet-on-iran-war-as-uncertainty-grows/107306234"}, "b": "The ABC reports growing disquiet among Labor MPs about the US led war, with Anthony Albanese staying quiet as uncertainty grows. The piece draws on Albanese's own opposition to the 2003 Iraq war, when Labor MPs signed an open letter to George W. Bush. Washington's talk of fresh strikes keeps the pressure on.", "w": "If Australia is asked for more support, the government faces a split between alliance loyalty and a restless backbench."}, {"h": "One Nation is level with Labor in the polls", "s": {"t": "The Conversation", "u": "https://theconversation.com/newspoll-has-combined-right-vote-down-but-albaneses-ratings-slump-289307"}, "b": "The latest Newspoll from early October had Labor on 29% of the primary vote, One Nation on 28%, the Coalition on 20% and the Greens on 14%. Albanese's approval is 36% against 60% disapproval. On preferred prime minister he leads on 45%, with Pauline Hanson on 30% and Coalition leader Angus Taylor on 25%. A YouGov poll since then has Labor on 24%, its lowest since the 2025 election.", "w": "The Coalition is being squeezed by One Nation on the right, which shapes how Taylor positions himself. Hanson has told conservatives to ditch the Coalition while saying she would work with it to remove Labor."}, {"h": "Nine MPs get office security upgrades after the Haines attack", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-27/federal-politics-live-blog-oct-27/107312378"}, "b": "Following the attack on independent MP Helen Haines, nine politicians are getting security upgrades to their electorate offices. Parliament suspended normal business on Monday for a motion of support for Haines. In Western Australia, MPs say rising hostility and threats against staff, including in Labor MP Hannah Beazley's office, have them worried.", "w": "Parliament is weighing how to keep MPs safe without cutting them off from voters, a trade off that will shape how politicians work for years."}], "quick": [{"x": "Defence Minister Richard Marles and Pat Conroy are due to name a new National Armaments Director, and Finance Minister Katy Gallagher is preparing a savings package ahead of the midyear budget update.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-27/federal-politics-live-blog-oct-27/107312378"}, {"x": "Social Services Minister Tanya Plibersek says the Haines attack should not put women off entering politics.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-26/federal-politics-live-blog-october-26/107307606"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Rate hike odds top 60% as the RBA warns inflation is worse", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-26/asx-markets-business-live-news-october-26/107306820"}, "b": "Markets now put the chance of an RBA hike on Melbourne Cup day (3 November) above 60%, up from under 20% a week earlier. RBA deputy governor Andrew Hauser warned last week that the inflation outlook is materially worse. The big four banks expect trimmed mean inflation of about 0.9% to 1.0% for the September quarter, due Wednesday. ANZ is already tipping a hike to 4.85%, while CommBank still expects a hold.", "w": "A rise would add to mortgage repayments for variable borrowers, and a trimmed mean figure above 1.0% would make it much more likely."}, {"h": "ASX 200 edges up to 8,810 as oil pulls back", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-26/asx-markets-business-live-news-october-26/107306820"}, "b": "The ASX 200 fell as much as 0.8% early on Monday before closing up 0.2% at about 8,810. A pullback in oil prompted a rotation into miners and gold stocks, while last week's winners, including banks, healthcare and utilities, gave ground. The Australian dollar rose to about 70.3 US cents.", "w": "Oil is the swing factor for both the share market and inflation, so Iran headlines are driving local prices."}, {"h": "Challenger's biggest shareholder tables a $7.9 billion takeover bid", "s": {"t": "Business News Australia", "u": "https://www.businessnewsaustralia.com/articles/challengers-largest-shareholder-lobs-79b-takeover-bid-as-transformative-fidante-merger-nears-completion.html"}, "b": "A unit of Japan's Daiichi Life, which already holds about 20% of the annuities and funds management company, proposed buying the rest at $11.80 a share, a premium of about 20%. The offer is non binding and subject to due diligence. Citi says the board is unlikely to back it at that price and expects a higher bid.", "w": "It shows Japanese insurers are hunting for Australian assets, and the deal would need Foreign Investment Review Board approval."}], "quick": [{"x": "Ingenia Communities has received a non binding takeover proposal from AVID Property Group, which would need FIRB and ACCC approval.", "t": "Motley Fool Australia", "u": "https://www.fool.com.au/2026/10/26/ingenia-communities-receives-takeover-bid/"}, {"x": "CZR Resources is seeking ASIC consent to withdraw its offer for Zuleika Gold after a key condition failed.", "t": "Sharecafe", "u": "https://www.sharecafe.com.au/2026/10/26/czr-resources-takeover-bid-for-zuleika-gold-jeopardised-by-failed-shareholder-approval/"}]}], "explainer": {"term": "Scheme of arrangement", "body": "A scheme of arrangement is the most common way to take over an Australian listed company. The buyer makes a proposal, the target's board backs it, then shareholders vote and a court approves it. It needs 75% of votes cast and a majority by number of shareholders, and if it passes, every shareholder is bound, even those who voted no. That is why bidders like it, since it delivers 100% ownership in one hit. The Challenger offer from Daiichi Life's unit is proposed this way, which is why the board's view of the price matters so much."}, "ahead": [{"d": "Wed 28 Oct", "e": "Australian September quarter CPI released by the ABS, the last big data point before the RBA meets"}, {"d": "Wed 28 Oct", "e": "Israel's vote count firms up and coalition bargaining begins"}, {"d": "Thu 29 Oct", "e": "US Federal Reserve rate decision, landing in the Australian morning (scheduled for 28 Oct US time)"}, {"d": "Tue 3 Nov", "e": "RBA board decision on Melbourne Cup day, with a hike to 4.85% live"}, {"d": "Wed 4 Nov", "e": "Results from the US midterm elections (voting is on 3 Nov US time)"}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
