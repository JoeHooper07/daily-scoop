<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">
{"date": "2026-11-09", "edition": "Monday 9 November 2026", "lede": ["Israel's Knesset is sworn in tomorrow, and Gadi Eisenkot's first test is whether he can dump Netanyahu's speaker.", "US, Russian and Ukrainian officials meet in Abu Dhabi on 10 and 11 November, with Moscow sending a higher level team.", "ANZ posted a $7.59 billion cash profit just days after the RBA lifted the cash rate to 4.85% in a split 6 to 3 vote."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "Lifted 0.25 points on 3 Nov, highest since 2008; board meets again 7 and 8 Dec"}, {"label": "ASX 200", "value": "9,020.8", "note": "Close on Fri 6 Nov, down 0.5%"}, {"label": "ANZ cash profit", "value": "$7.59b", "note": "Year to 30 Sep, up 31%; reported Mon 9 Nov"}, {"label": "Unemployment rate", "value": "4.6%", "note": "September quarter, per the RBA's November statement"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Eisenkot's first test as Israel's Knesset is sworn in", "s": {"t": "US News (Reuters)", "u": "https://www.usnews.com/news/world/articles/2026-11-08/netanyahu-rival-eisenkot-seeks-wide-government-but-path-to-power-uncertain"}, "b": "After President Herzog picked him, Eisenkot has 28 days to build a coalition, with a possible 14 day extension. His bloc has 48 seats and he needs 61 of 120, so he is aiming for a broad emergency government, possibly a minority one. The new Knesset is sworn in on Tuesday, and the opposition plans to replace Netanyahu's Knesset speaker. The ultra Orthodox United Torah Judaism party refused to endorse Netanyahu and has signalled it could join Eisenkot.", "w": "Who gets the speaker's chair shows whether Eisenkot can actually count to 61. The outcome shapes Israel's stance on Iran and Gaza, which matters for oil prices and Australia's Middle East diplomacy."}, {"h": "Russia sends a higher level team to Abu Dhabi talks, and France joins", "s": {"t": "Kyiv Post", "u": "https://www.kyivpost.com/post/89466"}, "b": "US envoys Steve Witkoff and Jared Kushner will lead American efforts at working level talks on 10 and 11 November. It is the first three way meeting with Russia and Ukraine since February. Reports say Moscow is sending more senior officials, and France's foreign minister says Paris will take a seat at the table. Analysts at the Atlantic Council doubt Russia wants a deal, arguing it is using talks to buy time.", "w": "A senior Russian team is a signal worth watching, but territory is still the sticking point. Any real ceasefire would ease pressure on energy and grain prices."}, {"h": "Qatar's Iran draft is still stuck on Tehran's conditions", "s": {"t": "Daily Times", "u": "https://dailytimes.com.pk/1576535/us-approves-qatar-presented-draft-deal-with-iran-sources/"}, "b": "Reports say Washington has approved a draft memorandum from Qatari mediators, which would reopen the Strait of Hormuz, lift the US naval blockade and release part of about $8 billion in frozen Iranian assets. Iran called the US response unconvincing and has reportedly listed seven conditions, including a region wide ceasefire and oil sanctions relief. US strikes on Iranian air defences have continued alongside the talks. Details come from unnamed sources, so treat them with care.", "w": "The Strait of Hormuz carries a big share of the world's oil, so this drives fuel prices and the inflation the RBA is fighting."}], "quick": [{"x": "The US and China extended their trade truce, which was due to lapse on 10 November, out to 10 January 2027 at the September Xi summit.", "t": "Cyprus Mail", "u": "https://cyprus-mail.com/2026/09/24/us-china-extend-trade-truce-as-trump-welcomes-xi"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "OpenAI launches GPT-6 Cyber with a Critical cybersecurity rating", "s": {"t": "eSecurity Planet", "u": "https://www.esecurityplanet.com/news/news-openai-gpt-6-cyber-security-benchmarks/"}, "b": "OpenAI released GPT-6 Cyber on 5 November, a version of its model built to find software flaws and test exploits. It is not a public chatbot, and access is limited to approved customers through its Daybreak Red programme. OpenAI rates it Critical under its own safety framework and says it scored 48.5% on an exploit benchmark, up from 32.1% for the previous version. Those figures are OpenAI's own and are not independently checked.", "w": "The same tools that find holes can be used to attack them, so access controls matter. Australian banks and governments will face faster, cheaper vulnerability hunting."}, {"h": "Research group METR says Anthropic's AI progress has roughly doubled in pace", "s": {"t": "METR", "u": "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment"}, "b": "METR, an independent AI evaluation group, published an assessment on 5 November covering 12 August to 29 October. It estimates Anthropic's rate of capability progress is about double its earlier pace, with most of the speedup coming from AI helping its own staff. Anthropic redacted much of the report, and METR said the company's public risk report understates the acceleration. METR also says AI is not yet doing the most important training work on its own.", "w": "If AI is speeding up its own development, regulators have less time to react. It also feeds the debate over whether AI company valuations are justified."}, {"h": "AI stocks bounce after a brutal rout, led by Nvidia", "s": {"t": "Washington Times", "u": "https://washingtontimes.com/news/2026/nov/6/ai-stocks-rebound-halt-brutal-worldwide-sell-wall-street-trims-loss"}, "b": "The Nasdaq rose about 1.1% on Friday after falling roughly 5.4% on Thursday into correction territory, though the Dow slipped about 0.5%. Nvidia closed up about 2.8% after dropping more than 9% the day before. US employers added 165,000 jobs in October, well above forecasts, which lifted bets on a Fed rate rise in December. Some analysts warn the rebound rests mostly on chip stocks.", "w": "Australian super funds and the ASX 200 are exposed to US tech swings. Strong US jobs data also means higher global rates for longer."}], "quick": []}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "High Court hears challenges to the under 16 social media ban", "s": {"t": "AP via News4Jax", "u": "https://www.news4jax.com/business/2026/11/03/australias-highest-court-hears-challenges-to-social-media-ban-for-children/"}, "b": "The High Court heard two challenges on 3 and 4 November, one from Reddit and one from the Digital Freedom Project, backed by two 15 year olds. Reddit wants a declaration it is not an age restricted platform, while the other case argues the law is invalid. The government says the ban protects young people and only limits political communication in a narrow way. The court reserved its decision, and the law stays in force meanwhile. Government figures cited in coverage say nearly 5 million accounts have been blocked on 10 platforms.", "w": "A ruling could test how far Canberra can regulate global platforms, and the implied freedom of political communication. NSW and South Australia have sought to be heard."}, {"h": "Commonwealth leaders sign a Pacific focused climate and trade communique", "s": {"t": "Pacific Islands News Association", "u": "https://pina.com.fj/?p=78607"}, "b": "CHOGM in Antigua and Barbuda wrapped up on 4 November. The leaders' communique commits to better climate finance, protecting Pacific maritime boundaries and more trade and investment. It welcomed the Pacific Resilience Facility, and Samoa and Antigua pushed for fairer climate finance. Albanese attended, while ABC reporting says issues at home piled up during the Caribbean trip.", "w": "Australia is preparing for COP31 with Pacific partners, so climate finance language here is an early signal of the negotiating mood."}, {"h": "Newspoll puts One Nation ahead on primary vote", "s": {"t": "Poll Bludger", "u": "https://www.pollbludger.net/2026/11/01/newspoll-labor-27-one-nation-28-coalition-21-open-thread/"}, "b": "The latest Newspoll, reported around 1 November, has Labor on 27% after dropping two points, One Nation steady on 28% and the Coalition on 21%. Albanese's net approval is minus 23, Angus Taylor's is minus 10 and Pauline Hanson's is minus 1. Reports differ on the sample size, so check the pollster's own release.", "w": "A three way split makes preference flows decisive and points to a possible minority parliament at the next election."}], "quick": [{"x": "Federal Parliament sits again after Albanese's trip, with the Defence bills and the High Court case both in the background, according to ABC's weekly politics wrap.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-05/albanese-chogm-week-in-politics/107336024"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ANZ posts a $7.59 billion cash profit, up 31%", "s": {"t": "Capital Brief", "u": "https://www.capitalbrief.com/briefing/anz-delivers-23-jump-in-full-year-net-profit-to-73b-aa237f13-d264-46f4-a6f2-19226a83ec18/"}, "b": "ANZ reported statutory net profit of about $7.3 billion, up 23%, and cash earnings of about $7.59 billion, up 31% and slightly ahead of analyst forecasts. Cash earnings exclude one offs such as $585 million of restructuring costs tied to 3,500 job cuts. Its net interest margin slipped 2 basis points to 1.53% on tougher lending competition, and the final dividend was 83 cents.", "w": "It is the first big bank result since the RBA's fifth hike. Investors want to know whether higher rates help margins or just raise bad debt risk."}, {"h": "RBA hike came on a split 6 to 3 vote, with inflation seen above 3% until late 2027", "s": {"t": "InvestingLive", "u": "https://investinglive.com/central-banks/more-rba-lifts-cash-rate-to-4-85-in-split-6-3-vote-sees-inflation-above-3-until-late-2027/"}, "b": "Since our earlier coverage of the hike, the detail has come out. Six board members voted to lift the rate to 4.85% and three wanted to hold at 4.60%. The new forecasts see inflation staying above 3% until late 2027, and unemployment rose to 4.6% in the September quarter. The board cited the Middle East war and higher oil prices. The next meeting is 7 and 8 December.", "w": "A divided board hints the hiking cycle may be close to its end, but mortgage holders still carry the cost for now."}, {"h": "NEXTDC rejects a share raid by Goodman and Digital Realty", "s": {"t": "Tech Insider", "u": "https://tech-insider.org/au/nextdc-goodman-digital-realty-share-raid-opportunistic-2026/"}, "b": "On 4 November institutional investors ran a book build at $9.50 for up to 9.9% of data centre operator NEXTDC. The board called the move opportunistic and said it had received no takeover proposal. Goodman and Digital Realty said they had no control proposal for now but reserved the right to change that. The source is secondary, so check ASX announcements.", "w": "Data centres are the hot asset of the AI boom, and a bid would be one of the largest Australian tech infrastructure deals."}], "quick": [{"x": "Frasers Group's on market $0.65 a share bid for Accent Group has been unanimously rejected by Accent's independent directors, and Frasers already holds about 22.9%.", "t": "Kalkine", "u": "https://kalkinemedia.com/au/news/announcements/accent-group-urges-shareholders-to-participate-in-2026-agm-amid-frasers-groups-065-per-share-takeover-bid"}, {"x": "The ASX 200 fell 0.5% to 9,020.8 on Friday after Wall Street's tech rout, but still finished the week higher for a second week.", "t": "Market Index", "u": "https://www.marketindex.com.au/news/evening-wrap-asx-200-slides-on-us-tech-rout-but-big-banks-and-defensives"}]}], "explainer": {"term": "Net interest margin", "body": "Net interest margin, or NIM, is the gap between what a bank earns on loans and what it pays on deposits and funding, shown as a percentage of its earning assets. ANZ's fell to 1.53%, which means it keeps slightly less on each dollar it lends. Rising rates can help NIM, because banks reprice loans quickly. But competition for borrowers can squeeze it, and that is what ANZ pointed to. Because NIM drives most of a bank's profit, a small move of a few basis points (hundredths of a percent) is worth hundreds of millions of dollars."}, "ahead": [{"d": "Tue 10 Nov", "e": "Israel's new Knesset is sworn in, with a fight over replacing Netanyahu's speaker."}, {"d": "Tue 10 Nov", "e": "US, Russia and Ukraine begin talks in Abu Dhabi (Abu Dhabi time), with France also joining."}, {"d": "Wed 11 Nov", "e": "Second day of the Abu Dhabi talks."}, {"d": "Wed 18 Nov", "e": "Proxy voting closes for Accent Group's AGM, held 20 November, amid the Frasers bid."}]}
</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
