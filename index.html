<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">{"date": "2026-11-18", "edition": "Wednesday 18 November 2026", "lede": ["Nvidia smashed forecasts in its first results since Jensen Huang quit, with revenue more than doubling to US$115.8 billion, lifting its shares after hours following another ugly day on Wall Street.", "Quad leaders in Manila agreed to a first joint maritime surveillance exercise plus new AI and critical minerals deals, as Albanese heads to Shenzhen to meet Xi Jinping on Friday.", "At home the ASX had its worst day in six weeks, while WA has struck a deal that effectively exempts it from Labor's gas reservation scheme ahead of a Senate showdown."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "As at 18 Nov; minutes show six of nine members backed the November hike"}, {"label": "ASX 200", "value": "8,883.2", "note": "Close on Tue 17 Nov, down 1.79%, its lowest close since late October"}, {"label": "AUD/USD", "value": "about 67.35 US cents", "note": "Tue 17 Nov, steady near a 10 month low"}, {"label": "Nvidia quarterly revenue", "value": "US$115.8b", "note": "Quarter to 25 Oct, reported 18 Nov AEDT; up 103% on a year ago"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Quad leaders agree on joint sea patrols, AI money and minerals deals", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-18/quad-meeting-india-japan-usa-anthony-albanese-donald-trump/107396716"}, "b": "Trump, Modi, Takaichi and Albanese held their first Quad leaders' meeting since 2024 in Manila on Tuesday night. They backed a first joint maritime surveillance exercise for early 2027, a new AI accelerator with more than US$85 million behind it, and a raft of defence and critical minerals agreements. Australia will widen its cable resilience centre to cover undersea power cables as well as data cables, and Trump praised Albanese as a friend.", "w": "The Quad is Australia's main club for balancing China, and Beijing is unlikely to love the new sea patrols just days before Albanese meets Xi."}, {"h": "Ukraine partly collapses the Kerch Bridge to Crimea", "s": {"t": "NPR", "u": "https://www.npr.org/2026/11/17/g-s1-153946/russia-ukraine-war"}, "b": "Ukrainian drones and missiles hit the bridge linking Russia to occupied Crimea, and footage released by Zelensky showed a main road arch and part of the roadway down. Ukraine's security service says the rail section was damaged too, while Russia says it shot down 1,441 drones over two nights. Russia hit back at bridges in Kyiv and at power grids in eight regions, leaving cities short of heat and water.", "w": "The bridge is a key supply line for Russian forces in the south, and the escalation lands just as Putin arrives in China for talks with Trump."}, {"h": "US strikes an Iranian missile site after the Bahrain drone attack", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/17/iran-war-trump-hormuz-oil-.html"}, "b": "The US hit a Revolutionary Guards missile launch site on Qeshm Island in the Strait of Hormuz, calling it a response to Iran's drone attack on a US base in Bahrain. A third US aircraft carrier has now reached the region, and another tanker was struck near Hormuz. Iran says it will not reopen the strait or return to talks until the US naval blockade and sanctions are lifted.", "w": "Any flare up around Hormuz feeds straight into oil and petrol prices, which keep Australian inflation, and the RBA, under pressure."}, {"h": "Putin lands in Shenzhen ahead of the first ever Trump, Xi and Putin meeting", "s": {"t": "Kyiv Post", "u": "https://www.kyivpost.com/post/90410"}, "b": "Vladimir Putin has arrived in Shenzhen for APEC, with the Kremlin confirming a three way meeting with Xi Jinping and Donald Trump on Thursday. A senior US official called the talks an entry point and said no agreement is expected. Trump is also due to meet Xi one on one.", "w": "Nuclear arms control and the Ukraine war top the list, and any thaw or freeze between the big three shapes the security climate Australia operates in."}], "quick": [{"x": "Trump says he may also meet North Korea's Kim Jong Un while in China this week.", "t": "NBC News", "u": "https://www.nbcnews.com/politics/trump-administration/live-blog/trump-xi-putin-asia-congress-2026-election-iran-live-updates-rcna609499"}, {"x": "At COP31, Chris Bowen says there will be at least one more draft deal before Friday after the Arab Group and Russia pushed back on fossil fuel wording.", "t": "US News", "u": "https://www.usnews.com/news/world/articles/2026-11-16/first-draft-of-cop31-deal-signals-tough-negotiations-to-come"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Nvidia beats big in its first report without Jensen Huang", "s": {"t": "Nvidia", "u": "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027"}, "b": "Revenue hit US$115.8 billion for the quarter to late October, up 103% on a year ago and well above the roughly US$109 billion analysts expected. Data centre sales alone were US$107.6 billion, and the new Vera Rubin platform brought in close to US$20 billion in its launch quarter. Interim CEO Colette Kress guided to US$130 billion next quarter, assuming no data centre sales to China.", "w": "Nvidia is the bellwether for the whole AI trade, so a strong result could steady jittery markets, including ASX tech and super funds heavy in US stocks."}, {"h": "Anthropic set to price its float above the target range", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/17/anthropic-ipo-price.html"}, "b": "The AI company is likely to price its 825 million share IPO above the US$70 to US$78 range, sources told CNBC, with orders reportedly about six times the shares on offer. Pricing is expected overnight, with trading on Nasdaq under the ticker ANT to follow. Up to 20% of shares are reserved for retail investors.", "w": "Strong demand despite the Nasdaq sliding into correction would show investors still back AI leaders, even as they dump the wider sector."}, {"h": "Google says AI agents are now running parts of real cyberattacks", "s": {"t": "Help Net Security", "u": "https://www.helpnetsecurity.com/2026/11/17/ai-powered-cyberattacks-gtig-report/"}, "b": "Google's threat intelligence team and Mandiant report that some hacking groups let AI agents run whole stages of live intrusions. In at least one case an agent turned freshly released software patches into working attacks with no human involved. Some experts say claims of fully automated attacks overstate how much the AI actually did.", "w": "Faster attacks shrink the window companies have to patch, a big issue after a run of outages and breaches hitting Australian firms and agencies."}, {"h": "Microsoft launches its own AI models to take on OpenAI and Anthropic", "s": {"t": "Axios", "u": "https://www.axios.com/2026/11/17/microsoft-ai-models-openai-anthropic-ignite"}, "b": "At its Ignite conference Microsoft unveiled six models covering coding, cybersecurity, images and voice, pitched as cheaper alternatives to rivals. Its comparisons lean on selected benchmarks and some prices reflect promotional discounts. Microsoft shares fell about 2% on the day.", "w": "Microsoft building its own models signals a looser tie with OpenAI and more price competition for business AI tools."}], "quick": [{"x": "The NSA's classified internal network went down during routine maintenance, adding to a run of outages that spooked Wall Street; there is no sign of a cyberattack.", "t": "Benzinga", "u": "https://www.benzinga.com/markets/tech/26/11/63361077/nsa-hit-by-major-network-outage-as-tech-glitches-pile-up"}, {"x": "ASIC chair Sarah Court has flagged strong retail investor interest in the SpaceX and Anthropic floats.", "t": "Grafa", "u": "https://grafa.com/en/news/australia/asic-chair-flags-retail-demand-for-spacex-anthropic-offers"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "WA gets an effective exemption from the gas reservation scheme", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-18/federal-politics-live-blog-nov-18/107396066"}, "b": "WA Premier Roger Cook says he has a deal with Canberra, with Resources Minister Madeleine King to use her discretion to set WA's reservation obligation to zero. The scheme would make big east coast exporters hold back 20% of gas for local use from 2028. WA's inclusion was the Coalition's main sticking point, though its support is still undecided.", "w": "This could unlock Senate passage without the Greens' export tax, and the bill matters for east coast gas and power prices."}, {"h": "Chalmers rejects Spender's capital gains plan as the Greens offer a path", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-17/greens-offer-government-path-to-pass-trusts-cgt/107394802"}, "b": "In a letter to Allegra Spender, the Treasurer said her plan to keep a 40% discount for business assets would not be simpler or fairer and could push people to restructure for tax reasons. The Greens, who hold the Senate balance of power, have signalled a way to pass Labor's trusts and capital gains changes. Labor's plan swaps the 50% discount for an inflation based one with a 30% minimum tax on real gains from July 2027.", "w": "These changes hit investors and property owners directly, and how they land shapes housing and the budget bottom line."}, {"h": "Albanese shrugs off China blowback before Friday's meeting with Xi", "s": {"t": "SBS", "u": "https://www.sbs.com.au/news/article/albanese-brushes-off-prospect-of-china-blowback-after-quad-agrees-to-deepen-cooperation/oc4lt5hyg"}, "b": "Albanese says Australia acts openly in its national interest and described the China relationship as strong. Friday's meeting in Shenzhen will be his fifth formal sitdown with Xi. Penny Wong says Australia will keep pressing Beijing on iron ore buying arrangements.", "w": "China is Australia's biggest customer, and iron ore prices are already sliding, so the tone of Friday's talks matters for the budget."}, {"h": "Queensland adopts the CFMEU inquiry's urgent fixes", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-17/qld-government-cfmeu-response/107394238"}, "b": "The Crisafulli government accepted both recommendations from the inquiry into the construction union. A new building code and a regulator to enforce it apply from now on public projects worth more than $150 million. Deputy Premier Jarrod Bleijie made the announcement.", "w": "Construction costs and union conduct on big public projects affect how much taxpayers pay for infrastructure, including Olympics builds."}], "quick": [{"x": "NSW Premier Chris Minns has paused new real estate underquoting laws for up to a year, a day before they were due to start.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-16/nsw-house-price-advertising-underquoting-laws/107390420"}, {"x": "Labor and the Greens teamed up on a closure motion to shut down a Coalition push to debate trusts and capital gains tax.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-17/federal-politics-live-blog-senate-albanese-/107391106"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX suffers its steepest fall in six weeks", "s": {"t": "ShareTrader", "u": "https://sharetrader.com.au/news/2026-11-17-asx-200-falls-161-points-as-rba-minutes-reveal-split-vote-and-us-tech-slides"}, "b": "The ASX 200 fell 161.5 points, or 1.79%, to 8,883.2, with 10 of 11 sectors lower and only 24 stocks rising. Miners led the drop as materials fell nearly 4%, while Macquarie lost 3.8% and NAB 2.8%. Utilities was the only sector to gain.", "w": "Most Australians own the ASX through super, and a strong Nvidia result could help today's open after Wall Street fell again."}, {"h": "RBA minutes show a board split on whether rates were high enough", "s": {"t": "RBA", "u": "https://www.rba.gov.au/monetary-policy/rba-board-minutes/2026/2026-11-03.html"}, "b": "Six members judged the cash rate was not clearly sufficient to bring inflation down, and saw more risk in staying too loose than going too tight. Three wanted to hold at 4.60% and see no need to decide yet on further hikes. The minutes did not flag more tightening, and traders have dropped bets on a December rise.", "w": "This is the clearest hint yet that mortgage rates may be near their peak, with wages today and jobs tomorrow the next tests."}, {"h": "David Jones owes creditors at least $459 million", "s": {"t": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-17-failed-chain-david-jones-owes-creditors-at-least-a-459-million"}, "b": "Administrators from McGrathNicol told the first creditors' meeting that lender Hilco is owed $155 million and owner Anchorage Capital $80 million. About 940 unsecured creditors are owed $180 million, staff $11 million, and $33 million sits on unredeemed gift cards. They gave seven reasons for the collapse, including inflation, higher rates and online competition, and are talking with 150 possible buyers.", "w": "The fall of a 188 year old icon shows how hard high rates and cost of living pressure are hitting discretionary retail."}, {"h": "Iron ore sinks to its lowest since 2022", "s": {"t": "Motley Fool", "u": "https://www.fool.com.au/2026/11/17/at-143-are-rio-tinto-shares-oversold-or-overpriced/"}, "b": "Iron ore fell to about 647 yuan a tonne on Tuesday, its weakest since October 2022 and roughly 18% lower than a year ago. Soft Chinese steel demand, lower output and tough talks with China's state buyer are to blame. Rio Tinto still gets roughly half or more of its revenue from iron ore.", "w": "Iron ore is Australia's biggest export earner, so lower prices squeeze miner profits and federal tax revenue."}], "quick": [{"x": "The Aussie dollar is steady near a 10 month low of about 67.35 US cents after the RBA minutes.", "t": "FXStreet", "u": "https://www.fxstreet.com/news/australian-dollar-steadies-at-a-10-month-low-after-split-rba-minutes-202611172230"}, {"x": "The ABS releases September quarter wage figures at 11.30am today, with CommBank tipping a 0.9% quarterly rise.", "t": "CommBank", "u": "https://www.commbank.com.au/articles/newsroom/2026/10/wage-growth-slows-september.html"}, {"x": "The ACCC has cleared Ingenia's takeover of Peet, with binding offers for Ingenia itself due by 8 December.", "t": "Kalkine", "u": "https://kalkine.com.au/news/real-estate/ingenia-communities-asx-ina-enters-non-exclusive-process-with-avid-and-warburg-pincus-as-accc-clears-peet-acquisition"}]}], "explainer": {"term": "Safe harbour (insolvency)", "body": "Normally company directors can be held personally liable if their business keeps trading and racking up debts while it cannot pay its bills. Australia's safe harbour rules give directors protection from that liability if they are actively pursuing a turnaround plan that is reasonably likely to give a better result than going straight into administration. The idea is to encourage rescue attempts instead of panicked early collapses. David Jones's directors used safe harbour before the administrators were called in, and creditors will watch whether that plan was realistic."}, "ahead": [{"d": "Wed 18 Nov", "e": "ABS Wage Price Index 11.30am AEDT; ASIC sets out its 2027 enforcement priorities; APEC leaders' week opens in Shenzhen."}, {"d": "Thu 19 Nov", "e": "ABS October jobs figures; Trump, Xi and Putin meet in Shenzhen; Anthropic expected to price its IPO overnight."}, {"d": "Fri 20 Nov", "e": "Anthropic shares due to start trading on Nasdaq overnight; Albanese meets Xi in Shenzhen; COP31 scheduled to wrap up in Antalya."}, {"d": "Wed 25 Nov", "e": "US PCE inflation data out overnight, a key input for the Fed's December decision."}, {"d": "Fri 27 Nov", "e": "Review window for the ACCC's Ingenia and Peet ruling closes."}, {"d": "Sat 28 Nov", "e": "Victorian state election."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
