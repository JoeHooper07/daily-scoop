<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-12", "edition": "Thursday 12 November 2026", "lede": ["Russia and Ukraine wrapped up two days of US brokered talks in Abu Dhabi with an in principle deal on the biggest prisoner swap of the war, but no ceasefire.", "New home lending had its biggest quarterly fall on record as investors pulled back by almost a third, on the same day David Jones said it will shut half its stores.", "A blowout result from CoreWeave reignited the AI trade and lifted the Nasdaq 1.6%, even as OpenAI's reported quarterly loss hit about US$10.9 billion."], "numbers": [{"label": "ASX 200", "value": "9,153.2", "note": "Close on Wed 11 Nov, up 0.27% to its best finish in about 11 weeks"}, {"label": "S&P 500", "value": "7,619.38", "note": "Close on Wed 11 Nov in New York, up 1.3% on a chip and AI rally"}, {"label": "Brent crude", "value": "US$92.76", "note": "Settle on Wed 11 Nov, up 1.4% a day after its lowest close since August"}, {"label": "New home loans", "value": "A$81.2b", "note": "ABS value for the September quarter, released Wed 11 Nov, down 15.5%"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Abu Dhabi talks end with a big prisoner swap but no ceasefire", "s": {"t": "Euronews", "u": "https://www.euronews.com/2026/11/11/abu-dhabi-peace-talks-end-with-prisoner-exchange-agreement-as-us-envoys-prepare-to-meet-pu"}, "b": "The second and final scheduled day of Russia, Ukraine and US talks in Abu Dhabi ran for just under two hours. Both lead negotiators, Rustem Umerov for Kyiv and Vladimir Medinsky for Moscow, confirmed a large prisoner of war exchange, with Medinsky calling it agreed in principle. US envoy Jared Kushner called it the biggest humanitarian release of the war, said the final number would be settled the next day, and a Russian official said the swap could happen within two or three weeks. There was no breakthrough on a ceasefire or on who controls which territory.", "w": "These were the first face to face talks in nine months, so a swap is a real if modest step. The bigger test is whether US envoys Steve Witkoff and Kushner can move Putin and Zelensky when they brief them next."}, {"h": "NATO jets scrambled as stray drones send Baltic residents to shelter", "s": {"t": "Cyprus Mail", "u": "https://cyprus-mail.com/2026/11/11/nato-jets-scrambled-as-drone-alerts-sweep-baltic-states"}, "b": "NATO fighters were scrambled overnight after drone alerts across Lithuania, Latvia and Estonia, and residents were told to take shelter. Officials said at least four drones strayed into the region's airspace during Ukrainian strikes on Russia, with one reportedly shot down in Lithuania after crossing from Belarus. Estonia's prime minister said no foreign country had permission to use its airspace. Moscow accuses Kyiv of hiding behind NATO airspace, while Kyiv blames Russian jamming for knocking its drones off course.", "w": "Every stray drone over NATO soil is a chance for the war to spill over by accident, which is exactly what the alliance wants to avoid while peace talks are under way."}, {"h": "Oil bounces as the Iran nuclear dispute stokes supply fears", "s": {"t": "Seeking Alpha", "u": "https://seekingalpha.com/news/4671034-oil-prices-rise-as-iran-nuclear-dispute-fuels-supply-concerns"}, "b": "Brent crude rose about 1.4% to settle near US$92.76 a barrel, clawing back part of the slide that took it to its lowest close since August earlier in the week. Traders are weighing hopes of a US and Iran deal to reopen the Strait of Hormuz against the unresolved fight over Iran's nuclear program, which remains the main sticking point. Shipping risks in the Gulf are still keeping a floor under prices.", "w": "Oil is the main channel from the Middle East to Australian petrol prices and inflation, and the RBA has already lifted rates to 4.85%. Any stall in the talks can quickly push fuel costs back up."}], "quick": [{"x": "Senior Iranian security figure Mohsen Rezaei said Iran will not let any of its enriched nuclear material leave the country, a key US demand.", "t": "Morning Star", "u": "https://morningstaronline.co.uk/article/world-brief-50"}, {"x": "Wednesday's headlines from Gaza and the West Bank included at least eight Palestinians killed in Israeli strikes and a 14 year old boy killed in a raid.", "t": "Democracy Now", "u": "https://www.democracynow.org/2026/11/11/headlines"}, {"x": "Congo's Ebola outbreak has passed 10,000 confirmed cases, and Africa CDC says more than half of those infected have died.", "t": "Nature World News", "u": "https://www.natureworldnews.com/articles/73750/20261106/ebola-cases-top-10000-congo-africa-cdc-toll-shows-more-half-patients-have-died.htm"}, {"x": "The White House had gone into the Abu Dhabi round cautiously optimistic, with Witkoff and Kushner tipped to travel on to Moscow and Kyiv.", "t": "Axios", "u": "https://axios.com/2026/11/09/ukraine-russia-zelensky-putin-peace-abu-dhabi"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "CoreWeave soars 25% and drags the AI trade back to life", "s": {"t": "Motley Fool", "u": "https://www.fool.com/coverage/stock-market-today/2026/11/11/stock-market-today-nov-11-coreweave-surges-25-on-beat-and-raise-quarter/"}, "b": "CoreWeave, which rents out huge clusters of Nvidia chips to AI companies, reported quarterly revenue of US$3.66 billion, ahead of forecasts, and lifted its 2026 revenue outlook to between US$13.0 and US$13.3 billion. Its shares jumped about 25% to US$60.77, after being down roughly 39% for the year on worries about its heavy borrowing. Chipmakers like Micron and AMD rallied with it, and the Nasdaq rose 1.6% to 25,466.", "w": "After a rough fortnight of AI and rate jitters, one strong result was enough to flip the mood, which shows how much of the market now rides on the AI spending boom continuing."}, {"h": "OpenAI's revenue jumps 50% but its quarterly loss widens to about US$10.9 billion", "s": {"t": "Forbes", "u": "https://www.forbes.com/sites/jonmarkman/2026/11/11/openai-revenue-hits-10-billion-in-q3-as-loss-per-dollar-falls-to-109/"}, "b": "Documents reported by the Wall Street Journal show OpenAI made about US$10 billion in revenue in the September quarter, up roughly 50% on the previous quarter. Its adjusted operating loss grew to about US$10.9 billion from US$10.1 billion, and that excludes stock based pay. The upside is it now loses about US$1.09 for every dollar of revenue, down from US$1.50 three months earlier.", "w": "The numbers land just as investors size up rival Anthropic's IPO at a valuation of about US$1.4 trillion, so they are a live test of whether AI labs can ever turn a profit."}, {"h": "Anthropic takes aim at Excel and Microsoft shares slip", "s": {"t": "Inc.", "u": "https://www.inc.com/phil-rosen/microsoft-software-anthropic-claude-sheets/91434131"}, "b": "Anthropic launched Claude Sheets, a spreadsheet with its AI built in, alongside Claude Whiteboards and Claude Data. Microsoft shares fell about 2.2% to US$533.16 on Tuesday, though they are still only around 4% below their record close from 4 November. Anthropic admits Sheets has only basic features for now, and the two firms remain tightly linked, with Anthropic paying Microsoft for cloud computing and Microsoft an anchor investor in the IPO due to price on 18 November.", "w": "Office software is one of the most profitable businesses in tech, and investors are now nervous about AI labs moving from selling models to selling the apps people use every day."}], "quick": [{"x": "Micron shares popped as investors bet more data centre building by firms like CoreWeave means more memory chip orders.", "t": "Motley Fool", "u": "https://www.fool.com/investing/2026/11/11/why-micron-stock-popped-today/"}, {"x": "NSW Police's cybercrime squad is investigating a breach that NSW Health has declared a major cyber event, though it says no patient data was taken.", "t": "SBS", "u": "https://www.sbs.com.au/news/article/cybercrime-squad-investigating-major-nsw-health-data-breach/jhbcaq0q4"}, {"x": "Google and Nvidia are reportedly among seven tech giants putting a combined US$26 billion into Anthropic's IPO.", "t": "AI Weekly", "u": "https://aiweekly.co/ai-news-today"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Albanese works the room at COP31 with Erdogan and Norway's Støre", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-12/federal-politics-live-blog-albanese-cop31-nov-2/107375902"}, "b": "At the climate summit in Antalya, the Prime Minister met Turkish President Recep Tayyip Erdoğan to talk about the Middle East conflict and its economic fallout, AI and defence ties. He also met Norway's Prime Minister Jonas Gahr Støre, discussing support for Ukraine, the Middle East and Indo Pacific security. Turkey is hosting COP31, while Australia's Chris Bowen leads the formal negotiations under a power sharing deal between the two countries.", "w": "Australia's unusual co hosting role means Albanese owns some of the result, good or bad, as the talks head toward their 20 November finish."}, {"h": "Canberra slams Qantas over 850 job cuts", "s": {"t": "ABC", "u": "https://abc.net.au/news/2026-11-11/federal-politics-live-blog-nov-11/107371364"}, "b": "Transport Minister Catherine King said it was extremely disappointing that Qantas is moving to axe 850 corporate jobs by mid 2027 under its outsourcing deal with Accenture. The criticism adds to political pressure on the airline, which has a long and bruising history with Labor and the unions over outsourcing.", "w": "With unemployment at a five year high of 4.7%, white collar job cuts linked to outsourcing and AI are becoming a political issue, not just a business one."}, {"h": "Victoria's poll gets bigger and more complex, but with few debates", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-12/victorian-election-campaign-missing-leader-debates/107374014"}, "b": "Nominations have closed for the 28 November election, which the Victorian Electoral Commission calls its biggest and most complex yet. Very few leader debates are planned, with Liberal leader Jess Wilson and Premier Ben Carroll trading accusations over who is dodging. The Coalition will generally put One Nation ahead of Labor and the Greens on its how to vote cards, while Labor says it will put One Nation last.", "w": "Polls point to a possible change of government in Victoria, and One Nation's preferences could decide a lot of seats, which would shape the federal contest too."}], "quick": [{"x": "Remembrance Day services across the country marked 108 years since the end of World War I.", "t": "ABC", "u": "https://abc.net.au/news/2026-11-11/remembrance-day-services-held-across-australia/107137596"}, {"x": "The government has scrapped plans to sell Sydney's Victoria Barracks and three Victorian Defence heritage sites, raising questions about its A$1.2 billion property sale target.", "t": "The Urban Developer", "u": "https://www.theurbandeveloper.com/articles/victoria-barracks-sydney-nsw-sale-backflip-defence-budget-questions"}, {"x": "The latest Newspoll had One Nation on 28% of the primary vote, Labor 27% and the Coalition 21%.", "t": "The Conversation", "u": "https://theconversation.com/labor-returns-to-equal-term-low-primary-vote-in-newspoll-295257"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Home lending has its biggest quarterly fall on record as investors flee", "s": {"t": "The Adviser", "u": "https://www.theadviser.com.au/borrower/49205-new-home-loans-suffer-largest-drop-on-record"}, "b": "ABS figures show the value of new home loans fell 15.5% in the September quarter to A$81.2 billion, with the number of loans down 15% to about 111,900. Investors led the retreat, with their loan values down 32.3% to A$24.7 billion, the biggest fall on record and their third straight quarterly drop. Owner occupier loans fell 5.3% and first home buyer loans fell 8.6%.", "w": "Higher rates, recent tax changes and falling prices are hitting housing at once. Weaker lending usually means softer prices ahead, which the RBA will read as its rate rises biting."}, {"h": "David Jones to close 19 of its 38 stores, including Woden", "s": {"t": "Canberra Times", "u": "https://www.canberratimes.com.au/story/9389943/david-jones-store-to-close-in-canberra-as-19-sites-shut-down/"}, "b": "Receivers FTI Consulting confirmed half of the department store chain's sites will shut by the end of the year, across six states and territories plus New Zealand. Closures include Woden in Canberra, Parramatta, Warringah Mall and Green Hills near Newcastle. The chain employs more than 6,000 people and is still looking for a buyer or new funding, with owner Anchorage Capital tipped to try to buy it back. Creditors meet for the first time on 17 November.", "w": "The near 200 year old retailer's shrinkage is a sign of how hard high rates and online shopping are hitting discretionary spending, and it leaves big holes in shopping centres."}, {"h": "CBA lifts quarterly profit 8% to A$2.8 billion, but shares slip", "s": {"t": "Rask Media", "u": "https://www.raskmedia.com.au/2026/11/11/commonwealth-bank-asxcba-share-price-in-focus-as-fy27-q1-profit-rises-8-to-2-8-billion/"}, "b": "Commonwealth Bank's unaudited cash profit for the September quarter was about A$2.8 billion, up 8% on a year earlier, as business lending made up for a slower mortgage market. Home loan applications were still about 16% lower than a year ago, and loan impairment expenses rose to A$300 million. Shares fell about 1.2% as investors judged the stock already expensive.", "w": "CBA is the biggest company on the ASX and in many super funds, so a bank that is growing slowly but priced for perfection matters to most Australians' retirement savings."}, {"h": "ASX edges up to an 11 week high as Life360 rebounds", "s": {"t": "Capital Brief", "u": "https://www.capitalbrief.com/briefing/australian-shares-to-slip-as-hot-us-inflation-fuels-bets-of-half-point-fed-hike-b2bdcd19-4047-45f4-8833-05702f0bea38/"}, "b": "The ASX 200 shook off a weak Wall Street lead after hot US inflation figures to finish up 0.27% at 9,153.2, closing at its high for the day. Tech and utilities led, with Life360 up about 10% after being the worst performer on Tuesday. Financials were the only sector to fall, dragged down by CBA.", "w": "Local shares are near their best levels since August despite the rate rise, but a likely US Fed hike in December is a risk hanging over them."}], "quick": [{"x": "Investor lending for new builds also fell 16.3%, suggesting tax changes have not pushed investors into new homes.", "t": "Capital Brief", "u": "https://www.capitalbrief.com/briefing/home-loans-suffer-steepest-quarterly-fall-as-investors-back-away-abs-8f59bdbd-c351-480d-81e4-f79ec89dc5ff/"}, {"x": "On Wall Street, the S&P 500 rose 1.3% to 7,619 and the Dow added about 0.5% to 52,486.", "t": "WTOP", "u": "https://wtop.com/national/2026/11/how-major-us-stock-indexes-fared-wednesday-11-11-2026"}]}], "explainer": {"term": "Receivership", "body": "Receivership is when a lender with security over a company's assets appoints a receiver to take control and recover what it is owed. It is different from voluntary administration, where an administrator works for all creditors to try to save the business or get the best outcome. A company can be in both at once, as David Jones is, with the receiver focused on the secured lender and the administrator on everyone else. Receivers often close loss making sites quickly to make what is left easier to sell. That is why store closures and a hunt for a buyer usually go hand in hand."}, "ahead": [{"d": "Thu 12 Nov", "e": "COP31 leaders' summit in Antalya wraps up, with Albanese attending."}, {"d": "Mon 16 Nov", "e": "Senate sits again until 19 November."}, {"d": "Tue 17 Nov", "e": "First creditors' meeting for David Jones."}, {"d": "Wed 18 Nov", "e": "Australia's Wage Price Index is due; Knesset votes on replacing Speaker Amir Ohana (1am AEDT)."}, {"d": "Thu 19 Nov", "e": "ABS October jobs figures; Anthropic's IPO is due to price (18 November in the US)."}, {"d": "Fri 20 Nov", "e": "COP31 is scheduled to end."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
