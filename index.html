<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">
{"date": "2026-10-30", "edition": "Friday 30 October 2026", "lede": ["Israel's vote count is done at 99.9 percent and still gives Netanyahu's bloc only 53 of 120 seats, with the Arab parties on 19 and holding the key.", "Microsoft's Azure cloud business grew 48 percent while Alphabet shares fell more than 13 percent overnight, a split verdict on huge AI spending.", "Warburg Pincus has topped AVID again for Ingenia, and AVID has until Sunday to respond, days before the RBA is widely expected to lift rates on Tuesday."], "numbers": [{"label": "RBA cash rate", "value": "4.60%", "note": "As at 29 Oct 2026; CBA and ANZ now forecast a rise to 4.85% on 3 Nov"}, {"label": "ASX 200", "value": "8,891.8", "note": "Close on 29 Oct 2026, up about 0.5%, roughly 4% below the August record"}, {"label": "Australian CPI", "value": "4.3%", "note": "Annual, year to September 2026 (ABS, released 28 Oct)"}, {"label": "Brent crude", "value": "US$114", "note": "Approx. level on 29 Oct 2026, down slightly on US Iran talk hopes"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Israel's count is done and no bloc has a majority", "s": {"t": "Times of Israel", "u": "https://www.timesofisrael.com/with-85-of-votes-counted-netanyahu-bloc-has-53-seats-eisenkots-48-arab-parties-surge-to-19/"}, "b": "With about 99.9 percent of ballots counted, Netanyahu's bloc has 53 seats in the 120 seat Knesset, with Likud on 27. The opposition has 48, including Eisenkot's party on 21, and the Arab parties have 19. Official results are not expected before 4 November. Eisenkot has ruled out serving under Netanyahu, and some opposition figures are wary of relying on Arab parties.", "w": "Neither side can reach 61 without the Arab parties, so Israel faces weeks of bargaining or possibly another election. That keeps the war and Iran policy in limbo."}, {"h": "Oil sits near US$114 as the US tries to restart Iran talks", "s": {"t": "HDFC Sky", "u": "https://hdfcsky.com/news/oil-prices-today-october-29-2026-brent-falls-to-114-2-wti-at-101-4-as-us-iran-peace-hopes-counter-supply-risks"}, "b": "Brent slipped to about US$114 a barrel on 29 October, with US crude near US$101. Reports say Vice President JD Vance sent a letter to Iranian official Mohsen Rezaei, and Qatar has given Tehran a draft proposal to end the war. Traders are still cautious because of Houthi attacks on Saudi energy sites and a Trump threat to resume the war after the midterms.", "w": "Brent is not far off a four year high. Fuel was a big driver of Australia's 4.3 percent inflation, so any deal or breakdown flows straight to bowser prices and the RBA."}, {"h": "US midterms are five days away and Democrats are favoured for the House", "s": {"t": "The Hill", "u": "https://thehill.com/homenews/campaign/6175621-midterm-elections-polls-close-results/"}, "b": "The election is on Tuesday 3 November. Decision Desk HQ's forecast gave Democrats about an 80 percent chance of the House and 57 percent for the Senate as of Tuesday. Senate leads are narrow, with North Carolina named as their best pickup chance and Maine, Texas, Ohio and Alaska close.", "w": "Control of Congress decides how much room Trump has on tariffs, spending and Iran. Results land in Australian time on Wednesday 4 November, so expect market moves."}], "quick": [{"x": "North Korea fired a barrage of short range missiles off its eastern coast on 29 October.", "t": "Stars and Stripes", "u": "https://stripes.com/theaters/asia_pacific/2026-10-29/north-korea-missile-launch-23295815.html"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Microsoft's Azure grows 48 percent and OpenAI brings in US$10 billion", "s": {"t": "Microsoft", "u": "https://news.microsoft.com/source/2026/10/28/microsoft-announces-first-quarter-results-2/"}, "b": "Microsoft's September quarter revenue was US$92.3 billion, up 19 percent, with Azure up 48 percent to US$33.2 billion. It guided to 49 to 50 percent Azure growth next quarter. Its filing shows US$10 billion of revenue from commercial arrangements with OpenAI, and contracted future revenue rose 73 percent to US$677 billion.", "w": "It is the strongest evidence yet that AI demand is turning into cloud revenue. Australian companies and governments buy much of this capacity, so it shapes data centre and power demand here."}, {"h": "Alphabet shares plunge more than 13 percent after earnings", "s": {"t": "Capital Brief", "u": "https://www.capitalbrief.com/briefing/australian-shares-set-to-rise-despite-alphabets-record-plunge-554e7af0-71aa-4599-8719-459e767d8c75/"}, "b": "Alphabet, Google's parent, fell more than 13 percent on Thursday in US trading, which Capital Brief called a record plunge. Tech coverage pointed to a US$9.1 billion quarterly cash outflow as AI spending climbs. The same day Google said it will roll out ads in its AI Mode search to Australia and other countries.", "w": "Investors are rewarding AI spending that shows up as revenue (Microsoft) and punishing it when cash burns faster. It is a test for the whole AI trade, including ASX tech stocks."}, {"h": "Apple launches its first touchscreen Mac", "s": {"t": "Apple", "u": "https://www.apple.com/newsroom/2026/10/apple-unveils-groundbreaking-macbook-pro-with-proled-xdr-display/"}, "b": "The new MacBook Pro has a tandem OLED touchscreen and M5 Pro or M5 Max chips. Pre orders opened on 28 October and it ships on Friday 6 November. US pricing starts at US$2,899 for the 14 inch and US$3,399 for the 16 inch.", "w": "Apple long resisted touch on laptops, so this is a real shift in its Mac line and a sign it wants Siri and on device AI to sit closer to everyday computing."}], "quick": [{"x": "A family has sued OpenAI in California, alleging ChatGPT gave a 19 year old advice on mixing drugs before a fatal overdose; the claims are allegations only.", "t": "News 5 Cleveland", "u": "https://www.news5cleveland.com/science-and-tech/artificial-intelligence/family-sues-openai-alleging-chatgpt-gave-19-year-old-deadly-drug-advice-before-fatal-overdose"}, {"x": "Google's Gemini 4 Argon, launched on 30 September, is still limited to vetted cyber defence teams while Google works on safeguards.", "t": "Tech Wire Asia", "u": "https://techwireasia.com/2026/10/google-gemini-4-argon-cybersecurity-access/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Government launches an inquiry into the future of Australia Post", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-30/federal-politics-live-blog-oct-30/107324978"}, "b": "Communications Minister Anika Wells said changing consumer habits and commercial pressures pose big challenges to Australia Post's long term sustainability. The inquiry is due to report by the middle of next year. Earlier the Coalition said it would push a Senate inquiry over a leaked plan that would start with 159 licensed post offices more than 50 kilometres from a bank.", "w": "Parcels are growing but letters are shrinking fast, and the question is who pays to keep regional post offices open. Expect it to become a regional seats issue."}, {"h": "Court grants interim control order for convicted terror plotter", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-29/federal-politics-live-blog-oct-29/107320104"}, "b": "Home Affairs Minister Tony Burke told Parliament a court granted an interim control order for Isaak el Matari, convicted in 2021 over a plot linked to an Islamic State stronghold in the Blue Mountains. The AFP sought the order, which can impose restrictions for up to 12 months. Home Affairs did not seek a continuing detention order, which could have kept him in custody up to five more years, and the Coalition questioned that choice.", "w": "It shows the trade off between locking someone up after a sentence ends and monitoring them in the community. The opposition will keep pressing the government on it."}, {"h": "Albanese says police were called to the Lodge over a security concern", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-29/federal-politics-live-blog-oct-29/107320104"}, "b": "The Prime Minister said police attended his Canberra residence the previous night over a security concern. He used the moment to repeat his call to turn down the heat in political debate. Few details were public in what we could see.", "w": "Security around politicians has been a live issue this year, and both sides tend to back calls for a calmer tone even as the debate stays sharp."}], "quick": [{"x": "Australia sanctioned two North Korean individuals and two companies over fraudulent IT work and cybercrime that funds weapons programs, and on 28 October the EU and 11 countries backed coordinated action.", "t": "France 24", "u": "https://www.france24.com/en/live-news/20261023-australia-sanctions-north-koreans-over-fraudulent-it-work-cybercrime"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "CBA and ANZ now expect the RBA to lift rates to 4.85 percent on Tuesday", "s": {"t": "CommBank", "u": "https://www.commbank.com.au/articles/newsroom/2026/10/commbank-november-rba-rate-hike-inflation-risks.html"}, "b": "After September inflation hit 4.3 percent, CBA and ANZ switched to forecasting a hike on 3 November, and Westpac kept its hike call. It would be the fifth rise this year. Trimmed mean inflation was 3.7 percent over the year, and markets price about an 85 percent chance of a move.", "w": "A rise means higher variable mortgage repayments within weeks, and Australian rates would be at levels not seen since 2008, per the coverage."}, {"h": "Warburg Pincus trumps AVID for Ingenia and the matching clock is ticking", "s": {"t": "Finance News Network", "u": "https://www.finnewsnetwork.com.au/archives/finance_news_network6023353.html"}, "b": "Warburg Pincus lifted its non binding proposal for Ingenia Communities to $5.45 cash plus up to 5 cents of distribution, or $5.50, beating AVID's $5.35 plus 5 cents. Ingenia's board triggered AVID's matching right and AVID has until 1 November to respond. Warburg would split the business, with Discovery Parks taking the holiday parks and LDR Capital the gardens business. The board has not recommended either bid.", "w": "Competing bidders usually push the price up, and the winner may reshape a business that houses many retirees. Neither offer is binding yet."}, {"h": "ASX 200 climbs 0.5 percent as banks lead, retailers slip", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-29/asx-markets-business-live-news-29-october-2026/107321622"}, "b": "The ASX 200 closed at about 8,891.8, a 20 day high, with NAB, Westpac and CBA rising and miners lagging. Consumer stocks slid after Wesfarmers flagged a slowdown at Bunnings and JB Hi Fi reported first quarter sales down 0.4 percent. Star Entertainment rose after it resumed trading with a plan to pay a $260 million fine.", "w": "Weak retail updates alongside 4.3 percent inflation hint that households are stretched, which is the situation the RBA is trying to manage."}], "quick": [{"x": "ASIC is looking into what went wrong with the failed Firmus IPO.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-29/asx-markets-business-live-news-29-october-2026/107321622"}]}], "explainer": {"term": "Matching right", "body": "A matching right is a clause in a takeover deal that lets the first bidder respond if a rival offers more. In the Ingenia case, AVID signed a process deed with the board, so when Warburg Pincus bid higher, AVID was given until 1 November to match or beat it. The clause rewards bidders who did the early work and gives the board a clear timetable. It can also scare off rivals, which is why boards often limit how long it lasts. For shareholders, it usually means a higher final price, though neither bidder is bound until a deal is signed."}, "ahead": [{"d": "Sun 1 Nov", "e": "AVID's deadline to match or beat Warburg Pincus's $5.50 proposal for Ingenia"}, {"d": "Tue 3 Nov", "e": "RBA rate decision on Melbourne Cup Day, with a rise to 4.85% widely expected"}, {"d": "Wed 4 Nov", "e": "US midterm results start arriving in Australian time; Israel's official election results not due before this date"}, {"d": "Fri 6 Nov", "e": "Apple's touchscreen MacBook Pro goes on sale"}]}
</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
