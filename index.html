<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>

<script type="application/json" id="brief">{"date": "2026-11-24", "edition": "Tuesday 24 November 2026", "lede": ["Nvidia has reinstated Jensen Huang as chief executive after pressure from the White House, sending its shares up about 31% and giving Wall Street its best day since April 2025.", "Jim Chalmers has warned unemployment will peak above 5% and growth will stay well below 2%, a day before October's inflation figures land.", "Ukraine says its sea drones sank a Russian warship docked in Libya, as Volodymyr Zelenskyy warns Russia is planning fresh strikes on Ukrainian cities."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "As at 24 Nov; next decision due 8 Dec, with CommBank tipping a hold"}, {"label": "ASX 200", "value": "8,570.6", "note": "Close on Mon 23 Nov, down 0.26% for an eighth straight fall"}, {"label": "S&P 500", "value": "7,237.17", "note": "Close on Mon 23 Nov (US time), up 4.73% on the day"}, {"label": "AUD/USD", "value": "66.15 US cents", "note": "Mon 23 Nov afternoon, down 0.6% on the day"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Ukraine says it sank a Russian warship in Libya", "s": {"t": "NPR", "u": "https://www.npr.org/2026/11/23/g-s1-155017/ukraine-attack-russian-warship-libya"}, "b": "Zelenskyy says seven Ukrainian naval drones hit the Russian corvette Merkury at the Benghazi naval base in eastern Libya on Sunday, and that the ship sank. He says they also struck the cargo ship MV Angara, which he claims Moscow used to move weapons. Two Libyan officials said the corvette was badly damaged rather than sunk, and the Kremlin declined to comment.", "w": "It shows Ukraine can now hit Russian assets far from the Black Sea, and puts pressure on Russia's military foothold in North Africa."}, {"h": "Zelenskyy warns Russia is planning new strikes", "s": {"t": "Reuters via US News", "u": "https://www.usnews.com/news/world/articles/2026-11-23/zelenskiy-says-intelligence-shows-russia-planning-new-strikes-on-ukraine"}, "b": "Zelenskyy said on Monday that Ukrainian intelligence shows Russia is preparing fresh attacks, and urged the US and other partners to act because air defence supplies depend on their decisions. The Kremlin declined to comment on his earlier claim that US envoys floated Ukraine giving up the Donbas region in exchange for NATO membership.", "w": "Winter strikes on power grids are Russia's usual pressure tactic, and the peace track with Washington still looks shaky."}, {"h": "Qatar's PM meets Rubio as Iran talks stall", "s": {"t": "Washington Times", "u": "https://www.washingtontimes.com/news/2026/nov/23/marco-rubio-meets-qatari-prime-minister-amid-diplomatic-slowdown-iran/"}, "b": "Qatar's Prime Minister Sheikh Mohammed bin Abdulrahman Al Thani met US Secretary of State Marco Rubio in Washington on Monday, officially to open the eighth US Qatar strategic dialogue, with Iran also on the table. Qatar is trying to revive stalled US Iran talks, and its PM said the region cannot afford a new escalation. Washington still insists any deal must see Iran dismantle its nuclear infrastructure, and Trump has floated resuming major strikes after the New Year if talks fail.", "w": "Any breakthrough or breakdown flows straight into oil prices, and from there into Australian petrol prices and inflation."}, {"h": "Belgium grinds to a halt over an austerity budget", "s": {"t": "France 24", "u": "https://www.france24.com/en/live-news/20261123-new-belgium-protests-as-embattled-govt-sets-budget-deadline"}, "b": "A national strike on Monday grounded all flights in and out of Belgium, and police estimated about 50,000 people marched in Brussels, with riot police using tear gas and water cannon. Prime Minister Bart De Wever has given his coalition until 31 December to agree a budget with roughly 10 billion euros in savings, including healthcare cuts and a VAT rise, or face collapse.", "w": "It is a sharp example of the fight many rich countries face over shrinking deficits without gutting health and welfare."}], "quick": [{"x": "US Vice President JD Vance declined on Friday to say whether he would have authorised strikes on Iran to stop it building a nuclear weapon.", "t": "Just Security", "u": "https://www.justsecurity.org/165610/early-edition-november-23-2026/"}, {"x": "Only two metro lines ran in Brussels during the strike, and no flights left Belgian airports.", "t": "Brussels Times", "u": "https://www.brusselstimes.com/belgium/2416819/national-strike-no-flights-at-belgian-airports-only-two-metro-lines-running-in-brussels-tbtb"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Nvidia brings back Jensen Huang after Trump steps in", "s": {"t": "NBC News", "u": "https://www.nbcnews.com/tech/tech-news/nvidia-reinstates-jensen-huang-rcna610864"}, "b": "Nvidia's board voted unanimously on Monday (US time) to reinstate Huang as chief executive and a director, 11 days after he quit over revelations of extramarital affairs, including one with a woman US intelligence believes is a Chinese spy. The company said the move followed input from senior levels of the US government, and Trump said he personally convinced the board. Interim boss Colette Kress goes back to being finance chief, and Huang will face an open Senate Banking Committee hearing on 3 December.", "w": "The world's most important AI chipmaker reversing course under White House pressure raises big questions about board independence, even as investors cheered."}, {"h": "US governors pitch a split of AI rule making", "s": {"t": "PYMNTS", "u": "https://www.pymnts.com/news/artificial-intelligence/2026/governors-want-states-to-have-a-voice-in-regulating-ai/"}, "b": "The National Governors Association released AI principles on Sunday, asking the incoming Congress for a national framework that hands national and international risks to Washington while letting states set rules on how AI is used locally. The bipartisan push, led by Maryland's Wes Moore and Indiana's Mike Braun, warns Congress against wiping out state AI laws, which puts it at odds with the White House.", "w": "The US fight over who regulates AI will shape the rules Australian firms using American AI tools end up living with."}, {"h": "Online safety bill gets carve outs as the Senate clock runs down", "s": {"t": "SBS News", "u": "https://www.sbs.com.au/news/article/digital-duty-of-care-safety-bill-carve-outs/gcrra8bh4"}, "b": "Communications Minister Anika Wells has promised low risk small business websites will be exempt from the digital duty of care, although the bill as introduced has no automatic exemption. Labor needs the Greens to pass it before parliament rises on Thursday, and the Greens want a right for harmed users to sue platforms plus fines of 10% of global revenue. The Coalition and One Nation are voting no.", "w": "If it passes, big platforms would have a legal duty to prevent foreseeable harm to Australian users, a major shift in how tech is regulated here."}], "quick": [{"x": "Nvidia's surge of more than 30% was its third best day on record.", "t": "Globe and Mail", "u": "https://www.theglobeandmail.com/business/article-nvidia-reinstates-jensen-huang-as-ceo/"}, {"x": "New US rules now require licences for advanced AI chips sent to data centres in Singapore, Malaysia, Thailand, Indonesia and Brazil, aimed at stopping Chinese firms renting compute offshore.", "t": "CNBC", "u": "https://www.cnbc.com/2026/11/18/nvidia-us-ai-chip-export-controls-data-centers-.html"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Chalmers warns unemployment will top 5%", "s": {"t": "The Conversation", "u": "https://theconversation.com/chalmers-flags-slowing-growth-warns-australians-things-might-get-a-bit-harder-295660"}, "b": "The Treasurer says unemployment is now on track to peak above 5%, worse than the May budget forecast, and growth will run well below 2% for the next two years. He says a recession is not forecast, but warned things might get a bit harder in 2027. The mid year budget update in December will include modest net savings, not what he called slash and burn cuts.", "w": "Rising joblessness with the cash rate at 4.85% is a tough mix for households and for Labor heading into 2027."}, {"h": "Unions walk away from Victorian Labor in the final week", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-24/victorian-election-unions-abandon-labor/107367014"}, "b": "Some unions are sitting out Saturday's Victorian election while others are telling members not to vote Labor, including the firefighters union, which ran ads urging voters to put Labor last. Experts expect Premier Ben Carroll's government to lose heavily after 12 years in power, with talk that his own seat is at risk and One Nation could hold the balance of power in the upper house.", "w": "Losing the union base is rare for Labor and shows how deep the grievances run against a long serving government."}, {"h": "Wong warns US China rivalry is eroding global rules", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-23/wong-sounds-alarm-over-us-china-rivalry/107418278"}, "b": "Foreign Minister Penny Wong is using a major speech today to argue that competition between the US and China is making the world more dangerous, with fewer guardrails stopping it tipping into conflict. She will say middle powers like Australia, India, Indonesia, Japan and South Korea are gaining influence and must work together.", "w": "It is a notable shift in tone from Australia's top diplomat, coming days after the Trump, Xi and Putin meeting in Shenzhen."}, {"h": "Gas reservation bill still short of votes despite WA carve out", "s": {"t": "AAP via Queanbeyan Age", "u": "https://www.queanbeyanage.com.au/story/9391961/coalition-marks-turf-on-gas-reserves-as-deadline-looms/"}, "b": "Labor wants a vote this week on a scheme forcing gas exporters to set aside up to 20% of output for the local market. It has exempted Western Australia to win over the Coalition, but Nationals senator Matt Canavan says the opposition still is not ready to back it, and the Greens want a 25% export tax instead. Ai Group and the ACTU are among groups urging parliament to pass it.", "w": "The outcome will affect gas prices for manufacturers and households on the east coast."}], "quick": [{"x": "The shadow treasurer has pledged a speed limit on government spending growth if the Coalition wins power.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-23/federal-politics-live-blog-parliament-nov-23/107415266"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX tipped to snap its losing run after Wall Street roars back", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-24/asx-markets-business-news-live-updates-nov-24-2026/107419524"}, "b": "ASX 200 futures were up about 1.5% this morning after Wall Street's best day since April 2025: the Dow rose 1,448 points, the S&P 500 gained 4.73% and the Nasdaq jumped 6.51%, led by Nvidia. On Monday the local market fell for an eighth straight day, closing 0.26% lower at 8,570.6, with banks the biggest drag and miners rebounding.", "w": "Super funds are heavily exposed to both US tech and local shares, so a rebound after the worst week since 2022 matters for most Australians' retirement savings."}, {"h": "Private sector shrinks at the fastest pace in five years", "s": {"t": "investingLive", "u": "https://investinglive.com/news/australia-flash-pmi-sinks-to-46-1-as-private-sector-shrinks-at-fastest-pace-in-5-years/"}, "b": "S&P Global's flash composite PMI for November fell to 46.1 from 48.2, its lowest reading since August 2021. Services dropped to 46.2 and manufacturing slipped to 48.7, new orders fell at the steepest pace since 2021, and business confidence hit a three year low. Cost pressures eased but are still above long run averages.", "w": "It backs Chalmers' gloomier forecasts and gives the RBA a reason to pause after two straight rate rises."}, {"h": "ALS posts a record profit but shares dive 12%", "s": {"t": "Investing.com", "u": "https://ca.investing.com/news/stock-market-news/als-h1-fy27-slides-minerals-margin-hits-decade-high-stock-falls-12-93CH-4974588"}, "b": "Testing company ALS lifted underlying half year profit 23.6% to $214.6 million, a record, helped by minerals margins at a decade high. But revenue in its life sciences arm fell 6.6% and it cut that division's full year growth outlook to about 3%, sending shares down about 12% to around $16.94 on Monday.", "w": "It shows how harshly this market punishes any downgrade, even alongside record results."}], "quick": [{"x": "The ABS releases October's monthly CPI at 11:30am Wednesday, the last big data point before the RBA meets on 7 and 8 December.", "t": "ABS", "u": "https://www.abs.gov.au/release-calendar/future-releases/202611"}, {"x": "CommBank says a December rate pause is increasingly likely after November's split board vote.", "t": "CommBank", "u": "https://www.commbank.com.au/articles/newsroom/2026/11/rba-rate-pause-split-vote-december-2026.html"}, {"x": "The ACCC has cleared Ingenia's takeover of Peet, with a window for tribunal review closing on 27 November.", "t": "Kalkine", "u": "https://kalkine.com.au/news/real-estate/peet-limited-asx-ppc-receives-favourable-accc-determination-advances-toward-ingenia-communities-scheme-vote"}]}], "explainer": {"term": "Purchasing managers' index (PMI)", "body": "A PMI is a monthly survey asking purchasing managers at hundreds of businesses whether things like output, new orders, jobs and prices went up, down or stayed the same. The answers are boiled down into one number where 50 is the dividing line. Above 50 means activity is growing, below 50 means it is shrinking, and the further from 50 the faster the change. Because it comes out weeks before official data like GDP, economists and the RBA watch it as an early warning signal. A 'flash' PMI is an early estimate based on most of the survey responses, with final figures a week or so later."}, "ahead": [{"d": "Tue 24 Nov", "e": "Penny Wong delivers a major foreign policy speech on US China rivalry."}, {"d": "Wed 25 Nov", "e": "ABS releases the October monthly CPI at 11:30am."}, {"d": "Thu 26 Nov", "e": "Last sitting day of federal parliament for 2026, with the gas reservation and digital duty of care bills still in play."}, {"d": "Fri 27 Nov", "e": "US markets closed for Thanksgiving overnight, so expect a quieter lead for the ASX."}, {"d": "Sat 28 Nov", "e": "Victorian state election day."}, {"d": "Wed 2 Dec", "e": "ABS releases September quarter GDP."}, {"d": "Fri 4 Dec", "e": "Jensen Huang testifies at an open US Senate Banking Committee hearing (Thu 3 Dec US time)."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
