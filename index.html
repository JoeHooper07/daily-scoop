<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-25", "edition": "Wednesday 25 November 2026", "lede": ["Solomon Islands has told Beijing it will not renew its 2022 security pact with China, and its prime minister Matthew Wale meets Anthony Albanese in Canberra today to lock in a new treaty with Australia.", "Labor has struck a deal with the Greens to pass its digital duty of care law this week, with fines for tech platforms of up to 5% of global revenue.", "The Nvidia comeback rally has already cooled, with its shares down almost 6% and Anthropic slipping below its IPO price, so the ASX is tipped to give back some of Tuesday's 1.8% jump."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "After a 6 to 3 vote to hike on 3 Nov; next move watched after today's CPI (as at 25 Nov)"}, {"label": "ASX 200", "value": "8,726.4", "note": "Up 1.82% on Tue 24 Nov, snapping an eight session losing streak"}, {"label": "AUD/USD", "value": "66.23 US cents", "note": "Down 0.1% on Tue 24 Nov"}, {"label": "Brent crude", "value": "US$88.96", "note": "Slid below US$90, down more than 3.5% on Tue 24 Nov"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Qatar tries to restart US Iran talks as Hormuz squeeze tightens", "s": {"t": "Euronews", "u": "https://www.euronews.com/2026/11/24/iran-orders-hormuz-closed-further-day-by-day-as-qatar-seeks-to-revive-peace-talks"}, "b": "Qatar's prime minister met Marco Rubio and JD Vance separately in Washington, saying the region cannot handle another round of US Iran escalation. On the same day Iran's army chief ordered the navy to close the Strait of Hormuz further day by day until Washington meets Tehran's conditions. Iran's Revolutionary Guard claimed three tankers hit mines, which a maritime monitor said was unconfirmed.", "w": "About a fifth of the world's oil normally moves through Hormuz, so any tightening flows straight into Australian petrol prices and inflation."}, {"h": "EU unveils a 22nd sanctions package on Russia, including a sports ban", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/23/eu-plans-sports-ban-in-sweeping-new-russia-sanctions-proposal"}, "b": "The European Commission wants to cut about 60 more Russian banks off the SWIFT payments system and blacklist more than 70 extra shadow fleet tankers. It would also ban Russian teams and athletes competing under their flag at EU events, and for the first time target electricity companies. All 27 member states must sign off before it takes effect.", "w": "Sanctions are Europe's main lever on Russia's war funding, and unanimity rules mean one holdout country can water them down."}, {"h": "Israeli strike kills Hamas internal security chief despite Gaza truce", "s": {"t": "Euronews", "u": "https://euronews.com/2026/11/24/israeli-strike-kills-hamas-internal-security-chief-in-gaza-source-tells-afp"}, "b": "Israeli airstrikes killed seven people in Gaza on Tuesday, including the head of Hamas's internal security service. Two police officers died when a police station in the Al Mawasi area of southern Gaza was hit. The strikes came despite a ceasefire in place since October 2025.", "w": "Repeated strikes test how durable the Gaza truce really is, which matters for regional stability and aid access."}, {"h": "Trump administration readies new tariffs to replace those the Supreme Court struck down", "s": {"t": "US News (Reuters)", "u": "https://www.usnews.com/news/top-news/articles/2026-11-24/trump-administration-set-to-unveil-new-tariffs-after-probe-on-excess-factory-capacity-sources-say"}, "b": "The US Trade Representative is set to announce tariffs on 16 economies after a probe into excess factory capacity, using a different legal power after the Supreme Court ruled in February that emergency powers law could not be used to set tariffs. Officials have signalled rates would largely mirror the 2025 tariffs, with caps from existing trade deals such as 15% for the EU and Japan. Australia is not among the 16 economies named in the probe.", "w": "A fresh tariff round can hit global growth and demand for Australian commodities even when Australia is not directly targeted."}], "quick": [{"x": "The European Parliament is debating how to restore the rule of law in Hungary after Viktor Orbán's 16 years in power.", "t": "Euronews", "u": "https://www.euronews.com/2026/11/24/europe-today-eu-commission-proposes-new-round-of-sanctions-against-russia"}, {"x": "Zelenskyy said support at a NATO parliamentary assembly meeting showed Ukraine deserves a place in the alliance, while the Kremlin declined to comment on talk of a Donbas for NATO trade.", "t": "Yahoo News", "u": "https://www.yahoo.com/news/world/articles/russia-preparing-strikes-ukraine-zelenskyy-185000079.html"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Nvidia gives back almost 6% as the Huang comeback rally cools", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/24/nvidia-stock-jensen-huang-return.html"}, "b": "Nvidia shares fell 5.86% on Tuesday after Monday's roughly 31% surge on Jensen Huang's return as CEO. Senator Elizabeth Warren says the company still owes Congress answers on export control compliance. Huang will be the sole witness at a public Senate Banking Committee hearing on export controls on 3 December, US time.", "w": "Nvidia is the bellwether for the whole AI trade, so its swings ripple into tech, energy and miner shares on the ASX."}, {"h": "Anthropic shares slip below their IPO price", "s": {"t": "TechCrunch", "u": "https://techcrunch.com/2026/11/24/anthropic-shares-fall-below-ipo-price-a-worrying-sign-for-ai-startups/"}, "b": "Anthropic stock traded as low as US$76 by midday Tuesday, below its US$83 listing price and nearly 12% down on Monday's close. The company raised about US$81.3 billion in the largest IPO on record, which began trading on Nasdaq on 19 November. A stock falling under its float price is often read as a sign investors are cooling on a sector.", "w": "How AI listings trade is a live test of whether investors still back the huge sums being spent on AI, which also drives demand for Australian data centres and power."}, {"h": "Labor and Greens strike a deal on the digital duty of care law", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-24/federal-politics-labor-makes-deal-greens-on-digital-duty-of-care/107420982"}, "b": "The government will pass its digital duty of care bill with Greens support, requiring tech giants to consider harms such as addictive doomscrolling. Under the deal, maximum penalties rise to 5% of a platform's global revenue, up from a A$109.2 million cap in Labor's original bill. The Coalition opposes it, and the Senate is expected to vote today before the House finishes it off on Thursday.", "w": "It would be one of the world's toughest platform safety laws and the first Australian online safety law passed without bipartisan support."}], "quick": [{"x": "An unclassified CIA computer system was breached in a cyberattack, with no classified information involved, according to an AP source.", "t": "AP via KARK", "u": "https://www.kark.com/news/national-news/an-unclassified-cia-system-was-breached-in-a-cyberattack-ap-source-says/"}, {"x": "Jensen Huang apologised to Nvidia employees after his return, as the stock retreated from its record one day gain.", "t": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/stocks/live/nvidia-live-updates-nvidia-stock-falls-as-exuberance-fades-after-jensen-huangs-return-as-ceo-142100906.html"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Solomon Islands drops its China security pact in a big win for Canberra", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-24/china-solomon-islands-security-pact-australia/107421976"}, "b": "Prime Minister Matthew Wale's government has told Beijing it will not renew the 2022 security agreement when it expires in April. The pact let Solomon Islands call on Chinese police and military and allowed Chinese naval stopovers. Opposition leader Manasseh Sogavare, who signed the deal, warned the move could damage ties with China.", "w": "The 2022 pact was seen in Canberra as a major strategic setback, raising fears of a Chinese military foothold about 2,000km from Australia."}, {"h": "Albanese and Wale to finalise a security treaty in Canberra today", "s": {"t": "AAP", "u": "https://aapnews.aap.com.au/news/australia-readies-for-absolutely-massive-pacific-win"}, "b": "The two leaders are expected to seal a treaty making Australia the Solomons' main security partner, building on a 2017 agreement. The ABC reports Australia will provide almost A$1 billion in funding. It follows similar deals with Fiji and Vanuatu earlier this year.", "w": "Treaties like this are Australia's main tool to compete with China for influence in the Pacific."}, {"h": "Coalition hands leaders power to close a gas reservation deal", "s": {"t": "ABC", "u": "https://abc.net.au/news/2026-11-24/federal-politics-live-blog-parliament-nov-24/107417818"}, "b": "The Coalition party room authorised its leadership to finalise a deal with Labor on the gas reservation bill without another vote. The bill would make LNG exporters set aside up to 20% of exports for local buyers from 2028. Resources Minister Madeleine King has rejected a carve out for Western Australia, and talks were continuing with no guarantee of a deal.", "w": "With parliament rising Thursday, this decides whether the biggest change to east coast gas policy in years happens in 2026."}, {"h": "Victorian Labor braces for defeat with three days to go", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-21/victorian-election-final-week/107412434"}, "b": "Political experts say Labor is heading for a historic loss on Saturday, ending 12 years in government. A RedBridge poll for the AFR had the Coalition on 33% of the primary vote, One Nation on 23% and Labor on 22%. Premier Ben Carroll is campaigning close to Melbourne while Opposition Leader Jess Wilson targets Labor seats in the west.", "w": "A big Labor loss and a strong One Nation vote in Victoria would be read as a warning for federal Labor too."}], "quick": [{"x": "The latest Newspoll has Labor and One Nation tied on 27% of the primary vote with the Coalition on 22%, and Angus Taylor leading Albanese as preferred PM for the first time.", "t": "The Poll Bludger", "u": "https://www.pollbludger.net/2026/11/22/newspoll-labor-27-one-nation-27-coalition-22-open-thread/"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX snaps an eight day losing streak with a 1.8% jump", "s": {"t": "ShareTrader", "u": "https://sharetrader.com.au/news/2026-11-24-asx-200-rebounds-after-jensen-huangs-return-to-nvidia-sparks-wall-street-rally"}, "b": "The ASX 200 rose 155.8 points, or 1.82%, to 8,726.4 on Tuesday as Nvidia's rebound lifted global markets. Ten of 11 sectors gained, led by tech up almost 3%, while energy lagged as oil fell. The market had dropped 5.4% last week, its worst week since 2022.", "w": "Super balances are heavily exposed to the ASX, so the sharp swings this month show up directly in members' statements."}, {"h": "ASX tipped to slip as the AI selloff resumes on Wall Street", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-25/asx-markets-business-live-news/107423208"}, "b": "Wall Street's rebound stalled overnight, with the Nasdaq down about 2% in early trade as AI stocks were sold again. Futures pointed to a 0.2% fall for the ASX at the open, which would be its eighth loss in nine sessions. The local hit should be smaller because the ASX has few big tech stocks.", "w": "It suggests Monday's rally was relief rather than a turning point for AI valuations."}, {"h": "AustralianSuper backs Brookfield's takeover of Reliance Worldwide", "s": {"t": "Yahoo Finance", "u": "https://au.finance.yahoo.com/news/reliance-worldwide-jumps-12-australiansuper-002300902.html"}, "b": "AustralianSuper, which owns about 18.5% of the plumbing parts maker, will vote for the Brookfield buyout at the 2 December scheme meeting unless a better offer appears. Foreign Investment Review Board approval has also come through, clearing the last regulatory hurdle. Shares jumped about 12% to their highest since March 2025.", "w": "When the biggest holder backs a scheme, it is very likely to pass, another ASX name heading into private equity hands."}, {"h": "October inflation lands today with rates at an 18 year high", "s": {"t": "SBS", "u": "https://www.sbs.com.au/news/live-blog/rba-november-2026-interest-rates-decision-live/f6csn2n1w"}, "b": "The ABS releases monthly CPI figures for October at 11:30am. The RBA lifted the cash rate to 4.85% on Melbourne Cup day, its fifth hike this year, in a split 6 to 3 vote. Jim Chalmers warned this week that unemployment will peak above 5%.", "w": "A hot number would keep pressure on the RBA to hike again in February despite a weakening economy."}], "quick": [{"x": "Steadfast has pushed back completion of its A$7.7 billion takeover to January because ACCC and FIRB approvals are lagging, though the shareholder vote stays on 27 November.", "t": "Reinsurance News Asia", "u": "https://reinasia.com/steadfast-pushes-takeover-completion-to-january-as-accc-firb-approvals-lag/"}, {"x": "Brent crude fell below US$90 a barrel on Tuesday, down more than 3.5%, while the Aussie dollar eased to 66.23 US cents.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-24/asx-markets-business-news-live-updates-nov-24-2026/107419524"}]}], "explainer": {"term": "Duty of care", "body": "A duty of care is a legal obligation to take reasonable steps to avoid causing foreseeable harm to others. It is an old idea from negligence law, which is why your employer must keep your workplace safe. Australia's new digital version applies the same thinking to tech platforms, so instead of just removing bad posts after the fact, they must design their services to reduce risks like addictive feeds. If they fail, a regulator can fine them, and under the Greens deal people may also be able to sue."}, "ahead": [{"d": "Wed 25 Nov", "e": "ABS releases the October monthly CPI at 11:30am; Solomon Islands PM Matthew Wale meets Albanese in Canberra."}, {"d": "Thu 26 Nov", "e": "Last sitting day of federal parliament for 2026, with the digital duty of care and gas reservation bills in play."}, {"d": "Fri 27 Nov", "e": "Steadfast shareholders vote on its A$7.7 billion takeover; US markets closed overnight for Thanksgiving."}, {"d": "Sat 28 Nov", "e": "Victorian state election day."}, {"d": "Wed 2 Dec", "e": "ABS releases September quarter GDP; Reliance Worldwide shareholders vote on the Brookfield takeover."}, {"d": "Fri 4 Dec", "e": "Jensen Huang testifies at a US Senate Banking Committee hearing on export controls (Thu 3 Dec US time)."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
