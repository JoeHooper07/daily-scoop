<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-17", "edition": "Tuesday 17 November 2026", "lede": ["A sharp AI selloff hit Wall Street overnight, with the Nasdaq down about 2.5% and Nvidia off 4% a day before its first results since Jensen Huang quit, so the ASX is set to open lower.", "Albanese joins Trump, Modi and Takaichi in Manila tonight for the first Quad leaders' meeting since 2024, as Washington tightens AI chip rules on China before Thursday's Shenzhen summit.", "In Canberra, Labor's gas reservation bill is still short of Senate votes, and the Greens have opened a new front by eyeing an alternative to its capital gains tax changes."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "As at 17 Nov; minutes of the 3 Nov hike, a split 6 to 3 vote, are out at 11.30am today"}, {"label": "ASX 200", "value": "9,044.7", "note": "Close on Mon 16 Nov, down 0.41% as miners dragged"}, {"label": "AUD/USD", "value": "about 67.4 US cents", "note": "Early Tue 17 Nov, near a 10 month low after falling about 0.5%"}, {"label": "Brent crude", "value": "US$92.29", "note": "Overnight to Tue 17 Nov a barrel, down 3.7% as Gulf shipments recover"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Trump lands in Manila for the Quad and a Thai trade deal before Shenzhen", "s": {"t": "ThePrint", "u": "https://theprint.in/diplomacy/modi-trump-set-to-meet-at-quad-summit-in-manila-right-before-us-presidents-trilateral-with-xi-putin/3100198/"}, "b": "Trump, Narendra Modi, Japan's Sanae Takaichi and Anthony Albanese meet in Manila this evening on the sidelines of the ASEAN summit. It is the first Quad leaders' meeting since September 2024 and Trump's first since returning to office. Trump is also due to sign a trade statement with Thai PM Anutin Charnvirakul, which Bangkok stresses is progress, not a final deal. He then flies to China for APEC and Thursday's three way meeting with Xi Jinping and Vladimir Putin.", "w": "The Quad (US, Japan, India, Australia) is one of Canberra's main tools for balancing China, so a revived leaders' meeting matters for Australian security policy."}, {"h": "Trump plays a waiting game as Iran keeps up drone attacks", "s": {"t": "CNN", "u": "https://www.cnn.com/2026/11/15/middleeast/iran-bahrain-attacks-trump-intl"}, "b": "After Iran's Revolutionary Guards claimed new drone strikes on a US radar in Bahrain, US Central Command said the drones were shot down with no damage or injuries. Trump has held off fresh strikes and is letting the naval blockade of Iran's ports squeeze its economy, reportedly shelving a JD Vance push to restart talks. Tehran says it will only negotiate if the blockade ends, sanctions are phased out and frozen assets are released.", "w": "Oil fell almost 4% overnight on recovering Gulf shipments, which is good news for Australian petrol prices, but analysts warn the standoff carries a real risk of miscalculation."}, {"h": "Ukraine launches its biggest drone attack on Russia of the war", "s": {"t": "ABC News US", "u": "https://abcnews.com/International/ukraine-fires-1336-drones-russia-wars-largest-attacks/story?id=138171397"}, "b": "Russia's defence ministry says it downed 1,336 Ukrainian drones across 16 regions overnight on Sunday, beating October's record of about 1,250. Around 600 drones headed for the Moscow region, while refineries and the Kerch Bridge to Crimea were targeted and at least six people were wounded in Krasnodar. The Kremlin called the damage minor, and the FT estimates as many as 2,000 drones were launched in total.", "w": "Ukraine is squeezing Russia's oil refining to hit its war funding, just days before Putin sits down with Trump and Xi in Shenzhen."}, {"h": "First COP31 draft keeps fossil fuel fight wide open", "s": {"t": "US News/Reuters", "u": "https://www.usnews.com/news/world/articles/2026-11-16/first-draft-of-cop31-deal-signals-tough-negotiations-to-come"}, "b": "The first draft deal from the Antalya climate talks, released Monday, includes both the softer COP28 wording on transitioning away from fossil fuels and tougher phase out language, and either could be cut. It also proposes tripling adaptation finance for developing countries to at least US$120 billion a year by 2035. Australia's Chris Bowen, who runs the negotiations, says parts of the text will not win everyone's agreement.", "w": "Australia's credibility as president of negotiations is on the line, with talks due to end on Friday."}], "quick": [{"x": "Iran's UN envoy has accused Bahrain of letting the US use its bases for attacks and warned Tehran will hit back at the source of any strike.", "t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/15/iran-says-it-targets-us-radar-in-bahrain-what-do-we-know"}, {"x": "About 20,000 police are deployed across Metro Manila for Trump's two day stop amid expected protests.", "t": "mlq.ai", "u": "https://mlq.ai/news/trump-flies-to-manila-for-a-quad-meeting-and-a-thailand-trade-signing-before-his-shenzhen-talks-with-xi-and-putin/"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "US moves to block China's remote access to top AI chips", "s": {"t": "The Hill", "u": "https://thehill.com/policy/technology/6222897-bis-limits-remote-computing-exports/"}, "b": "The Commerce Department issued an interim rule on Monday requiring licences for chips sent to overseas data centres that provide significant computing power to firms headquartered in places like China. Shipments to Singapore, Thailand, Malaysia, Indonesia and Brazil now also need licences because of diversion risk. The rule follows the Nvidia linked scandal involving Singapore cloud firm Megaspeed, formally scraps Biden's AI Diffusion Rule and takes effect in 90 days.", "w": "It closes a loophole where Chinese firms rent US chips in the cloud instead of buying them, and it lands just before Trump meets Xi on Thursday."}, {"h": "AI jitters slam Wall Street before Nvidia results and the Anthropic float", "s": {"t": "Investing.com/Reuters", "u": "https://www.investing.com/news/economy-news/trading-day-ai-jitters-slam-wall-street-5031112"}, "b": "The Nasdaq fell about 2.5% overnight, with Nvidia and Alphabet each down around 4% and the chip index losing 5.3%. Investors are nervous about Huang's exit ahead of Nvidia's results, due Wednesday morning Australian time, and the week's huge Anthropic listing. A stronger US dollar, at a 19 month high, and rate worries added to the pressure.", "w": "Big US tech swings flow straight into Australian super funds, which hold large global share portfolios."}, {"h": "DeepSeek users hit new limits as the chatbot runs short of computing power", "s": {"t": "TechNode", "u": "https://technode.com/2026/11/16/deepseek-users-report-chat-limits-as-the-service-cites-capacity-constraints/"}, "b": "Users of Chinese AI firm DeepSeek report a daily cap on free chats, inputs limited to about 40,000 characters, and old conversations that cannot be resumed after a week. Notices blame insufficient computing capacity, and DeepSeek has not confirmed the changes or said when they will lift. Its status page shows eight incidents since October.", "w": "It is a real world sign that US chip curbs are pinching Chinese AI labs, the exact pressure Washington is now tightening."}], "quick": [{"x": "Anthropic is expected to price its IPO of 825 million shares at US$70 to US$78 on Wednesday US time and start trading on Nasdaq as ANT on Thursday.", "t": "CNBC", "u": "https://www.cnbc.com/2026/11/16/anthropic-ipo-date-price-range.html"}, {"x": "Bloomberg reports the new rules specifically target remote access to Nvidia's most advanced AI chips.", "t": "Bloomberg", "u": "https://www.bloomberg.com/news/articles/2026-11-16/us-moves-to-limit-remote-access-to-advanced-ai-chips"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Gas reservation bill still stuck as the Coalition demands a WA carve out", "s": {"t": "About Regional", "u": "https://aboutregional.com.au/all-eyes-on-senate-this-week-over-gas-reservation-scheme/520569/"}, "b": "Labor needs either the Coalition or the Greens to pass its plan forcing LNG exporters to sell up to 20% of export volumes to local buyers. The Coalition says it is open to the idea but wants changes, including keeping Western Australia out, while the Greens want a 25% export tax instead. Resources Minister Madeleine King has ruled out the tax, says the constitution keeps WA in, and warns senators that a no vote means higher prices.", "w": "The scheme is the government's main answer to east coast gas shortages and high power bills for households and manufacturers."}, {"h": "Greens eye Allegra Spender's alternative to Labor's capital gains tax changes", "s": {"t": "InnovationAus", "u": "https://www.innovationaus.com/greens-open-to-very-interesting-cgt-discount-alternative/"}, "b": "Labor's package swaps the 50% capital gains discount for an inflation based deduction and adds a 30% minimum tax on gains. Independent Allegra Spender wants a 40% discount for productive assets, so the inflation approach would mainly hit housing. The Greens, who hold the Senate balance of power, called the plan very interesting and opened the door to an inquiry, while the government is reportedly not keen.", "w": "Any delay or rewrite affects how investors, startups and property owners are taxed when they sell assets."}, {"h": "Albanese and Marcos promise to consult on threats to sovereignty", "s": {"t": "Philstar", "u": "https://www.philstar.com/headlines/2026/11/16/2570519/marcos-australias-albanese-commit-consult-threats-sovereignty"}, "b": "Meeting in Manila on Monday night, the two leaders agreed to consult if either country's sovereignty or shared security interests are threatened, building on Sunday's new defence cooperation arrangement. It is not a mutual defence pledge. They also said the 2016 tribunal ruling against China's South China Sea claims is final and binding.", "w": "It deepens Australia's security ties with a frontline South China Sea state without locking Canberra into a war commitment."}, {"h": "Victorian Coalition widens its lead with under two weeks to go", "s": {"t": "The Conversation", "u": "https://theconversation.com/with-two-weeks-to-go-the-victorian-election-is-the-coalitions-to-lose-296248"}, "b": "Jess Wilson's Coalition went into the campaign ahead and has since strengthened its position, according to analysis of recent polls. An AFR poll cited has the Coalition on 31% of the primary vote, Labor 23% and One Nation 22%, or 57 to 43 after preferences. Victorians vote on 28 November.", "w": "A loss would end Labor's long hold on Victoria and test how far One Nation's surge reaches into state politics."}], "quick": [{"x": "Independent MP Helen Haines has been released from hospital, with politicians across parliament welcoming the news.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-16/federal-politics-live-blog-senate-gas-nov-16/107388656"}, {"x": "Albanese pressed Laos's new PM over the methanol poisoning deaths of two Australian teenagers and raised detained Australian Hiep Tran with Vietnam's leader.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-17/federal-politics-live-blog-senate-albanese-/107391106"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Coles says no sign customer data was taken as the ASX slips", "s": {"t": "Proactive Investors", "u": "https://www.proactiveinvestors.com/companies/news/1101791/coles-shares-hold-firm-despite-cyber-security-incident-1101791.html"}, "b": "Coles told the ASX it has found no evidence so far that customer, staff or supplier data was compromised, and is working with the Australian Cyber Security Centre. Liquorland click and collect was the only service reported as disrupted, and Coles shares ended just 0.09% lower at $22.22. The wider ASX 200 fell 0.41% to 9,044.7 as miners dragged.", "w": "The finding is preliminary, so watch for updates; big retail breaches have cost Australian companies dearly in fines and trust."}, {"h": "RBA minutes today should explain November's split vote", "s": {"t": "Judo Bank", "u": "https://www.judo.bank/economics-weekly-briefing-16-november-2026/"}, "b": "The Reserve Bank releases minutes of its 3 November meeting at 11.30am, when the board lifted the cash rate to 4.85% on a six to three vote. Economists want to know why three members wanted to hold and what the board needs to see before moving again. Wages data lands on Wednesday and jobs figures on Thursday.", "w": "Clues of a pause would be welcome for mortgage holders after five hikes this year."}, {"h": "Oil and the Aussie dollar slide together", "s": {"t": "Motley Fool", "u": "https://www.fool.com.au/2026/11/17/5-things-to-watch-on-the-asx-200-on-tuesday-17-november-2026/?_fcb=1794868472"}, "b": "Brent crude fell 3.7% to about US$92.29 a barrel overnight, well down from above US$117 a few weeks ago, as Middle East shipments recover and traders expect a supply surplus. Energy stocks like Santos and Beach could come under pressure. The Australian dollar dropped about 0.5% to near a 10 month low as investors dumped risky currencies.", "w": "Cheaper oil should ease petrol prices and inflation, but a weaker dollar makes imports dearer, a mixed picture for the RBA."}], "quick": [{"x": "Catapult Sports releases its half year results today.", "t": "Motley Fool", "u": "https://www.fool.com.au/2026/11/17/5-things-to-watch-on-the-asx-200-on-tuesday-17-november-2026/?_fcb=1794868472"}, {"x": "BBH says the RBA dropping earlier language about further rises, plus the split vote, could signal a pause.", "t": "FXStreet", "u": "https://www.fxstreet.com/news/australian-dollar-rba-minutes-in-focus-before-wages-data-bbh-202611161404"}]}], "explainer": {"term": "Export controls", "body": "Export controls are government rules that stop certain goods or technology being sold overseas without a licence, usually for national security reasons. The US uses them to keep its most advanced AI chips away from China's military and tech firms. The catch is that chips can leak through third countries or be rented remotely in overseas data centres, which is why Washington keeps widening the rules. Exporters like Nvidia lose sales, while targets such as Chinese AI labs scramble for computing power. Australia is part of this world too, since allies are expected to line up with US controls."}, "ahead": [{"d": "Tue 17 Nov", "e": "RBA minutes 11.30am AEDT; Quad leaders meet in Manila this evening; Trump and Thailand sign a trade statement."}, {"d": "Wed 18 Nov", "e": "ABS Wage Price Index; Nvidia results early morning AEDT; APEC week continues in Shenzhen."}, {"d": "Thu 19 Nov", "e": "ABS October jobs figures; Trump, Xi and Putin meet in Shenzhen; Anthropic expected to price its IPO overnight."}, {"d": "Fri 20 Nov", "e": "Anthropic due to start trading on Nasdaq overnight; COP31 climate talks scheduled to end in Antalya."}, {"d": "Wed 25 Nov", "e": "US PCE inflation data out overnight, a key input for the Fed's December decision."}, {"d": "Sat 28 Nov", "e": "Victorian state election."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
