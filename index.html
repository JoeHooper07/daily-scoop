<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-14", "edition": "Saturday 14 November 2026", "lede": ["A global Microsoft outage knocked out Outlook, Teams and Copilot, hitting the AFP and ASIO and prompting Canberra to activate a special recovery deal with the tech giant.", "Europe will get a seat at the next round of US brokered Ukraine talks after Trump's envoys briefed Zelensky in Dublin, though Moscow is staying vague on whether it agrees.", "The ASX fell 0.7% to 9,082.2 as Nvidia's leadership shock, rising bond yields and weaker commodities hit the market, with the Aussie dollar sliding to its lowest since January."], "numbers": [{"label": "ASX 200", "value": "9,082.2", "note": "Close on Fri 13 Nov, down 0.71% (64.6 points) as gold miners and property led losses"}, {"label": "AUD/USD", "value": "about 68.0 US cents", "note": "Fri 13 Nov afternoon, lowest since late January"}, {"label": "Brent crude", "value": "US$95.84", "note": "Settle on Fri 13 Nov, up 2 cents on the day but down for a second straight week"}, {"label": "RBA cash rate", "value": "4.85%", "note": "Set on 3 Nov in a split vote, the highest since 2008; next decision 8 Dec"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Europe gets a seat at the next round of Ukraine peace talks", "s": {"t": "CNN", "u": "https://www.cnn.com/2026/11/12/politics/ukraine-witkoff-kushner-putin-peace-talks-intl"}, "b": "US envoys Steve Witkoff and Jared Kushner flew from meeting Vladimir Putin to brief Volodymyr Zelensky at an airbase outside Dublin, in talks that ran just under an hour. Kushner said both sides had agreed Europeans would join the next round, something Kyiv and European capitals have long pushed for. Russia was evasive about that on Friday, and nobody has said who would represent Europe. Zelensky also said the envoys told him the planned prisoner swap would be the biggest of the war.", "w": "Europe wants any deal to cover its own security, not just Ukraine's borders, so its presence could make a settlement sturdier but also slower. A lasting ceasefire would ease energy and grain prices that flow through to Australian inflation."}, {"h": "Xi says Taiwan 'reunification' will happen as Taipei reveals a huge silent drill", "s": {"t": "Al Jazeera", "u": "https://aljazeera.com/news/2026/11/12/xi-jinping-says-taiwans-complete-reunification-with-china-will-happen"}, "b": "Chinese leader Xi Jinping told a Sun Yat-sen anniversary event that bringing Taiwan under Beijing's control is an unwavering mission of the Communist Party, though he did not mention force. Taiwan detected 29 Chinese military aircraft and warships on a combat readiness patrol around the island the same day. Separately, Taiwanese officials said more than 100 Chinese naval and coast guard vessels massed across the western Pacific in an unannounced exercise in early November, bigger than China's last named Taiwan drill.", "w": "Taiwan's Strait is one of the world's busiest shipping lanes and the hub of advanced chip making, so any squeeze there would hit Australian trade and tech supply chains. It also sits behind Japan's ongoing row with Beijing."}, {"h": "Indonesia's parliament will pick a new vice president on 2 December", "s": {"t": "Arab News", "u": "https://www.arabnews.pk/world/indonesias-upper-house-to-pick-new-vice-president-on-december-2-its-speaker-says-3006980"}, "b": "After Gibran Rakabuming Raka quit as vice president, the speaker of Indonesia's upper house said MPs will choose his replacement on 2 December. The house will ask President Prabowo Subianto to submit two names, and has set up a team of 36 lawmakers to check candidates' credentials. Gibran stepped down after courts found he lacked the required education qualifications, and it is not yet clear who Prabowo will put forward.", "w": "Indonesia is Australia's giant northern neighbour and a key security and trade partner, so who stands next in line to Prabowo matters for Canberra. The pick will show how firmly Prabowo now controls Jakarta's politics."}], "quick": [{"x": "Trump warned he would not hesitate to strike Iran again if it threatens ships in the Strait of Hormuz, while Tehran says it won't talk until the US blockade ends and frozen assets are released.", "t": "Middle East Eye", "u": "https://www.middleeasteye.net/news/trump-sidelines-vance-iran-talks-says-no-need-negotiate"}, {"x": "US producer prices rose 0.3% in October, a bit under forecasts, but are up 6.5% on a year ago, the fastest pace since late 2022.", "t": "UPI", "u": "https://www.upi.com/Top_News/US/2026/11/13/producer-price-index-october-2026-federal-inflation/2091794581625/"}, {"x": "Taiwanese officials described China's unannounced early November naval surge as one of Beijing's largest deployments yet, calling it silent intimidation.", "t": "Japan Times", "u": "https://www.japantimes.co.jp/news/2026/11/13/asia-pacific/politics/china-silent-intimidation/"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Global Microsoft outage takes down Outlook, Teams and Copilot", "s": {"t": "iTnews", "u": "https://www.itnews.com.au/news/microsoft-365-recovers-with-outlook-back-online-630336"}, "b": "Microsoft 365 services went down worldwide on Friday, cutting off email, chat and AI tools for businesses and governments. In Australia the outage hit the AFP and ASIO, and Home Affairs Minister Tony Burke said Microsoft did not believe it was a cyber attack. Recovery began around 10pm AEDT, starting with parts of Asia Pacific, and Outlook is back online. Microsoft has not yet said publicly what caused it.", "w": "So much of the economy, from banks to spy agencies, runs on one vendor's cloud that a single fault becomes a national problem. Expect fresh pressure on Canberra to diversify its suppliers."}, {"h": "Canberra pulls the lever on its Microsoft emergency deal", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-13/federal-politics-live-blog-backpacker-visas/107380962"}, "b": "Burke said the government activated its digital resilience agreement with Microsoft on Friday so Australian interests get priority in the fix. The framework, struck in June, commits Microsoft to help restore Australia's digital economy quickly after major outages in its systems. Burke was briefed by national cyber security coordinator Michelle McGuinness and the company. The ABC also reported that a top national security adviser had warned months ago about how heavily government relies on Microsoft.", "w": "It is the first real test of whether these government and big tech pacts actually deliver, and an early sign of how Australia might handle tech sovereignty."}, {"h": "Nonprofits sue to freeze frontier AI at five big labs", "s": {"t": "Public Citizen", "u": "https://www.citizen.org/news/coalition-of-nonprofits-files-landmark-lawsuit-to-stop-development-of-advanced-ai-systems-at-anthropic-google-meta-openai-and-spacexsi-that-proliferate-bioweapons-and-cyberattacks/"}, "b": "Four groups including Public Citizen filed a case in San Francisco Superior Court on Thursday against Anthropic, Google, Meta, OpenAI and SpaceX's AI arm. They want an injunction stopping the companies from building or releasing anything more capable than their current best models. The suit uses California's unfair competition law, arguing advanced AI is a public nuisance that could aid bioweapons or cyber attacks. No court has ruled on it.", "w": "The odds of a freeze are long, but the case lands days before Anthropic's planned Nasdaq float and adds to a global push, including Australia's new AI safety regulator, to put legal limits on frontier AI."}, {"h": "Nvidia's interim boss faces her first big test next week", "s": {"t": "NPR", "u": "https://www.npr.org/2026/11/13/nx-s1-6038889/colette-kress-becomes-nvidias-interim-ceo-after-jensen-huang-resigns"}, "b": "Colette Kress, Nvidia's finance chief since 2013, is now also interim CEO after Jensen Huang's sudden exit, and the board is searching inside and outside the company for a permanent replacement. Her first earnings report as boss lands on 17 November US time. Nvidia shares kept sliding on Friday and helped drag the Nasdaq down about 1%.", "w": "Nvidia's results are a bellwether for the whole AI spending boom, which has propped up global share markets including Australian data centre and tech stocks."}], "quick": [{"x": "OpenAI launched two AI security tools, Daybreak Red Team and Daybreak Defense Factory, to automate hacking tests and bug fixes for organisations.", "t": "The Register", "u": "https://www.theregister.com/security/2026/11/12/openai-launches-security-products-tells-orgs-theyre-doomed-if-they-dont-use-them/5309500"}, {"x": "Anthropic has set an IPO price range of US$70 to US$78 a share, valuing it at up to about US$1.4 trillion, with trading eyed for 19 November.", "t": "CNBC", "u": "https://www.cnbc.com/2026/11/10/anthropic-sets-price-range-of-70-to-78-in-upcoming-ipo.html"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "AFP chief warns of 'terrorism 2.0' as a new online threat centre opens", "s": {"t": "Blayney Chronicle (AAP)", "u": "https://www.blayneychronicle.com.au/story/9390870/australia-prepares-for-terrorism-20-with-online-hub/"}, "b": "AFP Commissioner Krissy Barrett says young people can now be radicalised online in about the time it takes to watch a day of Test cricket. Children make up 40% of the national counterterrorism caseload. A joint AFP and ASIO Counter Terrorism Online Centre opened in Sydney on Friday, funded with A$74 million from the May budget. ASIO boss Mike Burgess will brief Tony Burke next week on a new way of setting terrorism threat levels.", "w": "It marks a shift from policing organised groups to spotting lone kids radicalised on their phones, which links to the government's push on social media and online safety laws."}, {"h": "Victorian Liberals' One Nation preference gamble draws fire before the 28 November poll", "s": {"t": "Crikey", "u": "https://crikey.com.au/2026/11/13/jess-wilson-victorian-election-liberal-preferences-one-nation-tony-abbott"}, "b": "Two weeks out from the Victorian election, Jess Wilson's Liberals are under scrutiny over how they will direct preferences to One Nation. Polls show voters split on a possible Coalition and One Nation government: Resolve found 48% of Victorians are comfortable with it, while a Newspoll found a third of those wanting a Coalition majority would rather have Labor than a deal with One Nation. Labor is running hard on anti One Nation ads but is trailing.", "w": "Victoria is the first big test of One Nation's surge, which also has the party leading national Newspoll on primary votes. The result will shape federal strategy for both majors."}, {"h": "Bank bosses grilled by MPs over fees and housing", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-13/asx-markets-business-news-live-updates-nov-13/107337368"}, "b": "NAB's Andrew Irvine and CBA's Matt Comyn fronted the House Economics Committee, chaired by Ed Husic. Irvine was pressed on 2,500 job cuts announced last month and said Australia may be pouring too much capital into property. Comyn was quizzed on low income customers wrongly charged about A$270 million in excessive fees, and said the mix between investor and owner occupier lending has shifted since the negative gearing and capital gains changes.", "w": "Banks are the front line of the rate hikes and housing tax changes, so their bosses' read on lending is an early check on whether the budget's housing reforms are working."}], "quick": [{"x": "The government is reconsidering its working holiday visa overhaul, possibly lifting a planned cap on third year visas, though Burke says total backpacker numbers won't change.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-13/backpacker-working-holiday-visa-immigration-uk-rethink/107381884"}, {"x": "A senior national security adviser had warned months ago that government reliance on Microsoft was a risk, the ABC revealed after the outage.", "t": "ABC", "u": "https://www.abc.net.au/news/2026-11-13/microsoft-reliance-national-security-risk/107382100"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX slides 0.7% on Nvidia shock and rising bond yields", "s": {"t": "Sharecafe", "u": "https://sharecafe.com.au/2026/11/13/asx-200-dips-friday-secures-weekly-gain"}, "b": "The ASX 200 fell 64.6 points to 9,082.2 on Friday as investors digested Jensen Huang's exit from Nvidia. Gold miners, base metals, uranium and property stocks led the losses, while utilities and telcos rose as money moved to safer stocks. BHP, Rio Tinto and Glencore all closed lower.", "w": "Higher bond yields make shares look less attractive and lift borrowing costs, so the sell off shows how sensitive local markets are to US inflation and the AI trade."}, {"h": "Aussie dollar slips to its lowest since January", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-13/asx-markets-business-news-live-updates-nov-13/107337368"}, "b": "The Australian dollar dipped to about 68 US cents on Friday, its weakest level since late January, after breaking below 68.35 cents. That is down from about 70 cents at the start of the month. Hot US inflation figures have lifted expectations that US rates stay high, which tends to boost the US dollar.", "w": "A weaker dollar makes imports and overseas holidays dearer and can add to inflation, which the RBA is already fighting, but it helps exporters and miners earning US dollars."}, {"h": "ACCC starts the clock on the Steadfast takeover", "s": {"t": "Insurance Business", "u": "https://www.insurancebusinessmag.com/au/news/breaking-news/accc-review-leaves-no-room-in-steadfast-takeover-timetable-597257.aspx"}, "b": "The competition watchdog has begun reviewing a takeover of insurance broker Steadfast by Dragoneer, KKR and Amwins. Under Australia's new mandatory merger rules, the ACCC has 30 business days to clear it or move to a deeper phase 2 probe, with the first phase ending on 22 December, the same day the deal is due to complete. Amwins would take Steadfast's underwriting agency and some overseas wholesale broking businesses.", "w": "It is one of the first big tests of the new merger regime that started this year, and any delay would push back a major private equity deal."}], "quick": [{"x": "Brent crude settled at US$95.84 a barrel on Friday, notching a second straight weekly fall as traders weighed mixed signals on Iran.", "t": "Rigzone", "u": "https://www.rigzone.com/news/crude_fluctuates_as_iran_tensions_persist-13-nov-2026-185085-article"}, {"x": "Wall Street ended Friday lower with tech dragging, but still posted its first winning week since early October.", "t": "QNC News", "u": "https://qncnews.com/2026/11/13/wall-street-ends-friday-lower-but-seals-first-winning-week-since-early-october/"}]}], "explainer": {"term": "Concentration risk", "body": "Concentration risk is the danger of relying too heavily on one supplier, customer or asset, so a single failure hurts everything at once. Friday's Microsoft outage is a textbook case: when one company's cloud went down, police, spies and businesses all lost email and chat together. Investors face the same risk when a few giant stocks like Nvidia dominate an index, as one bad day drags the whole market. Banks watch it too, which is why NAB's boss worried about too much lending tied up in property. The usual cure is diversification, spreading your bets so no single shock can sink you."}, "ahead": [{"d": "Mon 16 Nov", "e": "Senate sits again until 19 November."}, {"d": "Wed 18 Nov", "e": "Nvidia reports quarterly results, Kress's first as interim CEO (morning AEDT); Australia's Wage Price Index is due; APEC leaders gather in Shenzhen through 19 November."}, {"d": "Thu 19 Nov", "e": "ABS October jobs figures, after unemployment hit 4.7% in September; Anthropic expected to price its IPO overnight."}, {"d": "Fri 20 Nov", "e": "Anthropic shares due to debut on Nasdaq (early morning AEDT); COP31 climate talks in Antalya scheduled to end."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
