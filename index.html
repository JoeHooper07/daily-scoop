<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>

<script type="application/json" id="brief">{"date": "2026-10-28", "edition": "Wednesday 28 October 2026", "lede": ["Israel's election has ended without a clear winner, with exit polls showing neither Netanyahu's bloc nor the opposition reaching a 61 seat majority.", "Australia gets its September quarter inflation numbers today, and a hot result would push the RBA towards another rate rise on 3 November.", "A flaw found with AI in the PHP web language has forced governments and websites around the world to patch or go offline."], "numbers": [{"label": "RBA cash rate", "value": "4.60%", "note": "Next decision Tuesday 3 November; markets priced about a 60% chance of a hike as at 26 Oct"}, {"label": "ASX 200", "value": "8,850.1", "note": "Closed up 0.46% on Tuesday 27 Oct"}, {"label": "Brent crude", "value": "about US$114", "note": "Down roughly US$2 on the day, as at 27 Oct"}, {"label": "Trimmed mean forecast", "value": "about 1.0%", "note": "Bank forecasts for the September quarter, against the RBA's 0.8%; released today"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Israel's election ends in deadlock, exit polls say", "s": {"t": "CNN", "u": "https://www.cnn.com/2026/10/27/world/live-news/israel-elections-live-results-latest-votes-intl"}, "b": "Exit polls on all three main Israeli channels showed neither Prime Minister Netanyahu's bloc nor the opposition led by Gadi Eisenkot reaching the 61 seats needed to govern. Channel 12 had Netanyahu's bloc on about 50 seats, down from 68, and the opposition on about 52. Likud was projected as the biggest party on 24 to 25 seats, with Eisenkot's party on 21 to 23. Arab parties were projected at 17 to 18 seats, and final counts could still shift these numbers.", "w": "Israel has never had a single party win a majority, so weeks of coalition bargaining now decide whether Netanyahu stays. The outcome shapes the war in Gaza and Israel's approach to Iran."}, {"h": "Oil eases as Iran talks continue, but Brent stays above US$110", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/10/27/oil-today-iran-us-crude-wti-brent-trump.html"}, "b": "Brent fell about US$2 to near US$114 on Tuesday, while US crude settled near US$100. Iran's Supreme Leader Mojtaba Khamenei met his security chief about conditions for ending the war with the US, and called the current state of neither war nor peace something that must end. Iran has tied any deal to ending the US blockade and lifting oil sanctions. UBS expects Brent to sit near US$110 through to the end of the year.", "w": "Oil at these levels feeds straight into Australian petrol and freight prices, and into the inflation numbers the RBA is watching."}, {"h": "Regional powers meet in Tehran to try to head off a return to war", "s": {"t": "The New Arab", "u": "https://www.newarab.com/news/saudi-led-talks-tehran-seek-avert-renewed-iran-us-war"}, "b": "Talks led by Saudi Arabia in Tehran aim to stop the US and Iran sliding back into open conflict. US Central Command says it has helped Gulf partners export more than 1.5 billion barrels of crude since the summer, with over 3,000 commercial ships passing through the Strait of Hormuz under US support.", "w": "About a fifth of the world's oil normally moves through Hormuz, so any deal or breakdown moves energy prices everywhere."}, {"h": "A local ceasefire starts in Oleshky while Kyiv is hit again", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/27/russia-halts-strikes-on-ukraines-kherson-as-oleshky-ceasefire-takes-effect"}, "b": "A limited truce began in the Russian held town of Oleshky in southern Ukraine to let an aid mission in, and it is due to last through Saturday. It was brokered by the US first lady with the involvement of Pope Leo XIV. Elsewhere Russia kept up its attacks, with Zelenskyy saying overnight strikes used 16 ballistic missiles and more than 280 drones, and Kyiv's Southern Bridge and subway were hit.", "w": "Small local pauses are the only ceasefires holding, which shows how far apart the two sides remain on a wider peace."}], "quick": [{"x": "Russian missiles killed at least three civilians across Kyiv and Kharkiv in the same overnight window.", "t": "NPR", "u": "https://www.npr.org/2026/10/27/g-s1-150037/russia-ukraine-war"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "AI found flaws in PHP force sites offline worldwide", "s": {"t": "Hackernoon", "u": "https://hackernoon.com/nsa-says-patch-or-go-offline-as-ai-found-php2shell-flaws-reach-70percent-of-the-web"}, "b": "The US National Security Agency told organisations to patch PHP straight away or take vulnerable systems offline. Two critical flaws, nicknamed PHP2Shell, could let attackers run code remotely on sites that host PHP themselves, and PHP runs about 70 per cent of websites. Security firm Calif found them in August using an OpenAI model, and details leaked a day before the planned release. Government services in Finland and the Netherlands were temporarily switched off.", "w": "It is a live example of AI speeding up bug hunting for defenders and attackers alike, and any Australian organisation running older PHP needs to act."}, {"h": "China drafts export controls on its top AI models", "s": {"t": "Taipei Times", "u": "https://www.taipeitimes.com/News/biz/archives/2026/10/17/2003866098"}, "b": "A draft Chinese catalogue covers 23 AI technologies. It would ban exports of AI built to generate malicious code against critical infrastructure, and require licences for model weights above certain performance thresholds, such as 2 trillion parameters. Access through apps or APIs would mostly fall outside the rules. It is only a proposal, with public comments open until 15 November.", "w": "It mirrors US export limits on chips, and shows the AI contest now runs on both sides through trade controls."}, {"h": "Australia's cyber agency warns of unprecedented AI powered hacking", "s": {"t": "Euronews", "u": "https://euronews.com/2026/10/27/australia-warns-of-unprecedented-ai-powered-cyberattacks-heres-whats-driving-them"}, "b": "Australia's cyber security agency said on Tuesday that AI gives foreign governments an unprecedented ability to break into networks and critical infrastructure. The warning lands in the same week as the PHP scare.", "w": "Expect more pressure on Australian businesses and utilities to meet tougher security standards."}], "quick": [{"x": "A Cisco survey found only 38% of Singapore organisations are confident they could spot a compromised AI agent.", "t": "Security Brief Asia", "u": "https://securitybrief.asia/story/cisco-warns-singapore-firms-struggle-to-spot-compromised-ai"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Albanese promises a swift response on MP safety, with panic buttons on the table", "s": {"t": "Yahoo News", "u": "https://nz.news.yahoo.com/australia-considers-panic-buttons-mps-090847384.html"}, "b": "After the alleged attack on independent MP Helen Haines, the Prime Minister told Labor MPs the government will speed up an independent review of security. Duress alarms for politicians are among the options. Opposition Leader Angus Taylor told Coalition MPs that talks with the government on safety are continuing, without naming specific proposals. A fuller package is expected in coming days.", "w": "Both sides are working together on safety, but it follows complaints that MPs slipped back into personal attacks after calls to lower the temperature."}, {"h": "Chalmers' discretionary trust tax goes to a Senate inquiry", "s": {"t": "Accountants Daily", "u": "https://accountantsdaily.com.au/business/23047-businesses-face-death-by-a-thousand-cuts-amid-tax-reforms"}, "b": "Treasurer Jim Chalmers introduced bills to set a minimum tax on discretionary trusts, and the Senate sent them to an inquiry. Submissions close on 29 October, with hearings in November. The Greens say the government softened its position before introducing the bills, and that the modelling behind a roughly $4.5 billion estimate has not been released.", "w": "Trusts are a common way for families and small businesses to split income, so the bills matter to a lot of accountants and clients."}, {"h": "Victorian Newspoll has the Coalition ahead and One Nation on 20%", "s": {"t": "The Poll Bludger", "u": "https://www.pollbludger.net/2026/10/26/newspoll-labor-24-coalition-33-one-nation-20-in-victoria/"}, "b": "A Victorian state Newspoll put Labor on 24% of the primary vote, down four, the Coalition on 33%, up two, One Nation on 20% and the Greens on 14%. Federally, early October polls had Labor and One Nation roughly level at 28 to 29% each, with the Coalition on 20 to 23%.", "w": "The Victorian election is due next month, and One Nation's strength is reshaping the contest on both sides."}], "quick": []}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Inflation figures land today, with banks tipping a hot result", "s": {"t": "CommBank", "u": "https://commbank.com.au/articles/newsroom/2026/10/inflation-cpi-rba-interest-rates-november.html"}, "b": "The ABS releases September quarter CPI today. The big four banks broadly expect trimmed mean inflation, the RBA's preferred gauge that cuts out extreme price moves, to rise about 1.0% in the quarter, above the RBA's own 0.8% forecast. CommBank expects headline inflation of 3.9% over the year, while others see 4.2%. ANZ and Westpac tip a November hike, while CBA and NAB expect a hold.", "w": "A print of 1.0% or more would push a rate rise on 3 November close to fully priced, which means higher mortgage repayments for many."}, {"h": "ASX 200 closes at 8,850 ahead of the inflation data", "s": {"t": "IBTimes Australia", "u": "https://www.ibtimes.com.au/australian-shares-rise-ahead-inflation-data-1877441"}, "b": "The ASX 200 rose 40.2 points, or 0.46%, to 8,850.1 on Tuesday, helped by miners and optimism about AI. Brent crude fell back towards US$114 as Middle East talks eased supply fears. The cash rate is 4.60% after three rises this year.", "w": "Higher rates hurt banks and housing exposed stocks, while a strong oil price helps energy producers."}, {"h": "Huayou's takeover of Atlantic Lithium clears foreign investment review", "s": {"t": "Proactive Investors", "u": "https://www.proactiveinvestors.com/companies/news/1100735/atantic-lithium-moves-closer-to-takeover-completion-1100735.html"}, "b": "Atlantic Lithium said Australian foreign investment approval has been secured for Huayou's proposed US$210 million takeover. A first court hearing is set for 5 November. The deal still needs other regulatory approvals, shareholder backing and Western Australian Supreme Court approval.", "w": "It is a test of how Canberra treats Chinese capital in critical minerals."}], "quick": [{"x": "Crimson Consulting lifted its stake in Kip McGrath Education Centres to 88.26% through its off market takeover.", "t": "Kalkine", "u": "https://kalkine.com.au/news/announcements/crimson-consulting-australia-lifts-stake-in-kip-mcgrath-education-centres-to-8826-via-off-market-takeover"}, {"x": "Forrestania Resources already holds 62.04% of Zenith Minerals, with its unconditional offer closing on 12 November.", "t": "Discovery Alert", "u": "https://discoveryalert.com/asx-stock-news/mining/frs-forrestania-resources-zenith-takeover-offer-october-2026/"}]}], "explainer": {"term": "Proportional representation", "body": "Israel splits its 120 Knesset seats according to each party's share of the national vote, instead of electing one MP per local area. That lets many small parties win seats, so no party gets a majority alone. A government needs 61 seats, which means a coalition of several parties that agree on a platform. Australia's Senate works in a similar way, while our House of Representatives uses single member seats, which usually produces a clear winner. The trade off is fairness to smaller voices against quick, stable government."}, "ahead": [{"d": "Wed 28 Oct", "e": "ABS September quarter CPI released"}, {"d": "Thu 29 Oct", "e": "Submissions close on the discretionary trust tax bills"}, {"d": "Sat 31 Oct", "e": "Oleshky ceasefire in southern Ukraine due to run to this date"}, {"d": "Tue 3 Nov", "e": "RBA interest rate decision (Melbourne Cup day)"}, {"d": "Wed 4 Nov", "e": "US midterm elections held (Tuesday 3 Nov in the US)"}, {"d": "Thu 5 Nov", "e": "First court hearing for Huayou's Atlantic Lithium takeover"}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
