<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-23", "edition": "Monday 23 November 2026", "lede": ["COP31 in Antalya collapsed on Sunday without its main deal, after the EU and others refused a final text that did not even mention fossil fuels.", "A new Newspoll has Labor and One Nation tied on 27% and Angus Taylor ahead of Anthony Albanese as preferred prime minister for the first time, as parliament starts its last week of the year.", "The ASX is tipped to fall for a seventh straight day after its worst week since 2022, with the Aussie dollar near its lowest level this year ahead of Wednesday's inflation figures."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "As at 23 Nov; lifted on 3 Nov, the highest level since 2008"}, {"label": "ASX 200", "value": "8,592.6", "note": "Close on Fri 20 Nov, down 1.58% on the day and 5.39% for the week"}, {"label": "AUD/USD", "value": "66.66 US cents", "note": "RBA 4pm rate on Fri 20 Nov, around the year's low"}, {"label": "Newspoll primary vote", "value": "ALP 27, ON 27, LNP 22", "note": "Released 22 Nov; Coalition's highest this year"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "COP31 ends with no main deal after a fight over fossil fuels", "s": {"t": "CBS News", "u": "https://www.cbsnews.com/news/un-cop31-climate-conference-ends-no-agreement-fossil-fuel-debate-standstill/"}, "b": "The Antalya climate summit wrapped up on Sunday about 44 hours past its deadline without adopting its main cover decision, dubbed the Antalya Pact. The draft restated the 1.5 degree goal but left out any reference to moving away from coal, oil and gas. The EU, Panama, the Marshall Islands and others refused to sign a text that did not mention fossil fuels, while Saudi Arabia reportedly led resistance to naming them. COP31 president Murat Kurum said the draft fell over for lack of consensus.", "w": "Chris Bowen led the negotiations under the deal that gave Turkey the hosting rights, so the failure lands partly on Australia's watch. The open questions on fossil fuels, adaptation money and loss and damage now roll over to next year's talks."}, {"h": "Trump talks up a permanent Iran deal but sets a New Year deadline", "s": {"t": "Iran International", "u": "https://www.iranintl.com/en/202611226299"}, "b": "Donald Trump told Fox News he wants a permanent agreement that stops Iran getting nuclear weapons, about ten days after saying he did not need a deal at all. He also said he is inclined to resume strikes after the New Year if no deal is reached, and warned that ships trying to run the US blockade of Iranian ports would be sunk. Iran's Revolutionary Guards meanwhile claimed hits on two US Patriot radars in Bahrain, which Bahrain denies.", "w": "Mixed signals from Washington keep oil and shipping markets on edge, and Australia imports most of its fuel through Asian refineries that rely on Gulf crude."}, {"h": "Russian drone strike leaves people trapped near Kyiv", "s": {"t": "Reuters via US News", "u": "https://www.usnews.com/news/world/articles/2026-11-22/at-least-14-people-missing-after-russian-drone-hit-building-in-kyiv-region-zelenskiy-says"}, "b": "A Russian drone hit a residential building in Dymer, north of Kyiv, on Sunday morning. Volodymyr Zelensky said at least 14 people were initially missing under the rubble, and later reports put the toll at two dead with about ten still trapped. Rescuers had to pause their search when another air raid alert sounded.", "w": "The strike comes as Kyiv says it still lacks written Western security guarantees, a reminder that the war grinds on despite the summit diplomacy of recent weeks."}], "quick": [{"x": "Bahrain says an Iranian attack on Saturday set fire to a civilian industrial site near Sitra Island, home to Bapco's refinery operations.", "t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/22/whats-behind-irans-escalation-of-attacks-in-the-gulf"}, {"x": "Turkey used COP31 to sign side deals and plans it values at more than US$26 billion, including a preliminary US$15 billion renewables deal with China.", "t": "US News", "u": "https://www.usnews.com/news/world/articles/2026-11-20/cop31-delivers-deals-for-host-turkey-as-climate-diplomacy-stalls"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Google's Gemini 4 Neon goes after rivals on price", "s": {"t": "Google", "u": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/"}, "b": "Google has released Gemini 4 Neon, a middle tier model that sits between its top Carbon model and the faster Hydrogen. It is priced at about US$3 per million input tokens and US$15 per million output tokens, with a one million token context window, which is how much text it can handle at once. Google says it ranks third on the Artificial Analysis intelligence index, and a separate cyber version is limited to vetted security defenders.", "w": "Cheaper top tier models are a price war that benefits local businesses building on AI, but it squeezes the profit story that AI stocks have been priced on."}, {"h": "US spy chief says more tech outages are coming", "s": {"t": "TimesLIVE (Reuters)", "u": "https://timeslive.co.za/news/world/2026-11-22-us-intelligence-chief-predicts-more-tech-outages-as-systems-undergo-upgrades"}, "b": "Director of National Intelligence Jay Clayton warned on Sunday that more outages are likely as agencies and companies replace ageing systems. He linked this month's failures, including a nationwide halt to US air travel and a Microsoft email outage, to rushed upgrades and patching rather than coordinated attacks. He declined to discuss separate reports of cyberattacks on the FBI and the Department of Agriculture.", "w": "Australian agencies including the AFP and ASIO were hit by the Microsoft outage, so the reliability of a few big cloud providers is now a national security question here too."}, {"h": "South Korea's education minister under fire over AI exam cheating", "s": {"t": "Korea Herald", "u": "https://www.koreaherald.com/article/10939647"}, "b": "Education Minister Choi Kyo-jin told a parliamentary committee that authorities cannot reliably catch every student who cheats with AI, sparking public outrage. A former Seoul councillor has filed a police complaint accusing him of neglecting his duties. The row began when the top scorer in a tax accountant exam admitted using AI equipped devices to cheat.", "w": "Universities including ANU are grappling with the same problem, and Korea shows how fast AI cheating can become a political scandal when high stakes exams are involved."}], "quick": [{"x": "Reuters reports the SEC probe into Nvidia is looking at its accounting, possibly a 2025 change to how it reports revenue by region; the stock fell 23% last week.", "t": "Motley Fool", "u": "https://www.fool.com/investing/2026/11/21/after-its-worst-week-in-18-years-nvidia-now-faces-an-sec-investigation-what-it-means-for-investors/"}, {"x": "Chuck Schumer wants an intelligence red team to test the claim that the outages are routine, reporting to Congress by 1 December.", "t": "Al-Monitor", "u": "https://www.al-monitor.com/originals/2026/11/criticism-mounts-trump-administration-says-tech-outages-not-coordinated"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Newspoll: Labor and One Nation level, Taylor edges ahead", "s": {"t": "Poll Bludger", "u": "https://www.pollbludger.net/2026/11/22/newspoll-labor-27-one-nation-27-coalition-22-open-thread/"}, "b": "The latest Newspoll has Labor steady on 27% of the primary vote, One Nation down a point to 27% and the Coalition up a point to 22%, its best result this year. Angus Taylor leads Anthony Albanese as preferred prime minister for the first time, 42 to 41. One report of the poll also puts Albanese's net approval at a new low of minus 31.", "w": "A three way split this close makes preferences decisive, and a weak federal brand adds pressure on Labor heading into Saturday's Victorian election."}, {"h": "PM promises to keep PBS scripts at $25 until 2030", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-23/federal-politics-live-blog-parliament-nov-23/107415266"}, "b": "Anthony Albanese has confirmed the government will freeze the general patient price of PBS medicines at $25 until 2030. The cap fell from $31.60 to $25 on 1 January this year under an election promise. Health Minister Mark Butler is also pushing a change to the private health insurance rebate.", "w": "Without a freeze the price would normally rise with inflation each year, so this is a cost of living pitch as inflation runs hot and polls slide."}, {"h": "Victorian Labor braces for defeat as Albanese stays away", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-23/election-victorian-labor-election-defeat-albanese-stays-away/107414442"}, "b": "With five days until Saturday's state election, Victorian Labor is bracing for a result that could cost it up to 35 seats. The Prime Minister has kept his distance from the campaign of Premier Ben Carroll, who replaced Jacinta Allan only four months ago. Polls have Jess Wilson's Coalition well ahead, with One Nation and the Greens chasing their own seats.", "w": "A big loss in Labor's strongest state would be read as a verdict on the party nationally, not just in Spring Street."}, {"h": "Online safety overhaul hinges on the Greens this week", "s": {"t": "Capital Brief", "u": "https://www.capitalbrief.com/article/four-bills-to-watch-in-parliaments-final-sitting-week-8cfa0b01-277c-41ea-a7c1-1f841e55f092/"}, "b": "Communications Minister Anika Wells wants her digital duty of care bill, which would legally require platforms to take reasonable steps to prevent harm, passed in the final sitting week. The Coalition and One Nation oppose it, so Labor needs the Greens in the Senate, where debate resumes today. The Greens want people to be able to sue tech companies over harm, and Wells has signalled she is open to that.", "w": "If it passes, Australia would again be among the first countries to put a broad legal duty on big tech, after its under 16 social media ban."}], "quick": [{"x": "Labor's gas reservation bill is also still short of Senate votes, with Labor needing either the Coalition or the Greens before parliament rises on Thursday.", "t": "Yahoo News", "u": "https://au.news.yahoo.com/end-deadline-looms-gas-fight-163000579.html"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX set for a seventh straight fall after a brutal week", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-23/asx-markets-business-live-news-november-23/107414602"}, "b": "Wall Street fell sharply on Friday, with the S&P 500 down almost 4%, and futures point to the ASX 200 opening about 49 points or 0.55% lower. The index closed Friday at 8,592.6, down 5.39% for the week, its worst week since June 2022. Miners led the losses as gold slid to its lowest level in about 14 months.", "w": "Most Australians own shares through super, so a long losing streak shows up in balances, and falling markets can make consumers and businesses more cautious."}, {"h": "Sahm warns Australia may be heading for recession", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-23/sahm-rule-recession-indicator-australia-november-2026/107408750"}, "b": "Former US Federal Reserve economist Claudia Sahm, whose rule uses rising unemployment as an early recession signal, says Australia should watch its jobless rate closely. Her comments come after the RBA lifted rates to 4.85% this month, the highest since 2008, to fight inflation.", "w": "It sharpens the RBA's dilemma: inflation is still too high, but more rate rises risk tipping a slowing economy into recession."}, {"h": "Aussie dollar sinks to around its lowest level this year", "s": {"t": "RBA", "u": "https://www.rba.gov.au/exchange-rates-overview.html"}, "b": "The Reserve Bank's 4pm rate on Friday had the Australian dollar at 66.66 US cents, with other data providers showing it closer to 66.2 cents and at a fresh low for 2026. Trading Economics puts the fall over the past month at about 5.7%, as global investors dumped riskier assets.", "w": "A weaker dollar makes imports such as fuel and electronics dearer, which can push up inflation, but it helps exporters and tourism."}, {"h": "Leeuwin Metals agrees to buy WA Gold in a shares only deal", "s": {"t": "Discovery Alert", "u": "https://discoveryalert.com/asx-stock-news/mining/wau-wa-gold-ltd-leeuwin-metals-acquisition-november-2026/"}, "b": "WA Gold's board backs a takeover by Leeuwin Metals that pays one Leeuwin share for every 11.72 WA Gold shares, a 49% premium with no cash. The deal runs as a scheme of arrangement, so it needs 75% of votes cast plus court approval, with completion expected around mid March 2027.", "w": "Small gold explorers are merging to get scale while the gold price slides, a sign the sector's boom time dealmaking is shifting to consolidation."}], "quick": [{"x": "Gold fell to its lowest level since September 2025 on Friday, with Genesis Minerals and Evolution Mining among the biggest losers.", "t": "Market Index", "u": "https://www.marketindex.com.au/news/asx-200-live-today-friday-20th-novemeber"}, {"x": "October's monthly CPI lands at 11:30am Wednesday, with Westpac tipping annual inflation to rise to 4.8%.", "t": "Westpac IQ", "u": "https://www.westpaciq.com.au/economics/2026/11/cpi-monthly-preview-14-november-2026/"}]}], "explainer": {"term": "Consensus at UN climate talks", "body": "COP decisions are not made by majority vote but by consensus, which means any one of nearly 200 countries can block a text by formally objecting. That gives small groups, from oil producers to low lying island states, real power to stop a deal they dislike. Presidents try to write wording vague enough for everyone to accept, which is why outcomes are often watered down. At Antalya the gap could not be bridged, because one side would not accept naming fossil fuels and the other would not accept leaving them out. When there is no consensus, the unresolved issues simply carry over to the next meeting."}, "ahead": [{"d": "Mon 23 Nov", "e": "Federal parliament's final sitting week begins, running to Thursday, with the gas reservation and digital duty of care bills unresolved."}, {"d": "Wed 25 Nov", "e": "ABS releases the October monthly CPI at 11:30am."}, {"d": "Thu 26 Nov", "e": "ABS private capital expenditure figures for the September quarter."}, {"d": "Fri 27 Nov", "e": "US markets closed for Thanksgiving overnight, so expect a quieter lead for the ASX."}, {"d": "Sat 28 Nov", "e": "Victorian state election day."}, {"d": "Tue 1 Dec", "e": "Estonia closes all its border crossings with Russia."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
