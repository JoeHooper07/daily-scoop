<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-10-31", "edition": "Saturday 31 October 2026", "lede": ["Alphabet's slide has now wiped roughly half a trillion US dollars off its value, and Amazon's mixed results kept Wall Street nervous about the cost of AI.", "Israel's coalition fight is heating up before official results land, while US diplomacy with Iran is sending mixed signals and oil stays above US$110.", "The RBA meets Monday and Tuesday with a rate rise priced as close to certain, and One Nation is now ahead of both Labor and the Coalition in the latest YouGov poll."], "numbers": [{"label": "ASX 200", "value": "8,908.1", "note": "Close on 30 Oct 2026, up 0.18% on the day and 1.78% for the week"}, {"label": "Brent crude", "value": "US$113.72", "note": "Settled 27 Oct 2026 after falling 1.8%; still above US$110"}, {"label": "AWS growth", "value": "39%", "note": "Amazon Web Services revenue growth, September quarter, reported 29 Oct 2026"}, {"label": "One Nation primary vote", "value": "27%", "note": "YouGov poll, 13 to 20 Oct 2026; Labor 24%, Coalition 23%"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Israel's rivals trade blame while they wait for official results", "s": {"t": "i24NEWS", "u": "https://i24news.tv/en/news/israel/politics/artc-liberman-accuses-eisenkot-of-seeking-government-with-netanyahu"}, "b": "Avigdor Liberman has accused Gadi Eisenkot of quietly seeking a government with Netanyahu, even though Eisenkot has publicly ruled that out. Neither bloc has the 61 seats needed in the 120 seat Knesset, and the Arab led parties, on roughly 18 to 19 seats, hold the balance. After the final count, President Isaac Herzog will consult party leaders and pick whoever looks best placed to form a government. Official results are due around 4 November.", "w": "Israel could be stuck in weeks of bargaining, with Netanyahu staying on as caretaker prime minister. That keeps decisions on the Gaza war and Iran frozen, which matters for oil prices and for Australia's fuel costs."}, {"h": "Trump denies sending Vance's Iran letter as Qatar's mediation hits a snag", "s": {"t": "ROIC News", "u": "https://www.roic.ai/news/trump-denies-directing-vances-letter-to-iran-as-diplomatic-signals-diverge-10-28-2026"}, "b": "Reports say Vice President JD Vance wrote to senior Iranian official Mohsen Rezaei to try to restart stalled peace talks. Trump then denied directing the letter, which contradicts a Wall Street Journal report. Qatar has been mediating on a draft proposal, but accounts of its progress conflict and Iran has signalled only a willingness to talk. Brent crude has stayed above US$110 a barrel.", "w": "Mixed messages from Washington make a quick deal less likely. Australia imports most of its fuel, so a prolonged stand off keeps petrol prices and inflation pressure high, which feeds straight into RBA decisions."}, {"h": "Mayon volcano erupts in the Philippines and Albay orders early evacuations", "s": {"t": "Daily Tribune", "u": "https://tribune.net.ph/2026/10/30/moon-punch-31-october-2026"}, "b": "The Daily Tribune's 31 October front page reports that Mayon has erupted and that Albay province has ordered preemptive evacuations, with Naga City also named in the coverage. Mayon is one of the Philippines' most active volcanoes. Early evacuations are standard practice when authorities fear eruptions could escalate, and the country is also in its busy All Saints' weekend travel period.", "w": "The Philippines is a popular destination and a large source of Australian migrants, so any travel disruption or disaster response here has a real connection to Australians."}], "quick": [{"x": "US candidates from all major parties are holding rallies this final weekend before the midterm elections, with polls closing in Australian time on Wednesday 4 November.", "t": "WinCalendar", "u": "https://www.wincalendar.com/Calendar/Date/October-31-2026"}, {"x": "The US Embassy in London has warned of planned demonstrations in the city on 31 October, including a Palestine Action linked protest near the embassy.", "t": "US Embassy UK", "u": "https://uk.usembassy.gov/demonstration-alert-planned-demonstrations-in-london-october-31-2026/"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Alphabet's record slide wipes about half a trillion US dollars off its value", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-30/asx-markets-business-live-news-oct-30/107326558"}, "b": "ABC's markets coverage says Alphabet had its worst fall on record, losing roughly half a trillion US dollars in value as worries about its AI spending grew. The Nasdaq fell 1.4% in sympathy. The sell off came a day after the company's earnings, when shares dropped more than 13%.", "w": "Investors are asking when huge AI investment turns into profit. Microsoft's strong cloud numbers eased that fear a little, but Alphabet shows how fast sentiment can turn, and ASX tech names tend to follow the US lead."}, {"h": "Amazon's AWS grows 39% but the company narrowly misses on profit", "s": {"t": "The Motley Fool", "u": "https://www.fool.com/coverage/stock-market-today/2026/10/30/stock-market-today-oct-30-amazon-misses-revenue-and-earnings-expectations/"}, "b": "Amazon reported revenue of about US$201.9 billion against US$202.1 billion expected, and earnings of US$1.89 a share against US$1.96 expected. Amazon Web Services grew 39% to around US$46 billion, its fastest pace in nearly five years. Capital spending for 2026 stays near US$220 billion, and free cash flow over the past twelve months was an outflow of about US$42.4 billion. The shares fell after the report.", "w": "Strong cloud demand is real, but Amazon is spending cash faster than it earns it. That is the same worry hitting Alphabet, and AWS is a major host of Australian business and government data."}, {"h": "Crypto drops as Binance investigates a major security breach", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-30/asx-markets-business-live-news-oct-30/107326558"}, "b": "A range of crypto assets lost value on 30 October after reports that Binance, one of the world's biggest exchanges, is investigating a major security breach. Details on how much was taken, if anything, were not available in the coverage I found.", "w": "Exchange hacks hit trust quickly and can drag down prices across the whole market. Binance serves many Australian users, so local regulators and customers will want clear answers."}], "quick": [{"x": "Apple reports its quarterly results on Monday 2 November US time, which will be John Ternus's first earnings call as CEO after Tim Cook moved to executive chairman.", "t": "If You Spent", "u": "https://news.ifyouspent.com/en/news/apple-earnings-what-to-watch-november-2026"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Albanese's staffing offer to One Nation MP David Farley backfires", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-29/one-nation-mp-turns-down-extra-staffer-from-pm/107325240"}, "b": "The Prime Minister wrote to Farrer MP David Farley offering an extra staffer on a package of around $200,000. Farley turned it down, and Pauline Hanson accused Albanese of trying to divide One Nation, calling the current staffing system grubby and asking for an independent body to set staff levels. Farley has dismissed talk of moving to Labor, saying his loyalty is to Farrer.", "w": "The PM sets staffing for crossbenchers, which gives the government leverage. With One Nation now a major force in the polls, how Labor treats it is becoming a real political issue."}, {"h": "One Nation leads the latest YouGov poll, with Labor and the Coalition close behind", "s": {"t": "The Poll Bludger", "u": "https://www.pollbludger.net/2026/10/21/yougov-labor-24-one-nation-27-coalition-23-open-thread/"}, "b": "The YouGov poll, taken 13 to 20 October, had One Nation on 27% of the primary vote, Labor on 24% and the Coalition on 23%. Albanese's approval was 32%, with 62% disapproving, giving a net rating of minus 30, his worst in the series. He still leads Hanson 50 to 42 as preferred PM and leads Coalition leader Angus Taylor 41 to 39.", "w": "A three way split this tight makes preference flows decisive. It also shows how much the major parties have lost, with Labor in government and the Coalition struggling since Angus Taylor replaced Sussan Ley in February."}, {"h": "Farrer was One Nation's first win in the House of Representatives", "s": {"t": "The Conversation", "u": "https://theconversation.com/one-nation-wins-farrer-byelection-as-liberal-vote-crashes-282051"}, "b": "David Farley won the Farrer by election on 9 May, the first time One Nation has won a seat in the lower house. The seat had been held by the Coalition since 1949. Analysts tied the result to a collapse in the Liberal vote and months of Coalition turmoil after the 2025 election loss, and a preference deal between the Coalition and One Nation also helped.", "w": "It explains why a single MP is getting so much attention from Labor and from Hanson, and why polls now treat One Nation as a genuine contender rather than a protest vote."}], "quick": [{"x": "Capital Brief reported at the time that the Coalition vote collapsed in Farrer as One Nation took the seat.", "t": "Capital Brief", "u": "https://www.capitalbrief.com/briefing/one-nation-wins-farrer-by-election-coalition-vote-collapses-321b6ec4-9677-4d31-b09e-60c163cd5b4e/"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX 200 edges up 0.18% to 8,908.1 as Reece jumps 9%", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-30/asx-markets-business-live-news-oct-30/107326558"}, "b": "The ASX 200 closed Friday up 16.3 points to 8,908.1, a gain of 1.78% for the week. Falling stocks outnumbered rising ones, 616 to 438. Reece was the top performer, up 9.42% to $17.25. Catalyst Metals plunged 22% intraday after a production miss and a cut to its FY27 guidance.", "w": "The index held up despite the Alphabet rout in the US, which shows how focused local investors are on the RBA meeting next week."}, {"h": "Markets price in an RBA rate rise on Tuesday, with the board meeting Monday and Tuesday", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-28/asx-markets-business-live-news/107316614"}, "b": "After hotter inflation data, ABC's markets coverage on 28 October said traders put the chance of a November rate rise near 90%. The RBA's Monetary Policy Board meets Monday and Tuesday, with the decision due on Tuesday 3 November, Melbourne Cup Day. CBA and ANZ economists have said they expect a quarter point rise.", "w": "A rise would add to mortgage repayments for borrowers on variable loans, at a time when fuel prices are already pushing up living costs."}, {"h": "Ingenia: Warburg Pincus lifts its bid to $5.50 and AVID has until Sunday to respond", "s": {"t": "The Motley Fool Australia", "u": "https://www.fool.com.au/2026/10/28/ingenia-communities-receives-improved-5-50-takeover-proposal/"}, "b": "Warburg Pincus proposed $5.45 per stapled security plus a possible $0.05 distribution for Ingenia Communities, backed by co investors Discovery Parks and LDR Capital. AVID Property Group, which had earlier offered about $2.2 billion, has until 1 November to match or beat it. Both bids depend on Ingenia ending its roughly $992.5 million deal to buy Peet, and the board has not recommended either offer.", "w": "This is a live bidding war in the retirement and land lease housing sector, and it shows how much private capital wants Australian property assets."}], "quick": [{"x": "Woodside shed 3.2% and Ampol fell 3.8% on 28 October as oil sensitive stocks swung with the Iran headlines.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-28/asx-markets-business-live-news/107316614"}]}], "explainer": {"term": "Free cash flow", "body": "Free cash flow is the cash a company has left after paying for its day to day operations and its big investments in things like data centres and equipment. It is different from profit, which includes accounting items that do not move cash straight away. Amazon had a negative free cash flow of about US$42.4 billion over the last twelve months because it is spending so much on AI infrastructure. If the spending does not eventually bring in more money, a company has to borrow or sell shares to keep going. That is why investors are watching this number so closely for Amazon, Alphabet and Microsoft."}, "ahead": [{"d": "Sun 1 Nov", "e": "AVID's deadline to match or beat Warburg Pincus's offer for Ingenia"}, {"d": "Mon 2 Nov", "e": "RBA board meeting begins; Apple reports earnings in US time"}, {"d": "Tue 3 Nov", "e": "RBA rate decision on Melbourne Cup Day, with a rise widely expected"}, {"d": "Wed 4 Nov", "e": "US midterm results arrive in Australian time; Israel's official election results are due"}, {"d": "Fri 6 Nov", "e": "Apple's touchscreen MacBook Pro goes on sale"}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
