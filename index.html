<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">
{"date": "2026-11-02", "edition": "Monday 2 November 2026", "lede": ["Israel's president starts coalition talks on Wednesday after an election that gave neither Netanyahu nor Eisenkot a majority.", "The RBA decides on rates tomorrow, with a rise to 4.85% widely expected, as the latest Newspoll puts One Nation ahead of Labor.", "Intel's record 29% share drop and the US$6.3 billion Binance hack rattled tech and crypto markets late last week."], "numbers": [{"label": "RBA cash rate", "value": "4.60%", "note": "Current level after the September rise; decision due 3 Nov, as at 2 Nov 2026"}, {"label": "ASX 200", "value": "8,908.1", "note": "Last close, Friday 30 Oct 2026, up 0.18%"}, {"label": "AUD/USD", "value": "70.34 US cents", "note": "As at 30 Oct 2026"}, {"label": "Brent crude", "value": "US$114.10", "note": "Reported 29 Oct 2026, near a four year high of US$117"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Israel's president opens coalition talks this week with no clear winner", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/10/30/israel-election-netanyahu-eisenkot-coalition-talks-.html"}, "b": "Final results leave Netanyahu's bloc on 53 seats, Gadi Eisenkot's bloc on 48 and the two Arab parties on 19, so nobody has the 61 needed for a majority. President Isaac Herzog is due to start formal consultations with the parties on Wednesday 4 November. Netanyahu has attacked the Arab parties and claimed, without evidence, that foreign backing helped them steal the election. The Arab parties are expected to recommend Eisenkot, who has talked about leading a minority government.", "w": "Whoever gets the mandate has 28 days, with a possible 14 day extension, so Israel faces weeks of limbo, and a unity government or a fresh election are both still possible. That matters for Gaza and Iran policy, and for the oil price."}, {"h": "Oil stays around US$114 as Vance tries to restart Iran talks", "s": {"t": "Business Standard", "u": "https://www.business-standard.com/amp/markets/commodities/oil-prices-fall-as-hopes-of-us-iran-peace-talks-ease-supply-fears-126102900085_1.html"}, "b": "Brent crude slipped about 1% to US$114.10 a barrel and US crude fell to US$101.45 after reports that Vice President JD Vance had written to Iranian official Mohsen Rezaei to revive peace negotiations. Brent is still close to a four year high of US$117. Analysts flagged Houthi attacks on shipping and fears that the US could strike Iran after its midterm elections on 3 November. Iran's foreign minister said Tehran was still giving diplomacy a chance.", "w": "Oil this high feeds straight into Australian petrol prices and inflation, which is a big reason the RBA is under pressure to lift rates again."}, {"h": "Russian drone strike kills at least 14 at Dnipro train station", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/10/29/russia-says-more-than-600-drones-launched-towards-moscow-overnight"}, "b": "A Russian drone hit passengers waiting on a platform at Dnipro's main railway station on Thursday morning. Al Jazeera put the toll at at least 14, while CNN later reported 15, and the figure may still change. Ukrainian reporting says five railway workers were among the dead. The strike came the same day Ukraine launched a large drone attack on the Moscow region, and Russia said it had downed more than 600 drones.", "w": "Both sides are hitting transport and civilian infrastructure harder, which makes a negotiated end to the war look further away."}], "quick": [{"x": "Zelensky says Russia fired almost 2,000 attack drones, more than 1,500 guided bombs and 44 missiles at Ukraine in a single week.", "t": "Ukrinform", "u": "https://ukrinform.net/block-lastnews"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Intel plunges about 29% in its worst day ever and drags chip stocks down", "s": {"t": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/intel-warning-sparks-chip-rout-as-pc-weakness-clouds-turnaround-4987123"}, "b": "Intel fell around 29% on Friday after forecasting quarterly revenue of US$15 billion to US$16 billion, more than US$1 billion below what analysts expected. It also said it does not expect positive cash flow this year, and flagged weak PC demand and supply constraints. The selloff spread across chip and hardware stocks, and the Nasdaq dropped about 3%.", "w": "Intel was meant to be the US comeback story in chipmaking, and its largest shareholder is the US government. The slump adds to worries about how much the AI boom costs and who actually profits."}, {"h": "Binance hack grows to about US$6.3 billion, the biggest crypto theft on record", "s": {"t": "TechCrunch", "u": "https://techcrunch.com/2026/10/29/binance-pauses-withdrawals-as-hackers-suspected-of-stealing-billions-in-crypto/"}, "b": "Binance says a security incident hit roughly US$6.3 billion of client assets, with about US$3 billion frozen on chain. It paused deposits and withdrawals, and co-CEO Richard Teng said an early lead is a compromised engineer's laptop. Blockchain analytics firm TRM Labs says it assesses with high confidence that North Korea's TraderTraitor group did it, but Binance has not confirmed who is responsible. Binance says it will cover the losses.", "w": "If the attribution holds, it is a state funded theft on a huge scale, and a test of how safe it is to leave money on a crypto exchange."}, {"h": "Google, Microsoft, OpenAI and Anthropic back one AI training opt out for websites", "s": {"t": "SiliconANGLE", "u": "https://siliconangle.com/2026/10/30/google-anthropic-and-others-to-support-new-ai-crawling-opt-out-standard"}, "b": "The four companies said they will support a single robots.txt signal that lets publishers say their content must not be used to train generative AI. Microsoft and OpenAI plan to add support in the coming months, while Google will follow next year. Meta has voiced support but has not committed.", "w": "It could ease the fight between publishers and AI firms over scraping, though a voluntary signal only works if companies honour it."}], "quick": [{"x": "The US government, Intel's biggest shareholder, faces a hit of nearly US$12 billion from the share price fall.", "t": "Star Advertiser", "u": "https://www.staradvertiser.com/2026/10/30/breaking-news/tech-stocks-tumble-as-amazon-intel-fuel-ai-spending-fears/"}, {"x": "Binance says it will cover hack losses and has a roughly US$1 billion emergency fund known as SAFU.", "t": "CNBC", "u": "https://www.cnbc.com/make-it/2026/10/30/binance-crypto-hack-customer-funds.html"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Newspoll puts One Nation back in front with Labor down to 27%", "s": {"t": "The Poll Bludger (citing The Australian)", "u": "https://www.pollbludger.net/2026/11/01/newspoll-labor-27-one-nation-28-coalition-21-open-thread/"}, "b": "The latest three weekly Newspoll has One Nation steady on 28% of the primary vote, Labor down two points to 27%, the Coalition up one to 21% and the Greens down one to 13%. Treasurer Jim Chalmers scored 24% satisfied and 40% dissatisfied. Poll Bludger's seat estimates put Labor on 64 to 77 seats, short of the 76 needed for a majority in several scenarios.", "w": "Two years of rising prices and rates have turned a once safe government into a possible minority, and One Nation is now the main challenger on the right."}, {"h": "A second poll has the Coalition recovering to 24%, level with One Nation", "s": {"t": "Capital Brief", "u": "https://capitalbrief.com/article/coalition-gets-crucial-polling-boost-ahead-of-bruising-week-for-labor-1cdc69fb-9d9a-4995-9640-6f8e3304cb8c"}, "b": "A DemosAU poll of 1,500 voters has the Coalition up four points in a month to 24%, equal with One Nation and behind Labor on 26%. Seat modelling suggests One Nation could win between 18 and 32 seats. Polls differ on who is ahead, so the safest read is a three way race with Labor under pressure.", "w": "The Coalition's recovery matters because One Nation's gains have mostly come from its voters, and preferences will decide a lot of seats."}, {"h": "Labor fights One Nation while wearing the political cost of inflation", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-30/michelle-grattan-one-nation-nsw-election/107323786"}, "b": "An analysis by Michelle Grattan argues that Labor is battling a One Nation insurgency at the same time as voters feel the pain of inflation. The next state elections are the nearest real test of how far One Nation's support will translate into votes.", "w": "A rate rise on Tuesday would add to that pain for mortgage holders just as the polls get tougher for the government."}], "quick": [{"x": "Independent Senator Fatima Payman says she was refused a parliamentary adviser because she quit Labor, adding to the row over how the PM hands out staff.", "t": "News24 Australia", "u": "https://news24.com.au/politics/australian-politics/as-petty-as-i-thought-independent-wa-senator-fatima-payman-unleashes-on-albanese-over-staffing-refusal-because-she-quit-labor/news-story/ba33d05f5a4142c8953c839f29648545?nk=ea998c6faf2ec810560ab7b999ff0f09-1793566499"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "RBA decides tomorrow, with a rise to 4.85% the most expected outcome", "s": {"t": "CommBank", "u": "https://www.commbank.com.au/articles/newsroom/2026/10/commbank-november-rba-rate-hike-inflation-risks.html"}, "b": "The cash rate is 4.60% after a September rise, and CommBank economists forecast another quarter point increase to 4.85% on Melbourne Cup Day. Reports differ on how fully markets have priced it, from roughly one in three to about 90%, so a surprise hold is not impossible. The RBA will also publish its new Statement on Monetary Policy forecasts at 2.30pm Sydney time, and oil above the level it assumed in August could push its inflation forecasts up.", "w": "A rise to 4.85% would be the highest cash rate since 2008 and add to repayments on variable home loans."}, {"h": "AVID matches Warburg Pincus with a revised bid for Ingenia", "s": {"t": "Capital Brief", "u": "https://www.capitalbrief.com/briefing/avid-matches-warburg-pincus-with-revised-ingenia-bid-5c452164-2601-41a0-ae71-05d8dfe6c432/"}, "b": "AVID used its matching right and lifted its non binding proposal to $5.45 per stapled security, which with a distribution of up to 5 cents is worth up to $5.50 cash, the same as Warburg Pincus. Ingenia's board says there is no certainty either proposal becomes a binding offer. The deal is tied to Ingenia's proposed $993 million acquisition of developer Peet, and walking away could cost a $10 million reverse break fee.", "w": "Both bidders are now level, so the next move, maybe a higher price or a binding offer, will decide who wins the retirement village and rental community owner."}, {"h": "ASX 200 ends the week up at 8,908 while crypto stocks wobble after the Binance hack", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-30/asx-markets-business-live-news-oct-30/107326558"}, "b": "The ASX 200 closed Friday up 0.18% at 8,908.1 points and the ABC reported a weekly gain of about 1.8%. The Australian dollar was around 70.34 US cents. Crypto assets lost value after the Binance attack, while Wall Street fell sharply on Intel and Amazon.", "w": "Local shares held up well, but a Wall Street tech selloff usually shows up on the ASX when it opens on Monday."}], "quick": [{"x": "RBA deputy governor Andrew Hauser warned this month the inflation outlook is materially worse than the bank had forecast.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-21/reserve-bank-hauser-warns-inflation-outlook-materially-worse/107288574"}, {"x": "Perpetual expects the RBA to pause until at least February, and maybe May, if it lifts rates in November.", "t": "Perpetual", "u": "https://www.perpetual.com.au/insights/weekly-economic-update-rba-signals-another-rate-rise-in-november/"}]}], "explainer": {"term": "Caretaker government", "body": "A caretaker government is one that stays in office to run the day to day business of the country while a new government is being sorted out. After Israel's election, Netanyahu remains caretaker prime minister until a new government wins parliament's approval. Caretaker leaders are expected to avoid big new policy decisions. Australia has similar caretaker conventions during election campaigns, when governments avoid major appointments and contracts. The idea is to stop a government that might lose power from locking in choices for its successor."}, "ahead": [{"d": "Tue 3 Nov", "e": "RBA cash rate decision and Statement on Monetary Policy, 2.30pm Sydney time (Melbourne Cup Day)"}, {"d": "Wed 4 Nov", "e": "US midterm elections are held on Tuesday in the US, so results arrive on Australian Wednesday"}, {"d": "Wed 4 Nov", "e": "Israeli President Herzog starts formal talks with parties on who should try to form a government"}, {"d": "Tue 10 Nov", "e": "Israel's new Knesset is sworn in, whatever the state of coalition talks"}, {"d": "Late Nov", "e": "Next test for One Nation at the state level, with the Victorian election due"}]}

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
