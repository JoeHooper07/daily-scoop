<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-13", "edition": "Friday 13 November 2026", "lede": ["Jensen Huang has quit as Nvidia's chief executive amid an affair scandal, with CFO Colette Kress stepping in and the shares closing down about 4%.", "Trump says the US no longer needs a deal with Iran and has told JD Vance to drop the talks, sending Brent crude up 3.3% to almost US$96.", "At home, the Marrickville golf club row deepened after the club said Anthony Albanese's honorary membership was worth about A$1,100 a year, not the A$5 he had suggested."], "numbers": [{"label": "ASX 200", "value": "9,146.8", "note": "Close on Thu 12 Nov, down 0.07% as banks rose and miners fell"}, {"label": "S&P 500", "value": "about 7,592", "note": "Close on Thu 12 Nov in New York, down about 0.35% as Nvidia dragged"}, {"label": "Brent crude", "value": "US$95.82", "note": "Settle on Thu 12 Nov, up 3.3% after Trump cooled on an Iran deal"}, {"label": "RBA cash rate", "value": "4.85%", "note": "Set on 3 Nov, the highest since 2008; next decision 8 Dec"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "US envoys brief Putin, then fly to Dublin to see Zelensky", "s": {"t": "NPR", "u": "https://www.npr.org/2026/11/12/nx-s1-6038809/us-envoys-meet-putin-russia-ukraine-war-talks"}, "b": "Steve Witkoff and Jared Kushner spent about two hours with Vladimir Putin in the Kremlin on Thursday, a day after the Abu Dhabi talks ended. The AP reported no major breakthrough beyond the big prisoner swap already agreed. Putin warned that any foreign troops sent to Ukraine would be treated as legitimate targets. The envoys then headed to Dublin, where Zelensky was attending a European summit, and Europeans were expected to join that meeting.", "w": "Putin's line on foreign troops goes straight at the European plan for post war security guarantees, which Australia has said it could contribute to."}, {"h": "Trump says America does not need an Iran deal and sidelines Vance", "s": {"t": "CNBC", "u": "https://cnbc.com/2026/11/12/trump-iran-deal-hormuz-strait.html"}, "b": "Trump posted on Thursday that the US should stop seeking a deal with Iran and told Vice President JD Vance to focus on crime and corruption at home instead. Vance had reportedly been weighing a face to face meeting with Iranian security chief Mohsen Rezaei, possibly in Doha. Iran denies any talks and says the Strait of Hormuz stays shut until the US meets its seven conditions.", "w": "Hopes of a deal had pushed oil below US$90 earlier this week; those hopes fading means higher fuel prices and more inflation pressure in Australia."}, {"h": "Indonesia's vice president quits in the biggest shake up since Suharto", "s": {"t": "NPR", "u": "https://www.npr.org/2026/11/12/g-s1-153190/indonesias-vp-resigns-as-his-eligibility-and-academic-credentials-are-questioned"}, "b": "Gibran Rakabuming Raka, son of former president Joko Widodo, handed his resignation to parliament on Thursday as questions mounted over his eligibility and academic credentials. A parliamentary petition had already started a process that could have led to impeachment. President Prabowo Subianto now gets a big say in choosing the replacement, which analysts see as him consolidating power away from Jokowi's camp.", "w": "Indonesia is Australia's giant next door neighbour and a key security and trade partner, so political instability in Jakarta matters directly to Canberra."}, {"h": "G7 says China's moves east of Taiwan threaten stability", "s": {"t": "Taipei Times", "u": "https://www.taipeitimes.com/News/front/archives/2026/11/12/2003867624"}, "b": "G7 foreign ministers meeting in Paris said China's growing coast guard and military activity off Taiwan's east coast threatens regional stability and shipping. China has been running regular patrols in those waters since June. The statement lands a week before the APEC leaders' summit in Shenzhen, China.", "w": "A lot of Australia's trade passes through these sea lanes, and any squeeze on shipping near Taiwan would hit our exports and supply chains."}], "quick": [{"x": "Ukraine says Starshield satellite internet speeds have been capped again along the front, hampering its drone defences, less than three weeks after earlier limits were lifted.", "t": "Euronews", "u": "https://www.euronews.com/2026/11/12/zelenskyy-starlink-again-facing-restrictions-in-ukraine-hampering-russian-drone-intercepti"}, {"x": "Putin offered to evacuate civilians from the frontline Ukrainian city of Kostiantynivka, following an earlier local truce in Oleshky.", "t": "France 24", "u": "https://www.france24.com/en/europe/20261112-live-us-envoys-to-meet-putin-and-zelensky-after-abu-dhabi-talks"}, {"x": "US core inflation rose 0.3% in October for a third straight month, above forecasts, reviving talk of further Fed rate hikes.", "t": "Fox Business", "u": "https://www.foxbusiness.com/economy/cpi-inflation-october-2026"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Jensen Huang resigns as Nvidia boss; Colette Kress takes over for now", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/12/why-did-nvidia-ceo-jensen-huang-resign-and-who-is-colette-kress"}, "b": "Huang, who cofounded Nvidia in 1993 and turned it into the world's most valuable chipmaker, is stepping down as CEO and leaving the board. Nvidia gave no reason, but reports tie his exit to alleged affairs, including one with a woman US authorities suspect of spying for Beijing. Chief financial officer Colette Kress will run the company as interim CEO while keeping her finance job, and former Synopsys boss Harvey Jones becomes Nvidia's first board chair.", "w": "Nvidia's chips power almost every big AI project, so a leadership vacuum there ripples through global markets and Australian super funds that hold the stock."}, {"h": "Nvidia sheds billions as the shares claw back a big early fall", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/12/nvidia-nvda-jensen-huang-second-affair.html"}, "b": "Nvidia shares fell as much as 14% early on Thursday before buyers stepped in, closing down about 4.3%. CNN put the one day loss at roughly US$182 billion in market value, and the company briefly dipped below US$4 trillion. The slide dragged the Nasdaq down about 0.4%.", "w": "How investors handle Nvidia without Huang is a test of how much of the AI boom rests on one company, just before Anthropic's huge float next week."}, {"h": "Starshield limits back on in Ukraine, and nobody owns up", "s": {"t": "Forbes", "u": "https://www.forbes.com/sites/siladityaray/2026/11/12/zelenskyy-says-spacexs-starshield-restrictions-have-returned-disrupting-ukraines-drone-defenses/"}, "b": "Zelensky says Ukrainian units have faced a speed cap of about 161 km/h on SpaceX's military satellite service, Starshield, for several days. That stops the terminals working on fast interceptor drones used against Russian jet drones. Elon Musk says Starshield is owned and controlled by the US government, while Trump says he did not order the limits.", "w": "It shows how much a modern army can depend on one private tech company, a lesson for Australia as Defence buys more commercial space services."}], "quick": [{"x": "China has brought in as many as 30,000 workers to build an AI data centre hub in Inner Mongolia, as US projects face local pushback.", "t": "CBS News", "u": "https://cbsnews.com/news/china-ai-data-center-boom-as-us-tech-firms-face-resistance"}, {"x": "Analysts expect Kress to serve about a year as interim boss while Nvidia's board weighs internal and outside candidates.", "t": "CNBC", "u": "https://www.cnbc.com/2026/11/12/colette-kress-nvidia-cfo-interim-ceo-candidate.html"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Golf club says Albanese's free membership was worth A$1,100, not A$5", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-12/marrickville-golf-club-albanese-membership-worth-thousand/107377472"}, "b": "Marrickville Golf Club's president told a Senate inquiry the honorary membership it gave Albanese in 2012 offered full access worth about A$1,100 a year, though he never played a round. The club in his electorate received a A$6 million federal grant, mostly for a clubhouse upgrade, not the sewerage works Albanese first described. MPs must declare gifts worth over A$750, and Opposition Leader Angus Taylor says the episode shows a character flaw.", "w": "The inquiry is probing over A$500 million in grants that favoured Labor seats, so this could become a broader integrity headache for the government."}, {"h": "Tony Burke weighs a backdown on backpacker visa cuts", "s": {"t": "The Nightly", "u": "https://thenightly.com.au/politics/tony-burkes-backpacker-backdown-looms-large-in-yet-another-albanese-government-policy-capitulation-c-23155635"}, "b": "The Home Affairs Minister announced plans to cut second year working holiday visas from 57,000 to 45,000 and third year visas from 31,000 to just 5,000, with a ballot deciding who stays. Farm and tourism groups say that would gut their harvest workforce. Reports say a revised plan could delay the ballot and lift third year visas to 25,000, though Burke says total numbers are not negotiable.", "w": "Backpackers fill a lot of regional farm and hospitality jobs, so the final numbers will affect food prices and regional businesses."}, {"h": "Unions and business both slam Victoria's A$1.3 billion WorkCover grab", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-12/victoria-election-blog/107374690"}, "b": "Premier Ben Carroll's pre election budget update counts A$1.3 billion in revenue from WorkCover, the state's injured workers insurance scheme. The Ai Group said it was in disbelief and Trades Hall called it a broken promise to injured workers. The update also shows Victoria's cash deficit reaching A$33 billion over four years, with the election on 28 November.", "w": "Victoria carries the biggest debt load of any state, and how it fixes the budget affects borrowing costs and business taxes for a quarter of the country."}], "quick": [{"x": "Labor frontbenchers including Tanya Plibersek talked up the fall in investor home loans as good news for first home buyers after the budget's negative gearing changes.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-12/federal-politics-live-blog-albanese-cop31-nov-2/107375902"}, {"x": "A new poll has Victorian Labor slumping to third place behind the Coalition and One Nation, with Carroll at risk in his own seat of Niddrie.", "t": "Yahoo News", "u": "https://au.news.yahoo.com/carroll-drops-polling-ahead-vic-215543620.html"}, {"x": "An inquiry heard seasonal workers are already leaving regional towns over what they call a broken promise on visas.", "t": "Neos Kosmos", "u": "https://neoskosmos.com/en/2026/11/12/news/australia/workers-leave-regions-over-australias-broken-promise/"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASIC sues CBA over hidden business banking fees", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-12/asic-sues-commonwealth-bank-alleges-overcharged-millions-in-fees/107376156"}, "b": "The corporate regulator alleges Commonwealth Bank charged about 42,000 CommBiz customers a second, undisclosed fee on direct debit and credit payments, overcharging them around A$8.5 million between 2020 and 2025. ASIC says the bank had complaints from 2015 and a 2016 internal audit flagged the problem. CBA says it reported the issue itself, has paid customers back an average of A$442 and will defend parts of the case.", "w": "It is another reminder that regulators are chasing bank fee practices, which matters for the small businesses that rely on them."}, {"h": "ASX flat as banks rally and miners sink", "s": {"t": "Sharetrader", "u": "https://sharetrader.com.au/news/2026-11-12-materials-slide-ends-three-day-asx-winning-streak-westpac-closes-at-three-month-high"}, "b": "The ASX 200 slipped 6.4 points to 9,146.8 on Thursday, ending a three day winning streak. Financials gained about 1.1% with Westpac up 1.9% to a three month high of A$38.01, while materials fell about 2.1% as gold, lithium and uranium stocks slid. CBA rose despite the ASIC case.", "w": "The index is hovering just below its record high, so the next push depends on whether rate worries or bank strength wins out."}, {"h": "Hot US inflation adds to global rate jitters", "s": {"t": "Fox Business", "u": "https://www.foxbusiness.com/economy/cpi-inflation-october-2026"}, "b": "US consumer prices rose 0.4% in October, above the 0.3% expected, with core prices up 0.3% for a third month running. Officials could not publish a yearly rate because data was not collected during last year's government shutdown. Higher US bond yields knocked gold miners on the ASX.", "w": "With our own cash rate already at 4.85%, sticky US inflation makes it less likely global rates fall soon, keeping pressure on Australian borrowers."}, {"h": "Blackstone comes back for IDP Education at A$3 a share", "s": {"t": "Kalkine", "u": "https://kalkine.com.au/news/consumer/asx-200-today-idp-education-asxiel-weighs-revised-300-blackstone-proposal"}, "b": "Private equity giant Blackstone has made a revised cash proposal to buy all of IDP Education for A$3.00 a share. IDP runs international student recruitment and the IELTS English test. Its board has not yet said whether it will engage.", "w": "IDP's value has been crushed by Canberra's caps on international students, so a buyout bid shows private equity sees a bargain in the sector."}], "quick": [{"x": "Oil jumped 3.3% after Trump's Iran comments, with Brent settling at US$95.82 a barrel.", "t": "Rigzone", "u": "https://www.rigzone.com/news/oil_rises_as_trump_dims_iran_deal_hopes-12-nov-2026-185073-article"}, {"x": "The Australian dollar has slipped to around 68.2 US cents, down from about 70 cents at the start of November.", "t": "LiteFinance", "u": "https://www.litefinance.org/blog/analysts-opinions/aud-usd-price-prediction/"}]}], "explainer": {"term": "Interim CEO", "body": "An interim CEO is a stand in boss appointed when a chief executive leaves suddenly and the board has not yet picked a permanent replacement. Companies often choose a trusted insider, like Nvidia's CFO Colette Kress, to keep things steady while they run a proper search. The interim boss usually avoids big strategy shifts, since investors know a new leader is coming. A long interim period can unsettle staff and shareholders, so markets watch closely for who gets the job for good."}, "ahead": [{"d": "Mon 16 Nov", "e": "Senate sits again until 19 November."}, {"d": "Tue 17 Nov", "e": "First creditors' meeting for David Jones."}, {"d": "Wed 18 Nov", "e": "Australia's Wage Price Index is due; APEC leaders gather in Shenzhen, China, through 19 November."}, {"d": "Thu 19 Nov", "e": "ABS October jobs figures, after unemployment hit 4.7% in September; Anthropic shares due to start trading on Nasdaq."}, {"d": "Fri 20 Nov", "e": "COP31 climate talks in Antalya are scheduled to end."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
