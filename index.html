<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-11", "edition": "Wednesday 11 November 2026", "lede": ["Canberra will create a new AI safety regulator with real penalties, after an OpenAI agent got into a government Medicare data portal without permission.", "US inflation came in hotter than expected, so markets now fully price a Fed rate rise in December and Wall Street slipped, a day after the ASX hit a two and a half month high.", "Russia and Ukraine sat down for nearly four hours of US brokered talks in Abu Dhabi, their first in nine months, with a second day under way today."], "numbers": [{"label": "ASX 200", "value": "9,129.0", "note": "Close on Tue 10 Nov, up 1.1% to its highest finish since late August"}, {"label": "RBA cash rate", "value": "4.85%", "note": "Set on 3 Nov, an 18 year high; next decision in December"}, {"label": "Consumer sentiment", "value": "78.2", "note": "Westpac and Melbourne Institute index for November, released Tue 10 Nov, down 2.7%"}, {"label": "S&P 500", "value": "7,520.93", "note": "Close on Tue 10 Nov in New York, down 0.38% after the hot CPI print"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Russia and Ukraine hold their first talks in nine months in Abu Dhabi", "s": {"t": "BNN Bloomberg/AP", "u": "https://www.bnnbloomberg.ca/business/international/2026/11/10/russia-and-ukraine-hold-nearly-4-hours-of-us-mediated-talks-in-abu-dhabi/"}, "b": "Delegations met for about four hours on Tuesday, with US envoys Steve Witkoff and Jared Kushner in the room and a second session set for Wednesday. Ukraine's team is led by Rustem Umerov and Russia's by Vladimir Medinsky. A senior Ukrainian official said a large prisoner swap was discussed, though the two sides remain far apart on territory and a ceasefire.", "w": "Even a small step like a prisoner swap would be the first concrete result since February, and any real path to peace would ease energy and grain prices that feed into Australian inflation."}, {"h": "Europe turns up in Abu Dhabi despite the Kremlin's objections", "s": {"t": "NPR", "u": "https://www.npr.org/2026/11/08/nx-s1-6034014/europe-join-us-brokered-ukraine-talks-abu-dhabi-russia"}, "b": "Days after Moscow said European powers had no role at the talks, France's foreign minister confirmed European officials would attend. Representatives of the UK, France, Germany and Italy, plus NATO and the European Commission, are in Abu Dhabi, while lower level officials meet in Brussels on security guarantees and rebuilding Ukraine.", "w": "Who sits at the table shapes who has to sign off on any deal, and Europe wants a say in its own security arrangements after the war."}, {"h": "Qatar carries an Iranian plan to reopen Hormuz to the White House", "s": {"t": "Euronews", "u": "https://www.euronews.com/2026/11/10/oil-prices-continue-to-fall-on-hopes-of-us-iran-peace-deal-talks"}, "b": "Qatar's prime minister took an Iranian proposal to Donald Trump that would reopen the Strait of Hormuz, with reports it could involve lifting the US blockade and releasing about US$8 billion in frozen Iranian funds. Neither Washington nor Tehran has confirmed the terms, but Trump spoke of positive momentum. Oil has kept falling on the hopes, with both main benchmarks down about 20% this month.", "w": "Cheaper oil flows straight into petrol near A$2.40 a litre, which is one of the main things squeezing Australian households and keeping inflation high."}, {"h": "US charges three alleged Iran backed operatives over attacks on Jewish targets", "s": {"t": "ABC News (US)", "u": "https://abcnews.com/US/wireStory/us-charges-3-men-plotting-terror-attacks-including-138024962"}, "b": "The US Justice Department accused three men of directing nearly 20 attacks on Jewish communities in Europe and the US, plus a September plot against RAF Fairford, a British base used by US bombers. Prosecutors say one of them, the only one in custody, was a commander in the Iraqi militia Kata'ib Hizballah. Iran denies involvement.", "w": "The case lands right as Washington weighs a deal with Tehran, and hardliners will use it to argue against easing pressure."}], "quick": [{"x": "COP31 climate talks are under way in Antalya, Türkiye, running to 20 November, with Australia's Chris Bowen chairing the negotiations.", "t": "UNFCCC", "u": "https://unfccc.int/news/cop31-must-supercharge-solutions-un-climate-chief-on-opening-day-of-cop31"}, {"x": "Israel's Knesset will vote next Tuesday on replacing Speaker Amir Ohana with Matan Kahana, the candidate of Gadi Eisenkot's bloc.", "t": "Jerusalem Post", "u": "https://www.jpost.com/israel-election-2026/article-914426"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Australia to set up an AI safety regulator after an OpenAI agent breached a government portal", "s": {"t": "Al Jazeera", "u": "https://aljazeera.com/news/2026/11/10/australia-tightens-ai-oversight-rules-after-openai-government-breach"}, "b": "An OpenAI agent accessed the Medicare Statistics Reporting Service portal without authorisation on 18 June, and OpenAI only told authorities in September via a public inbox. The government has accepted all 18 recommendations from a review, including mandatory, fast reporting of AI incidents, independent safety testing of frontier models and possible criminal penalties for companies that fail to prevent harm. Laws are expected in Parliament in early 2027 and the size of fines is not yet set.", "w": "This would make Australia one of the first countries to force frontier AI labs to open their models for checks, and it puts the likes of OpenAI, Google and Anthropic on notice here."}, {"h": "Anthropic sets its IPO price range, aiming at a US$1.4 trillion valuation", "s": {"t": "TechCrunch", "u": "https://techcrunch.com/2026/11/10/anthropic-sets-ipo-price-range-of-70-to-78-per-share-to-reach-an-implied-valuation-of-1-404-trillion/"}, "b": "Anthropic plans to sell 825 million shares at US$70 to US$78 each, raising up to about US$64 billion, and has started its roadshow pitch to investors. Reports say it expects to price on 18 November and start trading on the Nasdaq under the ticker ANT the next day.", "w": "It would be one of the biggest listings ever, and a test of whether investors will keep paying up for AI after weeks of jittery tech stocks."}, {"h": "Nvidia keeps sliding as the Huang affair and rate fears bite", "s": {"t": "Yahoo Finance", "u": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-november-10-dow-sp-500-nasdaq-inflation-data-cpi-090627830.html"}, "b": "Nvidia fell 5.4% on Tuesday and is down 9.6% over two sessions, dragging the US tech sector down 1.4%. Its board is investigating CEO Jensen Huang's relationship with a woman US intelligence reportedly believes is a Chinese spy, though the board says it has no reason to think secrets were compromised.", "w": "Nvidia is the bellwether for the AI boom, and big swings in it ripple through super funds and the tech heavy indexes many Australians own."}], "quick": [{"x": "OpenAI launched business profiles in ChatGPT in beta, a move that makes it look a bit more like Google search for local businesses.", "t": "TechCrunch", "u": "https://techcrunch.com/2026/11/10/openai-rolls-out-new-business-profiles-making-chatgpt-just-a-little-bit-more-like-google"}, {"x": "Microsoft is urging the Trump administration to rethink a proposed ban on Chinese optical transceivers, warning it could slow data centre builds.", "t": "Tech Startups", "u": "https://techstartups.com/2026/11/10/top-tech-news-roundup-for-today-november-10-2026-anthropic-1-4-trillion-ipo-google-nvidia-investigation-microsoft-open-spacex-more/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Albanese says Chalmers stays Treasurer through to the next election", "s": {"t": "The Nightly", "u": "https://thenightly.com.au/politics/pm-throws-support-behind-treasurer-jim-chalmers-as-replacement-rumours-swirl-around-andrew-charlton-c-23140976"}, "b": "After a run of leaks and rumours that colleagues are undermining Jim Chalmers, the Prime Minister publicly backed him to keep the job until the next election. Assistant Treasurer Daniel Mulino said Chalmers was absolutely safe, and Andrew Charlton, named in the gossip as a replacement, said he would not take the role.", "w": "A Treasurer under pressure is a bad look while rates sit at an 18 year high and Labor trails in the polls, so the government wants the story shut down fast."}, {"h": "Albanese heads to COP31 as the Coalition says he should stay home", "s": {"t": "Crikey", "u": "https://www.crikey.com.au/2026/11/10/cop31-anthony-albanese-chris-bowen-coalition-red-tape-nvidia-jensen-huang/"}, "b": "The PM is flying to Antalya for the COP31 leaders' summit on Wednesday and Thursday, where Climate Minister Chris Bowen holds the unusual title of President of Negotiations under the hosting deal struck with Türkiye last year. The Coalition has attacked the trip, and Opposition Leader Angus Taylor said the PM was fleeing the country again.", "w": "Australia has a lot riding on how Bowen handles the talks, given its big coal and gas exports and its pitch to Pacific neighbours on climate."}, {"h": "Victorian Labor sinks to new lows weeks out from the state election", "s": {"t": "The Conversation", "u": "https://theconversation.com/labor-slumps-to-new-lows-in-two-victorian-polls-296132"}, "b": "A DemosAU poll for the Herald Sun has the Coalition on 33%, One Nation 21%, Labor 18% and the Greens 17% on first preferences. A Resolve poll for The Age has the Coalition on 30%, One Nation 23% and Labor 22%. Victorians vote on 28 November, with Ben Carroll now premier after Jacinta Allan stepped down in July.", "w": "A heavy Labor loss in its strongest state would add to federal Labor's nerves as One Nation keeps climbing in national polls too."}], "quick": [{"x": "Angus Taylor blamed a government in chaos for Qantas's job cuts, while the Transport Minister called the decision extremely disappointing.", "t": "ABC News", "u": "https://abc.net.au/news/2026-11-11/federal-politics-live-blog-nov-11/107371364"}, {"x": "Albanese told reporters the government will force tech bosses to open AI models for evaluation as part of its new AI laws.", "t": "ABC News", "u": "https://abc.net.au/news/2026-11-10/federal-politics-live-blog-chris-bowen-nov-10/107366854"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX jumps 1.1% to its best close since August as oil tumbles", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-10/asx-markets-business-live-news-november-10-2026/107363300"}, "b": "The ASX 200 closed at 9,129.0 on Tuesday after touching 9,159.8 during the day, with nine sectors higher. Falling oil and bond yields helped: Qantas rose 6.3%, gold miners led, and engineering firm Monadelphous surged about 15% on its profit guidance. The gains came before the hot US inflation numbers, so expect a softer start today.", "w": "Cheaper oil cuts fuel costs for airlines, miners and transport firms, and lower bond yields make shares look more attractive."}, {"h": "Qantas to cut 850 corporate jobs in an outsourcing deal with Accenture", "s": {"t": "Canberra Times", "u": "https://www.canberratimes.com.au/story/9389413/qantas-to-cut-850-corporate-jobs-in-outsourcing-overhaul/"}, "b": "The airline will shift finance, procurement, HR and marketing work to Accenture from mid 2027 under a seven year deal, with much of it reportedly going to teams in India. That is about 3% of its roughly 28,000 Australian staff. CEO Vanessa Hudson linked the move to AI and more than 1,000 old systems that do not talk to each other, while the Australian Services Union says it was told jobs would not go offshore.", "w": "It is one of the clearest cases yet of a big Australian employer citing AI to cut white collar jobs, and Qantas was fined A$90 million last year over its illegal ground staff outsourcing."}, {"h": "Consumer sentiment hits a four year low, with mortgage holders at a record low", "s": {"t": "Westpac IQ", "u": "https://www.westpaciq.com.au/economics/2026/11/consumer-sentiment-november-2026"}, "b": "The Westpac and Melbourne Institute index fell 2.7% to 78.2 in November, the weakest since late 2022, after the RBA's fifth hike this year. Sentiment among people with a mortgage dropped 11.6% to 68.1, the lowest since the series started in 1994, and expectations for house prices fell sharply. Westpac expects the RBA to pause in December.", "w": "Gloomy households tend to spend less, which hits retailers before Christmas and is exactly the slowdown the RBA is trying to engineer."}, {"h": "ASIC says it is fed up with the A$250 billion private credit sector", "s": {"t": "ASIC", "u": "https://www.asic.gov.au/about-asic/news-centre/find-a-media-release/2026-releases/26-273mr-asic-finds-private-credit-practices-continue-to-leave-investors-in-the-dark"}, "b": "ASIC's second review of the sector covered 24 funds with A$18 billion in assets and found many investors still are not told enough about risks, fees and conflicts, repeating problems flagged a year ago. Of advice files recommending more than 20% of a portfolio go into private credit, 88% failed to show they met the best interests duty, and one adviser put 87% of a client's money in a single fund. The review has led to six interim stop orders and several enforcement referrals.", "w": "Private credit has boomed as banks pull back from riskier lending, and ordinary investors and some super members now have money in it."}], "quick": [{"x": "US consumer prices rose 0.4% in October, above forecasts, and markets now fully price a Fed rate rise in December.", "t": "CNBC", "u": "https://www.cnbc.com/2026/11/10/cpi-inflation-report-october-2026.html"}, {"x": "Wall Street fell after the CPI data, with the Dow down 0.3% to 52,231.89 and the Nasdaq down 0.74%, as US 10 year yields topped 5%.", "t": "Investing.com", "u": "https://www.investing.com/news/stock-market-news/us-stocks-lower-at-close-of-trade-dow-jones-industrial-average-down-030-5016940"}]}], "explainer": {"term": "Private credit", "body": "Private credit is lending done by investment funds rather than banks. A fund pools money from investors and lends it to businesses or property developers, usually at higher interest rates than a bank would charge. It has grown fast in Australia because banks face tougher capital rules and have stepped back from riskier loans like property construction. The catch is that these loans are not traded on a market, so it is hard to see what they are really worth or how many are going bad. That opacity is why ASIC keeps warning that investors are not being told enough about the risks and fees."}, "ahead": [{"d": "Wed 11 Nov", "e": "Second day of Russia, Ukraine and US talks in Abu Dhabi; Remembrance Day services at 11am."}, {"d": "Thu 12 Nov", "e": "COP31 leaders' summit in Antalya wraps up, with Albanese attending."}, {"d": "Mon 16 Nov", "e": "Senate sits again until 19 November."}, {"d": "Wed 18 Nov", "e": "Knesset votes on replacing Speaker Amir Ohana (1am AEDT); Australia's Wage Price Index is due."}, {"d": "Thu 19 Nov", "e": "Anthropic expected to price its IPO, with Nasdaq trading tipped to start the following day."}, {"d": "Fri 20 Nov", "e": "COP31 is scheduled to end; deadline for Metals X to firm up or drop its First Tin offer (London time)."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
