<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>

<script type="application/json" id="brief">{"date": "2026-11-22", "edition": "Sunday 22 November 2026", "lede": ["COP31 in Antalya ran into a second day of overtime with no deal, as Chris Bowen and the Turkish presidency tried to rescue a text that still leaves out fossil fuels.", "A new Redbridge poll has the Victorian Coalition ahead of Labor 57 to 43, with analysts tipping a landslide on the scale of Jeff Kennett's 1992 win when the state votes on Saturday.", "Federal parliament returns on Monday for its last week of the year with the gas reservation bill still short of Senate votes, and October inflation figures land on Wednesday."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "As at 22 Nov; lifted on 3 Nov in a 6 to 3 vote, the highest since 2008"}, {"label": "S&P 500", "value": "6,910.39", "note": "Close on Fri 20 Nov (US time), down 3.7% on the day and 8.6% for the week"}, {"label": "Nasdaq Composite", "value": "22,617.73", "note": "Close on Fri 20 Nov (US time), down 5.28%, wiping out its 2026 gain"}, {"label": "October CPI forecast", "value": "4.8% a year", "note": "Westpac's forecast for the monthly CPI due Wed 25 Nov"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "COP31 still has no deal after a second night of overtime", "s": {"t": "RTE", "u": "https://www.rte.ie/news/environment/2026/1121/1600094-cop31-turkey/"}, "b": "The Antalya climate summit was meant to end on Friday, but by Saturday the EU's climate envoy said there was still no compromise. COP31 president Murat Kurum promised a third draft after overnight talks and said negotiators were close to the finish line but not there yet. More than 20 countries, including France and Panama, want wording on moving away from fossil fuels put back in, and a closing session has been flagged for Sunday.", "w": "Australia's Chris Bowen is running the negotiations, so whether a deal lands, and how weak it is, will shape how Canberra's climate diplomacy is judged."}, {"h": "Two more tankers hit in the Strait of Hormuz", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/11/21/tankers-hit-in-strait-of-hormuz-as-iran-tightens-grip-on-shipping"}, "b": "British maritime authorities reported two tankers struck by unidentified projectiles in the strait on Saturday. Iran's navy separately said an oil tanker caught fire after hitting a naval mine in a restricted area east of the waterway. Iran's foreign minister says talk of reopening the strait is pointless until Tehran's demands are met, while the US keeps escorting tankers and blockading Iranian ports.", "w": "Near daily attacks keep a risk premium on oil, which flows straight through to Australian petrol and diesel prices."}, {"h": "World Court finds Myanmar committed genocide against the Rohingya", "s": {"t": "OPB (NPR)", "u": "https://www.opb.org/article/2026/11/19/top-u-n-court-rules-myanmar-committed-genocide-against-rohingya/"}, "b": "The International Court of Justice ruled that Myanmar was responsible for genocide during the military's 2016 and 2017 clearance operations against the Rohingya. It is the first time the court has found a country responsible for committing genocide. The ruling is final, and Myanmar must make reparations, including allowing a safe and voluntary return of refugees, with compensation to be set later.", "w": "The case was brought by The Gambia in 2019, and lawyers expect the reasoning on intent to matter in other genocide cases, including South Africa's case against Israel."}], "quick": [{"x": "Zelensky says Ukraine still has not seen written commitments on NATO style security guarantees, and wants any guarantee to last decades, not just one US term.", "t": "Kyiv Independent", "u": "https://kyivindependent.com/zelensky-says-ukraine-has-yet-to-see-written-commitments-on-nato-style-security-guarantees"}, {"x": "Estonia will close all its border crossings with Russia from 1 December after a foiled arson attack on a local drone maker, which it prompts containing unique web links and decoy login details into popular AI services between July and November. It later saw those planted details used in attempts to access its test systems and decoy cloud accounts, pointing to exposure at three or more providers. It has not named them.", "w": "Businesses pasting sensitive data into AI tools are trusting the provider's whole supply chain, so this is a reminder to check data handling promises before signing up."}], "quick": [{"x": "OpenAI released GPT-6.2 Astra and Sol this week, two models pitched at professional work with lower computing costs for complex tasks.", "t": "The Neuron", "u": "https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-18-2026/"}, {"x": "Nothing says its first AI native gadget, which has no screen, will launch in December.", "t": "TechNode", "u": "https://technode.com/2026/11/05/nothing-plans-december-launch-for-first-ai-native-device/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Experts tip a historic Labor defeat in Victoria", "s": {"t": "ABC", "u": "https://abc.net.au/news/2026-11-21/victorian-election-final-week/107412434"}, "b": "With a week to go until the 28 November election, a Redbridge poll for the AFR has the Coalition ahead of Labor 57 to 43 on a two party preferred basis. Political analysts say Jess Wilson is likely to win majority government on a scale similar to Jeff Kennett's 1992 landslide. Premier Ben Carroll and Wilson both spent Saturday at early voting centres, while the Greens and One Nation chase their own target seats.", "w": "Victoria has been Labor's strongest state, so a rout there would rattle the Albanese government and feed talk of a broader swing to the right."}, {"h": "Parliament's last week opens with the gas bill still stuck", "s": {"t": "Michael West (AAP)", "u": "https://michaelwest.com.au/end-of-year-deadline-looms-for-gas-reserve-fight"}, "b": "The government wants its national gas reservation scheme, which sets aside gas for local users, passed before parliament rises for summer. Labor needs either the Coalition or the Greens in the Senate. The Coalition objects to a Western Australia focused amendment that widens ministerial discretion, while the Greens want concessions on gas exports.", "w": "The scheme is meant to ease east coast gas prices for households and manufacturers, so another delay pushes any relief into 2027."}, {"h": "Tsunami warning time cut after Macquarie Island station goes quiet", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-22/tsunami-response-time-reduced-macquarie-island-staff-removal/107404714"}, "b": "Internal government documents show emergency services will get less warning of tsunamis from the Southern Ocean because the Macquarie Island seismic station is no longer operating after staff were withdrawn. Geoscience Australia expects slower and less sensitive detection of earthquakes south of Australia and New Zealand. The Australian Antarctic Division says it worked with Tasmania's parks service on environmental risks before pulling staff.", "w": "It looks like a small operational call, but it trims warning time for coastal communities in Tasmania and the south east."}, {"h": "Albanese comes home after 11 days in Trump's orbit", "s": {"t": "ABC", "u": "https://www.abc.net.au/news/2026-11-22/albanese-trump-quad-xi-putin-summits-analysis/107410572"}, "b": "The Prime Minister wraps up a summit season that took in the Quad, APEC and meetings with Xi and Putin. ABC analysis says Trump appears to have warmed to Albanese over the trip. He now returns to a crowded final sitting week and a looming Victorian loss for his party.", "w": "Better ties with Washington and Beijing at once are a diplomatic win, but voters will judge him on cost of living at home."}], "quick": [{"x": "Labor is reportedly weighing a gas phase out clause to win Greens support for the reservation scheme after talks with the Coalition stalled.", "t": "OilPrice", "u": "https://oilprice.com/Latest-Energy-News/World-News/Australia-Explores-Gas-Phase-Out-Deal-in-Talks-on-Reservation-Scheme.html"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "October inflation due Wednesday, and it may run hotter", "s": {"t": "Westpac IQ", "u": "https://www.westpaciq.com.au/economics/2026/11/cpi-monthly-preview-14-november-2026/"}, "b": "The ABS releases the October monthly CPI at 11:30am on Wednesday 25 November. Westpac expects prices to rise about 0.4% in the month, lifting annual inflation to 4.8%. The RBA lifted the cash rate to 4.85% on 3 November, its fifth hike this year.", "w": "A hot number would revive talk of another rate rise early next year, just as markets are tumbling and unemployment is drifting up."}, {"h": "Petrol and diesel prices ease for another week", "s": {"t": "ACCC", "u": "https://www.accc.gov.au/about-us/publications/weekly-fuel-price-monitoring-update"}, "b": "The ACCC's 37th weekly fuel update, released on 20 November, says average retail prices fell over the past week in both the capital cities and regional areas. The regulator started weekly monitoring because of the Middle East conflict and its hit to oil supply.", "w": "Cheaper fuel helps household budgets, but fresh tanker attacks in Hormuz could reverse it quickly."}, {"h": "Mayne Pharma backs a $604 million takeover at nearly double its price", "s": {"t": "Motley Fool", "u": "https://www.fool.com.au/2026/11/17/mayne-shares-are-up-80-on-takeover-news-but-theres-still-money-to-be-made/"}, "b": "Hungarian drugmaker Gedeon Richter has agreed to buy Mayne Pharma for $6.40 a share in cash, a 99.4% premium to its previous close. The board unanimously recommends the deal, which needs Mayne to sell its international business first and get foreign investment approval. Shareholders are due to vote in late January, with completion expected in March 2027.", "w": "It comes after the Treasurer blocked an earlier bid from Cosette, and adds to a run of foreign buyers picking off ASX small and mid caps."}], "quick": [{"x": "ASIC chair Sarah Court set out nine enforcement priorities, grouped around protecting vulnerable consumers, lifting standards and targeting serious misconduct.", "t": "Australian Compliance Institute", "u": "https://compliance.org.au/regulatory-update-20-november/"}, {"x": "The ABS releases private business investment figures for the September quarter on Thursday 26 November.", "t": "ABS", "u": "https://www.abs.gov.au/release-calendar/future-releases"}]}], "explainer": {"term": "Short seller", "body": "A short seller bets that a company's share price will fall. They borrow shares, sell them, and hope to buy them back later at a lower price, pocketing the difference. Some, like Hunterbrook, also publish research alleging problems at the company and disclose their bet when they do. Supporters say they expose fraud and overhyped stocks, while critics say they can talk a share price down for profit."}, "ahead": [{"d": "Sun 22 Nov", "e": "COP31 closing session expected in Antalya, likely from Sunday evening Australian time."}, {"d": "Mon 23 Nov", "e": "Federal parliament begins its final sitting week of the year, with the gas reservation and digital duty of care bills on the agenda."}, {"d": "Wed 25 Nov", "e": "October monthly CPI inflation released at 11:30am."}, {"d": "Thu 26 Nov", "e": "ABS private capital expenditure figures for the September quarter."}, {"d": "Sat 28 Nov", "e": "Victorian state election day."}, {"d": "Tue 1 Dec", "e": "Estonia closes all its border crossings with Russia."}]}</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
