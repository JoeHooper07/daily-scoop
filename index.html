<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">
{"date": "2026-11-07", "edition": "Saturday 7 November 2026", "lede": ["Wall Street bounced on Friday after its AI rout, helped by a strong US jobs report, but the ASX still slipped 0.5% to 9,020.8.", "Democrats now hold both chambers of Congress, and the fallout is spreading from AI data centres to the Iran war, with Trump weighing fresh strikes or a Qatar brokered deal.", "At home, all four big banks will pass on the RBA hike from 13 November, NAB's profit fell 13% on bad debts, and David Jones is fighting to survive."], "numbers": [{"label": "RBA cash rate", "value": "4.85%", "note": "Lifted 0.25 points on 3 Nov; fifth rise this year, as at 4 Nov"}, {"label": "ASX 200", "value": "9,020.8", "note": "Friday 6 Nov close, down 0.49%, up 1.2% on the week"}, {"label": "AUD/USD", "value": "about 69 US cents", "note": "Friday 6 Nov, down from about 70.1 cents on Thursday"}, {"label": "Brent crude", "value": "about US$93", "note": "Thursday 5 Nov, falling on hopes of Iran diplomacy"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Trump weighs new Iran strikes or a deal as Qatar pushes a draft agreement", "s": {"t": "Gulf News", "u": "https://gulfnews.com/world/mena/trump-weighs-iran-strikes-or-deal-after-midterm-loss-as-vance-urges-agreement-qatar-mediates-brent-oil-falls-to-93-1.500736556"}, "b": "Trump spoke with Qatar's emir on Friday and is reportedly choosing between more strikes, continued economic pressure or a deal with big concessions to Tehran. Qatari mediators are circulating a draft that could restart direct talks within days, starting with a short run of confidence building steps. Iran says it will not reopen the Strait of Hormuz or negotiate until its conditions are met, including an end to the US naval blockade and sanctions relief.", "w": "Hormuz carries a big slice of the world's oil and LNG, so this decides fuel prices and inflation here. Brent has already eased on hopes of a deal."}, {"h": "Tankers hit mines in Hormuz and Iran claims it downed a US drone", "s": {"t": "Al Jazeera", "u": "https://www.aljazeera.com/amp/news/liveblog/2026/11/6/iran-war-live-trump-warns-us-may-have-to-destroy-rest-of-iran"}, "b": "Iran's Revolutionary Guard says two oil tankers struck mines in the strait and that it shot down a US drone near Qeshm Island. Those claims come from Iranian officials and are not independently confirmed in the coverage we found. Trump has warned the US may have to hit much more of Iran if talks fail.", "w": "Every ship incident raises insurance costs and the risk of a miscalculation that ends the talks before they start."}, {"h": "Herzog to name Israel's next PM candidate on Sunday after Eisenkot gets 67 recommendations", "s": {"t": "Times of Israel", "u": "https://www.timesofisrael.com/as-eisenkot-wins-67-nods-to-be-pm-herzog-says-hell-announce-mandate-decision-on-sunday/"}, "b": "Israel's president says parties holding 67 of the 120 seats recommended Gadi Eisenkot, while 46 backed Benjamin Netanyahu. Herzog stressed the numbers alone will not decide it, because a leader needs 61 seats in a working coalition. Eisenkot's backers include Arab parties, but only about 48 seats are ready to cooperate without conditions, so a stalemate or another election is still possible.", "w": "Who governs Israel shapes the Iran war, Gaza and the wider Middle East, all of which move oil and markets."}, {"h": "Trump says Russia and Ukraine are close to a settlement and tees up Abu Dhabi talks", "s": {"t": "CNN via KRDO", "u": "https://krdo.com/politics/cnn-us-politics/2026/11/06/trump-teases-big-beautiful-european-security-deal-after-meeting-putin-envoy-2/"}, "b": "After meeting Russian envoy Kirill Dmitriev, Trump said he thinks the two sides are very close and promised a security deal that might involve all of Europe. He gave few details and European capitals were left puzzled. Zelensky says Ukraine has sent its proposals to Washington and wants binding, enforceable security guarantees. Trilateral talks are expected in Abu Dhabi next week.", "w": "A deal on Ukraine would reshape European security and energy and grain markets. Trump's claims of closeness have not been confirmed by Kyiv or Moscow."}], "quick": [{"x": "Democrats will hold at least 54 Senate seats including independents who caucus with them, after a sweep of both chambers, though a few races were still being counted.", "t": "NPR", "u": "https://www.npr.org/2026/11/04/nx-s1-6027319/democrats-sweep-senate-and-house-in-a-resounding-rebuke-to-trump-gop"}, {"x": "Trump says he was a little surprised by the result but is willing to accept it, while noting he can still veto Democratic bills.", "t": "ABC News (US)", "u": "https://abcnews.com/Politics/trump-bit-surprised-after-democrats-big-win-midterms/story?id=137835787"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Voters back dozens of local limits on data centres in the midterms", "s": {"t": "Washington Post", "u": "https://washingtonpost.com/technology/2026/11/04/voters-pass-over-20-ballot-measures-ban-or-restrict-data-centers"}, "b": "Voters passed more than 20 ballot measures that ban or restrict data centres on Tuesday, and other reports count dozens of local laws in total, with the exact tally still disputed. Rising electricity prices have turned the giant buildings that power AI into a local political issue. It is one of the main reasons AI and chip shares sold off so hard on Thursday.", "w": "AI spending is the engine behind much of the US share market and the ASX's data centre stocks. Local limits slow that build out."}, {"h": "Sanders and Ocasio Cortez back a national data centre moratorium", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/05/democrats-data-center-restrictions-midterms.html"}, "b": "Top Democrats are calling to rein in the AI build out now that they control Congress. Bernie Sanders says he wants a national data centre moratorium, meaning a pause on new construction, and he and Alexandria Ocasio Cortez have announced a bill to do it. A bill that passes the House still needs the Senate and Trump's signature, and he can veto it.", "w": "The bill is a long shot for now, but it shows the direction of travel. Markets are pricing in the risk that AI gets more regulated, not less."}, {"h": "OpenAI publishes a community compact and ends data centre NDAs", "s": {"t": "The National", "u": "https://www.thenationalnews.com/future/technology/2026/11/06/moratorium-on-data-centers-openai-compact/"}, "b": "OpenAI released a National Community Compact and a policy blueprint for what it now calls compute campuses on 5 November, as local opposition grew. One report says it will also drop non disclosure agreements with communities near its sites. Observers noted the compact avoids the words data centre.", "w": "AI firms are now courting local voters, not just regulators. Expect more promises on power costs and jobs."}, {"h": "Nvidia bounces after its worst day in almost two years, with earnings due 17 November", "s": {"t": "Kiplinger", "u": "https://www.kiplinger.com/investing/stocks/nasdaq-adds-264-points-in-tech-rebound-but-ends-the-week-lower-stock-market-today"}, "b": "After falling about 9.3% on Thursday, Nvidia rose roughly 3% on Friday and the Nasdaq added about 1.1% to 24,579, though the index ended the week lower and is still in correction territory. Dip buyers returned after the jobs report beat forecasts. Nvidia reports quarterly results on 17 November US time.", "w": "Nvidia is the AI bellwether, so its results will show whether the rout was an overreaction or the start of something bigger."}], "quick": [{"x": "Euronews has a rundown of which AI companies are most exposed to the data centre backlash.", "t": "Euronews", "u": "https://www.euronews.com/2026/11/06/data-centre-backlash-which-ai-companies-have-been-affected-by-us-midterm-results"}, {"x": "CNBC reports the AI data centre build out has become a war of attrition after the midterm shock.", "t": "CNBC", "u": "https://cnbc.com/2026/11/06/ai-data-center-midterms-selloff.html"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "Albanese says the Iran war and tariffs drove the US result but he will not change course", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-07/albanese-trump-iran-war-midterms-chogm-budget/107356124"}, "b": "Back from the Commonwealth leaders' meeting, Albanese called the US midterm results very significant and named the Iran war and tariffs as major factors in the Republican loss. He said his approach to the White House stays the same and that he will keep calling for the war to end.", "w": "Australia relies on Washington for defence and AUKUS, so a Democratic Congress could matter for trade, tariffs and the submarine deal."}, {"h": "Productivity Commission calls the economy increasingly stagnant", "s": {"t": "Yahoo Finance", "u": "https://au.finance.yahoo.com/news/treasurer-jim-chalmers-puts-tax-changes-off-limits-in-productivity-commissions-search-to-fix-stagnant-economy-231454329.html"}, "b": "The Productivity Commission's interim report on business dynamism, meaning how easily new firms start, grow and win customers, says the economy has become increasingly stagnant. Chalmers asked for the inquiry and ruled tax and workplace relations out of its focus, which business groups dislike. The final report with modelling is due in May 2027.", "w": "Weak productivity is one reason the RBA says inflation is stuck, so reforms here feed directly into interest rates."}, {"h": "Chalmers rejects blame for the rate hike as the Coalition attacks spending", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-03/chalmers-promises-helpful-role-on-inflation-after-rate-hike/107342610"}, "b": "After the RBA's fifth hike this year, Chalmers said the government will play a helpful role on inflation but that the budget is not what is pushing prices up. Shadow Treasurer Tim Wilson says a spending addiction is fuelling inflation. Annual inflation hit 4.3% in September, and the government has promised more savings in next month's mid year budget update.", "w": "With rates at their highest since 2008, this argument will define the politics of the cost of living through to the next election."}], "quick": [{"x": "The ABC's analysis piece argues the midterm rout holds lessons for Albanese's government on budget breaks and the rate outlook.", "t": "ABC News", "u": "https://abc.net.au/news/2026-11-07/rba-outlook-not-time-slam-budget-breaks-midterms-albanese/107356846"}, {"x": "Acting PM Richard Marles called the US midterms a great democratic event while Albanese was away at CHOGM.", "t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-05/federal-politics-live-blog-screen-limits-nov-5/107346422"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "Big four banks pass on the RBA hike in full from 13 November", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-04/australian-banks-lift-interest-rates-after-rba-cash-rate-hike/107341858"}, "b": "Commonwealth Bank, Westpac, NAB, ANZ and ING will lift variable home loan rates by 0.25 percentage points from 13 November. That adds roughly $77 a month on a $500,000 mortgage. Savings rates are rising too, but less sharply and often only for customers who meet bonus conditions.", "w": "About 13 November is when this shows up in repayments, so household budgets and retail spending get squeezed again."}, {"h": "NAB profit falls 13% as bad debt charges nearly double", "s": {"t": "Market Index", "u": "https://www.marketindex.com.au/news/nab-fy26-result-shares-head-for-worst-day-since-february-2025-as-bad-debts-nearly-double"}, "b": "NAB's full year cash earnings fell 13.4% to $6.14 billion, including $1.35 billion of large one off items, and missed analyst forecasts. Credit impairment charges, money set aside for loans that may not be repaid, rose from $833 million to $1.55 billion. The final dividend was held at 85 cents and the shares fell between 5% and 7% on the day, depending on the report. Shares go ex dividend on 10 November.", "w": "Higher provisions suggest the bank expects more borrowers to struggle as rates climb, which is a warning for the wider economy."}, {"h": "ASX slips 0.5% but still finishes the week up 1.2%", "s": {"t": "Market Index", "u": "https://www.marketindex.com.au/news/evening-wrap-asx-200-slides-on-us-tech-rout-but-big-banks-and-defensives"}, "b": "The ASX 200 closed down 44.3 points at 9,020.8 after Thursday's 2.6% surge, with local investors unsettled by the US tech rout. Big banks and defensive stocks helped it recover from deeper losses earlier in the day. The Australian dollar fell to about 69 US cents.", "w": "UBS argues the ASX looks like a relative safe haven while doubts grow about the AI spending boom, since it holds fewer AI heavy stocks."}, {"h": "Scentre rejected as David Jones fights for a buyer", "s": {"t": "Reuters via Investing.com", "u": "https://www.investing.com/news/stock-market-news/australian-retailer-david-jones-enters-administration-and-faces-sale-media-reports-5001887"}, "b": "The 188 year old retailer entered voluntary administration with McGrathNicol after talks with landlord Westfield broke down. Scentre Group says David Jones had paid rent up to 30 September, and reports say owner Anchorage Capital rejected a Scentre lifeline. Lender Hilco says it will keep supporting the business while new owners are found. Its 38 stores are still trading, but gift card holders are worried.", "w": "It is a test of how much pressure higher rates and weak spending are putting on Australian retailers."}], "quick": [{"x": "US employers added 165,000 jobs in October, well above forecasts, and unemployment slipped to 4.1%.", "t": "CNBC", "u": "https://www.cnbc.com/2026/11/06/jobs-report-october-2026.html"}, {"x": "Brent crude fell to about US$93 a barrel on Thursday as hopes for Iran diplomacy built.", "t": "Gulf News", "u": "https://gulfnews.com/world/mena/trump-weighs-iran-strikes-or-deal-after-midterm-loss-as-vance-urges-agreement-qatar-mediates-brent-oil-falls-to-93-1.500736556"}]}], "explainer": {"term": "Credit impairment charge", "body": "A credit impairment charge is money a bank sets aside today to cover loans it expects will not be fully repaid. It comes straight out of profit, so a bigger charge means lower earnings even if the bank is lending as much as before. Banks raise it when they expect more borrowers to fall behind, for example because of higher interest rates or a weaker economy. NAB's charge nearly doubled this year, which is why its profit fell. If the money is not needed, the bank can release it later and boost profit."}, "ahead": [{"d": "Sun 8 Nov", "e": "Israeli President Herzog is due to announce who gets the first go at forming a government."}, {"d": "Mon 9 Nov", "e": "Week begins with US, Russia and Ukraine trilateral talks expected in Abu Dhabi at some point (exact day not confirmed)."}, {"d": "Tue 10 Nov", "e": "NAB shares trade ex dividend (85 cents)."}, {"d": "Fri 13 Nov", "e": "Big four banks' higher variable mortgage rates start."}, {"d": "Wed 18 Nov", "e": "Nvidia reports quarterly results after the US close on 17 November (Wednesday morning in Australia)."}]}
</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
