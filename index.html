<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A ten minute daily briefing on world affairs, tech, and Australian politics and business.">
<title>Daily Scoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: one reading column, masthead with edition navigation, numbers strip, four desks, explainer, week ahead */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14202E; --muted:#596777; --rule:#D5DCE3;
  --accent:#2C6B5A; --accent-soft:#E2EFEA; --warn:#8A5D14; --warn-soft:#F6ECD9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --ink:#E5EBF0; --muted:#92A1AF; --rule:#25323E;
  --accent:#72BDA5; --accent-soft:#18302A; --warn:#E0B36A; --warn-soft:#2E2414; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.mast h1{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.92;margin:0;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast .date{font-family:var(--display);font-stretch:90%;font-weight:600;font-size:20px;margin:0}

/* edition navigation */
.ednav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.btn{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);
  padding:6px 11px;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
details.archive{position:relative}
details.archive summary{list-style:none}
details.archive summary::-webkit-details-marker{display:none}
details.archive[open] summary{border-color:var(--accent);color:var(--accent)}
.archive-panel{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px}
.archive-panel button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit}
.archive-panel button:hover{background:var(--accent-soft)}
.archive-panel button[aria-current="true"]{background:var(--accent-soft)}
.archive-panel .ad{font-family:var(--display);font-weight:700;font-size:15px}
.archive-panel .at{font-size:13.5px;color:var(--muted);line-height:1.35}
.archive-panel .empty{font-size:14px;color:var(--muted);padding:10px}
.oldbanner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.oldbanner .btn{border-color:var(--warn);color:var(--warn);background:transparent}

nav.desks{display:flex;flex-wrap:wrap;gap:8px}
nav.desks a{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:5px 10px;border-radius:999px}
nav.desks a:hover{border-color:var(--accent);color:var(--accent)}

.lede{background:var(--accent-soft);border-radius:6px;padding:18px 20px}
.lede h2,.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.lede ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.lede li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}

.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.num{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.num .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.num .l{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.num .n{font-size:13px;color:var(--muted);line-height:1.35}

section.desk{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.desk-head .mins{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
article{display:flex;flex-direction:column;gap:6px}
article h3{font-family:var(--display);font-stretch:95%;font-weight:700;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
article p{margin:0}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-2px}
.src a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.quick .src{margin:0}
.why{font-size:15.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.quick{border-top:1px dashed var(--rule);padding-top:12px}
.quick ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:15.5px}

.explain{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.explain h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.ahead table{width:100%;border-collapse:collapse;font-size:15.5px}
.ahead td{padding:8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ahead td:first-child{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;padding-right:16px;width:1%}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script type="application/json" id="brief">
{"date": "2026-11-10", "edition": "Tuesday 10 November 2026", "lede": ["Wall Street had its best day since April as oil slid about 6% on hopes of a US and Iran deal, even with Nvidia sinking over its CEO's reported link to an alleged Chinese spy.", "Russia, Ukraine and the US sit down in Abu Dhabi today, but Moscow says Europe has no seat at the table.", "Three polls out this week have Labor level with or behind One Nation and the Coalition on primary votes, with Labor down in the mid twenties."], "numbers": [{"label": "ASX 200", "value": "9,029.7", "note": "Close on Mon 9 Nov, up 0.1% after an early slide; futures point higher today"}, {"label": "AUD/USD", "value": "69.26 US cents", "note": "Per ABC markets blog, Tue 10 Nov"}, {"label": "Brent crude", "value": "US$92.57", "note": "Settled Mon 9 Nov, down 5.85% on the day"}, {"label": "S&P 500", "value": "7,549.83", "note": "Close on Mon 9 Nov, up about 2.3%, the biggest daily gain since April"}], "sections": [{"id": "world", "name": "World", "stories": [{"h": "Eisenkot and Liberman agree on who gets the Knesset speaker job", "s": {"t": "Ynet", "u": "https://www.ynetnews.com/article/bkbp4kkrmg"}, "b": "Israel's new Knesset is sworn in today. Gadi Eisenkot, who has the mandate to form a government, and Avigdor Liberman have agreed the speakership should go to someone from Eisenkot's party, though the name is being held back until other partners sign off. Eisenkot says he won't swear in a new government until Netanyahu's speaker, Amir Ohana, is replaced. Ohana has said he will allow a vote within a week if 61 MPs sign a request.", "w": "Whoever controls the speaker's chair controls the parliamentary agenda, so this vote is the first real test of whether Eisenkot's bloc holds together."}, {"h": "Kremlin says Europe is not welcome at the Abu Dhabi talks", "s": {"t": "The Moscow Times", "u": "https://www.themoscowtimes.com/2026/11/09/kremlin-rejects-european-role-in-upcoming-abu-dhabi-talks-a94207"}, "b": "US brokered talks between Russia and Ukraine run today and tomorrow in Abu Dhabi. France says European officials will attend, but the Kremlin says the format is limited to Russian, Ukrainian and US delegations. Vladimir Medinsky is again expected to lead Moscow's side, and analysts expect little real progress. Zelensky says he coordinated positions with the European Commission's president before the meeting.", "w": "Any deal on Ukraine's future would reshape European security, which is why who sits at the table matters as much as what is agreed."}, {"h": "Trump meets Qatar's prime minister, but no Iran deal yet", "s": {"t": "Washington Examiner", "u": "http://www.washingtonexaminer.com/news/white-house/4797046/trump-qatar-iran-deal-joint-end-the-war-statement-schumer-jeffries/"}, "b": "Mediators are pushing a two day plan: the US lifts its naval blockade of Iranian ports and releases some frozen assets, Iran admits nuclear inspectors, then the Strait of Hormuz reopens. Monday's closed door meeting at the White House ended with no announcement, and Rubio called some Iranian demands outrageous. Trump told CNN new strikes are highly unlikely.", "w": "Hormuz carries a big share of the world's oil, so each hint of a deal or a breakdown moves fuel prices, inflation and interest rate expectations, including in Australia."}, {"h": "China extends its pause on 24% tariffs on US goods by two months", "s": {"t": "ANI", "u": "https://aninews.in/news/business/china-extends-suspension-of-24-additional-tariff-on-us-goods-for-two-months-retains-10-levy20261109111249/"}, "b": "Beijing will keep suspending an extra 24% tariff on US goods from 10 November, leaving a 10% levy in place. It also extends waivers on some critical mineral export controls and suspended port fees on US linked ships until 10 January 2027. I did not find a matching US announcement for the earlier 10 November deadline on its side.", "w": "China is Australia's biggest trading partner, so a calmer US China truce supports demand for our iron ore and other exports."}], "quick": [{"x": "Haaretz reports the Haredi party United Torah Judaism will not join the push to replace Ohana, a blow to the numbers Eisenkot needs.", "t": "Haaretz", "u": "https://www.haaretz.com/israel-news/elections/2026-11-09/ty-article/.premium/haredi-party-declines-to-back-anti-netanyahu-blocs-bid-to-oust-knesset-speaker/000001a1-c088-d3c0-a1af-e1aca9cf0000"}, {"x": "The Washington Post says Washington has already handed Moscow an early win by calling for a broader European security architecture as part of any deal.", "t": "Washington Post", "u": "https://www.washingtonpost.com/world/2026/11/09/us-gives-russia-an-early-win-even-before-ukraine-peace-talks-begin-abu-dhabi/"}]}, {"id": "tech", "name": "Tech", "stories": [{"h": "Nvidia's board investigates CEO Jensen Huang over alleged Chinese spy link", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/08/nvidia-jensen-huang-investigation-china-spy.html"}, "b": "Nvidia's board is forming a committee of independent directors, with outside counsel, to examine Huang's relationship with a Megaspeed executive that US intelligence reportedly regards as a Chinese spy. Huang told staff he had an affair with her. The board says it has no reason to believe national security or company secrets were compromised, and China calls the allegations groundless. Three House committee chairs have asked him to brief Congress on 18 November. Nvidia shares fell about 6% on Monday to their lowest since April.", "w": "Nvidia sits at the centre of the AI boom and US China chip rules, so a leadership cloud can rattle the whole sector and the index funds Australians hold through super."}, {"h": "Anthropic releases Claude Fable 5.2 and Mythos 5.2 days before a possible IPO", "s": {"t": "CNBC", "u": "https://www.cnbc.com/2026/11/09/anthropic-claude-fable-5-2-mythos-5-2.html"}, "b": "Fable 5.2 is publicly available, while Mythos 5.2 is limited to vetted organisations in Anthropic's life sciences and cyber verification programs. Anthropic says output is up to 30% faster than the 5.1 versions. It is the company's first frontier release since its CEO called for a slowdown in AI development in September. Reports say an IPO roadshow could start next week, with valuation talk of US$1 trillion or more.", "w": "A listing of this size would be one of the biggest ever and a test of whether markets still have an appetite for AI after last week's rout."}, {"h": "Anthropic tells business customers an outside security firm accessed their account data", "s": {"t": "MLQ.ai", "u": "https://mlq.ai/news/anthropic-emails-enterprise-customers-that-an-outside-security-firm-may-have-viewed-their-contact-plan-and-spend-data/"}, "b": "Anthropic is emailing enterprise customers that a third party security research company accessed contact and account details such as plan tier and spend figures. It says conversations, passwords and payment details were not involved, and the firm has certified in writing that it deleted the data. Korean media report that about 100 Korean corporate accounts were affected and that the country's privacy regulator is reviewing it.", "w": "It is a reminder that even well resourced AI firms can be exposed through their suppliers, which matters for any Australian business feeding data into these tools."}], "quick": [{"x": "Wall Street's tech rebound continued on Monday, with the Nasdaq up about 2.7% to 25,250.55 even as Nvidia slumped.", "t": "Virginia Business (Reuters)", "u": "https://virginiabusiness.com/us-stocks-rally-oil-prices-ease-inflation-nvidia-slump/"}]}, {"id": "auspol", "name": "Aus Politics", "stories": [{"h": "New polls put One Nation level with or ahead of Labor", "s": {"t": "The Poll Bludger", "u": "https://www.pollbludger.net/2026/11/09/federal-polls-resolve-strategic-and-redbridge-group-open-thread/"}, "b": "The Redbridge poll for the AFR has One Nation on 28%, Labor 26%, the Coalition 25% and the Greens 13%, with the Coalition ahead 53 to 47 on two party preferred. Resolve for the Nine papers has Labor 28%, One Nation 25%, Coalition 22%. A YouGov poll had One Nation 27%, Labor 25%, Coalition 23%. Albanese leads as preferred PM in Redbridge on 30%, ahead of Hanson on 24% and Angus Taylor on 16%.", "w": "With three parties polling in the twenties, preference flows and seat by seat contests will matter far more than the headline numbers at the next election."}, {"h": "Government drops sale of Sydney's Victoria Barracks", "s": {"t": "Canberra Times", "u": "https://www.canberratimes.com.au/story/9387614/barracks-to-be-opened-to-the-public-after-sale-backflip/"}, "b": "Anthony Albanese announced on Sunday that the heritage listed Sydney barracks will stay in public hands, with parts of the Paddington site opened to the public. Melbourne's Victoria Barracks, Fort Queenscliff and RAAF Williams are also off the sale list. Albanese denies it was a backflip, while the Coalition says it will keep fighting to save other sites. The broader Defence estate reform program continues. Capital Brief notes NSW Premier Chris Minns was absent from the announcement amid friction with Canberra.", "w": "The audit behind the sales said many sites cost too much to maintain, so the saving the government hoped for now has to come from elsewhere."}, {"h": "One Nation rejects an extra staffer from the PM in an ongoing staffing fight", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-10-29/one-nation-mp-turns-down-extra-staffer-from-pm/107325240"}, "b": "In late October One Nation MP David Farley turned down an extra adviser offered by Albanese, and Pauline Hanson accused the PM of trying to divide the party. The PM decides personal staff levels above the five electorate officers every MP gets. Modelling cited in coverage shows One Nation with far fewer staff per parliamentarian than Labor or the Coalition. The government says the offer matched what Barnaby Joyce received.", "w": "With One Nation now polling near the top, how well it is resourced in Parliament is becoming a real political question."}], "quick": [{"x": "The Senate is due to sit again from 16 November, with committees reporting on bills including Fair Super and affordable housing.", "t": "Parliament of Australia", "u": "https://www.aph.gov.au/-/media/02_Parliamentary_Business/22_Chamber_Documents/221_Senate/Notice_Paper/Current_Notice_Paper/current_Notice_Paper.pdf"}]}, {"id": "ausbiz", "name": "Aus Business", "stories": [{"h": "ASX claws back to 9,029.7 as miners lift and banks lag", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-09/asx-markets-business-live-news/107361534"}, "b": "The ASX 200 dipped below 9,000 early on Monday before closing 0.1% higher at 9,029.7. Materials stocks led, while all four major banks finished lower, with ANZ dropping after its result despite a $7.59 billion cash profit. The Australian dollar rose to about 69 US cents.", "w": "The big banks are a large chunk of the index and of many super balances, so a bank led wobble shows up in retirement savings."}, {"h": "Oil slides almost 6% as US and Iran deal hopes build", "s": {"t": "ABC News", "u": "https://www.abc.net.au/news/2026-11-10/asx-markets-business-live-news-november-10-2026/107363300"}, "b": "Brent crude settled down US$5.75, or 5.85%, at US$92.57 on Monday after a heavy fall the previous week. The drop helped Wall Street surge, and ASX futures pointed to a stronger open today. Investors are also watching US inflation data due in Australian time early Wednesday.", "w": "Cheaper oil would ease petrol prices and inflation, which could take pressure off the RBA after it lifted the cash rate to 4.85%."}, {"h": "Households are gloomy ahead of today's consumer sentiment reading", "s": {"t": "Westpac IQ", "u": "https://library.westpaciq.com.au/content/dam/public/westpaciq/secure/economics/documents/aus/2026/10/er20261006BullConsumerSentiment.pdf"}, "b": "The Westpac Melbourne Institute index is due at 11am AEDT today. October's reading fell 4.7% to 80.4, well under the long run average of about 100. Over 80% of consumers expected mortgage rates to rise over the next year, and fuel prices were a big worry.", "w": "Weak sentiment usually means people hold back on spending, which slows retailers and the wider economy."}], "quick": [{"x": "Goodman and Digital Realty say their 9.9% NEXTDC stake, bought at an average of $9.22 a share, is not a takeover bid for now, though they reserve the right to make one.", "t": "Law360 Australia", "u": "https://www.law360.com/au/articles/2547709"}, {"x": "Metals X has until 20 November to firm up or drop its offer for UK listed First Tin, after the Takeover Panel extended the deadline.", "t": "TipRanks", "u": "https://tipranks.com/news/company-announcements/metals-x-extends-deadline-for-potential-first-tin-offer"}]}], "explainer": {"term": "Brent crude", "body": "Brent is the main global benchmark price for oil, named after a North Sea oil field. It is quoted in US dollars per barrel and tracks crude from the Atlantic basin. Many contracts around the world, including a lot of the fuel Australia imports, are priced off it. When Brent falls, petrol and freight costs tend to ease a few weeks later, which helps inflation. When it jumps, such as when the Strait of Hormuz is threatened, central banks like the RBA worry more about prices."}, "ahead": [{"d": "Tue 10 Nov", "e": "Israel's new Knesset is sworn in, with the speaker fight to follow."}, {"d": "Tue 10 Nov", "e": "US, Russian and Ukrainian delegations meet in Abu Dhabi, with talks running to Wednesday."}, {"d": "Wed 11 Nov", "e": "US October CPI inflation data lands early Australian time; NAB business confidence is also listed for the day."}, {"d": "Mon 16 Nov", "e": "Senate sits again until 19 November."}, {"d": "Wed 18 Nov", "e": "Australia's Wage Price Index is due, and Jensen Huang has been asked to brief US lawmakers."}, {"d": "Fri 20 Nov", "e": "Deadline for Metals X to firm up or drop its First Tin offer (London time)."}]}
</script>

<script>
(function(){
  var CURRENT = JSON.parse(document.getElementById('brief').textContent);
  var app = document.getElementById('app');
  var index = null;          // list of {date, edition, top}, newest first
  var indexState = 'loading';
  var shown = CURRENT;

  function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+'</a>';}
  function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
  function qtext(q){return typeof q==='string'?q:q.x;}

  function neighbours(date){
    if(!index) return {prev:null,next:null};
    var i = index.findIndex(function(e){return e.date===date});
    if(i<0) return {prev:null,next:null};
    return {prev:index[i+1]||null, next:index[i-1]||null};
  }

  function render(d){
    shown = d;
    app.innerHTML = '';
    var isCurrent = d.date === CURRENT.date;

    var total = 0;
    (d.lede||[]).forEach(function(x){total+=words(x)});
    if(d.explainer) total+=words(d.explainer.body);
    var secMins = d.sections.map(function(s){
      var w=0; s.stories.forEach(function(t){w+=words(t.h)+words(t.b)+words(t.w)}); (s.quick||[]).forEach(function(q){w+=words(qtext(q))});
      total+=w; return Math.max(1,Math.round(w/230));
    });
    var mins = Math.max(1,Math.round(total/230));

    var mast = el('header','mast');
    mast.appendChild(el('div','meta','<span>Geopolitics · Tech · Australia</span><span>'+mins+' min read</span>'));
    mast.appendChild(el('h1',null,'Daily <span>Scoop</span>'));
    mast.appendChild(el('p','date',esc(d.edition)));

    // edition navigation
    var nb = neighbours(d.date);
    var nav = el('div','ednav');
    var prev = el('button','btn','‹ Previous day'); prev.type='button'; prev.id='prev-day';
    prev.disabled = !nb.prev; if(nb.prev){prev.title=nb.prev.edition; prev.onclick=function(){go(nb.prev.date)};}
    var next = el('button','btn','Next day ›'); next.type='button'; next.id='next-day';
    next.disabled = !nb.next; if(nb.next){next.title=nb.next.edition; next.onclick=function(){go(nb.next.date)};}

    var det = el('details','archive');
    var sum = el('summary','btn','Past editions ▾'); det.appendChild(sum);
    var panel = el('div','archive-panel');
    if(indexState==='loading') panel.appendChild(el('div','empty','Loading editions…'));
    else if(indexState==='error' || !index || !index.length) panel.appendChild(el('div','empty','The archive could not be loaded right now. Today\'s edition is still below.'));
    else {
      if(index.length===1) panel.appendChild(el('div','empty','This is the first edition. Past days will build up here from tomorrow.'));
      index.forEach(function(e){
        var b = el('button'); b.type='button';
        if(e.date===d.date) b.setAttribute('aria-current','true');
        b.appendChild(el('span','ad',esc(e.edition)+(e.date===CURRENT.date?' · Latest':'')));
        if(e.top) b.appendChild(el('span','at',esc(e.top)));
        b.onclick=function(){det.open=false; go(e.date)};
        panel.appendChild(b);
      });
    }
    det.appendChild(panel);

    nav.appendChild(prev); nav.appendChild(det); nav.appendChild(next);
    if(!isCurrent){var t=el('button','btn primary','Latest edition'); t.type='button'; t.onclick=function(){go(CURRENT.date)}; nav.appendChild(t);}
    mast.appendChild(nav);
    app.appendChild(mast);

    if(!isCurrent){
      var ob = el('div','oldbanner','<span>You\'re reading an older edition from '+esc(d.edition)+'.</span>');
      var back = el('button','btn','Back to latest'); back.type='button'; back.onclick=function(){go(CURRENT.date)};
      ob.appendChild(back); app.appendChild(ob);
    }

    var dn = el('nav','desks'); dn.setAttribute('aria-label','Sections');
    d.sections.forEach(function(s){var a=el('a',null,esc(s.name)); a.href='#'+s.id; dn.appendChild(a);});
    if(d.ahead && d.ahead.length){var a2=el('a',null,'Week ahead'); a2.href='#ahead'; dn.appendChild(a2);}
    app.appendChild(dn);

    var lede = el('div','lede');
    lede.appendChild(el('h2',null,'Three things to know'));
    var ol = el('ol'); (d.lede||[]).forEach(function(x){ol.appendChild(el('li',null,esc(x)))});
    lede.appendChild(ol); app.appendChild(lede);

    if(d.numbers && d.numbers.length){
      var nums = el('div','numbers');
      d.numbers.forEach(function(n){
        var c=el('div','num');
        c.appendChild(el('span','l',esc(n.label)));
        c.appendChild(el('span','v',esc(n.value)));
        c.appendChild(el('span','n',esc(n.note)));
        nums.appendChild(c);
      });
      app.appendChild(nums);
    }

    d.sections.forEach(function(s,i){
      var sec = el('section','desk'); sec.id = s.id;
      var head = el('div','desk-head');
      head.appendChild(el('h2',null,esc(s.name)));
      head.appendChild(el('span','mins',secMins[i]+' min'));
      sec.appendChild(head);
      s.stories.forEach(function(t){
        var a = el('article');
        a.appendChild(el('h3',null,esc(t.h)));
        if(t.s) a.appendChild(el('div','src','Source: '+link(t.s)));
        a.appendChild(el('p',null,esc(t.b)));
        a.appendChild(el('p','why','<b>Why it matters</b>'+esc(t.w)));
        sec.appendChild(a);
      });
      if(s.quick && s.quick.length){
        var q = el('div','quick'); q.appendChild(el('div','label','Quick hits'));
        var ul = el('ul'); s.quick.forEach(function(x){
          ul.appendChild(el('li',null, typeof x==='string' ? esc(x) : esc(x.x)+' <span class="src">('+link(x)+')</span>'));
        });
        q.appendChild(ul); sec.appendChild(q);
      }
      app.appendChild(sec);
    });

    if(d.explainer){
      var ex = el('div','explain');
      ex.appendChild(el('div','label','Explainer of the day'));
      ex.appendChild(el('h3',null,esc(d.explainer.term)));
      ex.appendChild(el('p',null,esc(d.explainer.body)));
      app.appendChild(ex);
    }

    if(d.ahead && d.ahead.length){
      var ah = el('section','desk ahead'); ah.id='ahead';
      var hh = el('div','desk-head'); hh.appendChild(el('h2',null,'Week ahead')); ah.appendChild(hh);
      var tb = el('table'); d.ahead.forEach(function(r){
        var tr=el('tr'); tr.appendChild(el('td',null,esc(r.d))); tr.appendChild(el('td',null,esc(r.e))); tb.appendChild(tr);
      });
      var wrap = el('div'); wrap.style.overflowX='auto'; wrap.appendChild(tb); ah.appendChild(wrap);
      app.appendChild(ah);
    }

    app.appendChild(el('footer',null,'Updated each morning around 9:30am Canberra time. Edition dated '+esc(d.date)+'.'));
  }

  function go(date){
    if(date===CURRENT.date){ render(CURRENT); setHash(''); window.scrollTo(0,0); return; }
    fetch('editions/'+date+'.json',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ render(d); setHash(date); window.scrollTo(0,0); })
      .catch(function(){ alertBanner('That edition could not be loaded. Try again in a moment.'); });
  }
  function setHash(h){ try{ history.replaceState(null,'',h?('#'+h):location.pathname+location.search); }catch(e){} }
  function alertBanner(msg){ var b=el('div','oldbanner','<span>'+esc(msg)+'</span>'); app.insertBefore(b, app.children[1]||null); setTimeout(function(){b.remove()},5000); }

  render(CURRENT);

  fetch('editions/index.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){
      index = list.slice().sort(function(a,b){return a.date<b.date?1:-1});
      indexState='ok';
      var h = location.hash.slice(1);
      if(/^\d{4}-\d{2}-\d{2}$/.test(h) && h!==CURRENT.date && index.some(function(e){return e.date===h})) go(h);
      else render(shown);
    })
    .catch(function(){ indexState='error'; render(shown); });

  var h0 = location.hash.slice(1);
  if(h0 && !/^\d/.test(h0)){ var t=document.getElementById(h0); if(t) t.scrollIntoView(); }
})();
</script>

</body>
</html>
